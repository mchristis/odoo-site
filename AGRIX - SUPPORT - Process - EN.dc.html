<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<title>AGRIX Process | STRØHM.ENERGY</title>
<link rel="stylesheet" href="_ds/emon-strohm-energy-design-system-19842d9c-a171-4ea8-9e9e-bb2ea0c78d1d/colors_and_type.css">
<link rel="stylesheet" href="strohm-type.css">
<script src="_ds/emon-strohm-energy-design-system-19842d9c-a171-4ea8-9e9e-bb2ea0c78d1d/_ds_bundle.js"></script>
<script src="./image-slot.js"></script>
<style>
  body { margin:0; background:#FFFFFF; }
  a { color:var(--color-text-primary); text-decoration:none; }
  a:hover { color:#6B8E4E; }
</style>
</helmet>

<div style="font-family:var(--font-web);background:#FFFFFF;min-height:100vh;color:var(--color-text-primary);">
  <dc-import name="NavBar" active="products" hint-size="100%,80px"></dc-import>
  <dc-import name="AgrixNav" active="structures" hint-size="100%,57px"></dc-import>

  <dc-import name="PageHero" brand="AGRIX" rgb="107,142,78" eyebrow="Project process" title="The structure is only one part of the project." intro="A credible Agri-PV process coordinates agriculture, structure, water, electricity, access, safety, permitting and lifecycle documentation &#8212; from crop and field data through to commissioning and long-term operation." slot="agrix-process-hero" shot="AGRIX · Process · hero photo or short muted loop (3–6 s)" hint-size="100%,625px"></dc-import><section style="max-width:calc(1312px + 2 * var(--web-side));margin:0 auto;padding:40px var(--web-side) 0;box-sizing:border-box;">
    <div style="font-size:12px;font-weight:300;color:var(--color-grey-70);margin-bottom:20px;"><a href="AGRIX - PRODUCT - Overview - EN.dc.html" style="color:var(--color-grey-70);">Agri-PV</a> &#8250; <span style="color:var(--color-text-primary);">PROJECT PROCESS</span></div>
    
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:44px;">
      <a href="AGRIX - PRODUCT - Crop Selector - EN.dc.html" style="font-size:var(--cta-font);padding:0 22px;height:44px;display:inline-flex;align-items:center;background:#6B8E4E;color:#FFFFFF;border-radius:var(--radius-btn);font-weight:var(--web-btn-weight);">Start with the selector<svg width="0.5em" height="0.9em" viewBox="0 0 8 14" aria-hidden="true" style="display:inline-block;vertical-align:-0.12em;margin-left:0.4em;flex:none;"><polyline points="1,1 7,7 1,13" fill="none" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"></polyline></svg></a>
      <a href="AGRIX - SUPPORT - Engineering - EN.dc.html" style="font-size:var(--cta-font);padding:0 22px;height:44px;display:inline-flex;align-items:center;background:var(--color-surface-card);color:var(--color-text-primary);border-radius:var(--radius-btn);font-weight:var(--web-btn-weight);">Submit a project</a>
    </div>
  </section>

  <section style="max-width:calc(1312px + 2 * var(--web-side));margin:0 auto;padding:40px var(--web-side) 0;box-sizing:border-box;">
    <div style="border-top:1px solid var(--color-divider);padding-top:40px;">
      <div style="font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);letter-spacing:var(--web-eyebrow-ls);text-transform:uppercase;color:var(--color-grey-70);margin-bottom:24px;">Eight steps, from farm data to operation</div>
      <div data-cols="4" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;--cg:12px;">
        <sc-for list="{{ steps }}" as="s" hint-placeholder-count="8">
          <div style="background:#F4F4F4;padding:24px 22px;border-radius:12px;">
            <div style="font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);color:#6B8E4E;margin-bottom:10px;letter-spacing:var(--web-eyebrow-ls);">{{ s.n }}</div>
            <div style="font-size:var(--web-h3-size);font-weight:var(--web-h3-weight);margin-bottom:6px;line-height:var(--web-h3-lh);">{{ s.title }}</div>
            <div style="font-size:var(--web-min-size);font-weight:300;color:var(--color-text-primary);line-height:var(--web-min-lh);">{{ s.desc }}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </section>

  <div style="height:96px;"></div>
  <dc-import name="ContentSections" brand="AGRIX" scope="brand" hint-size="100%,1600px"></dc-import>
  <dc-import name="ReachSpecialist" brand="AGRIX" hint-size="100%,420px"></dc-import>
  <dc-import name="SupportModule" kind="product" brand="AGRIX" accent="var(--color-brand-agrix)" hint-size="100%,520px"></dc-import>
  <dc-import name="Footer" hint-size="100%,400px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1400,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    return {
      steps: [
        { n: "01", title: "Agricultural & site intake", desc: "Record crop or livestock, rotation, climate, machinery, water and field geometry." },
        { n: "02", title: "Preliminary selector & calculator", desc: "Compare TWIG and HEDGE and create an initial project file with assumptions and warnings." },
        { n: "03", title: "Engineering review", desc: "Confirm surveys, agronomic review, geotechnics, structural loads, drainage, grid and permitting path." },
        { n: "04", title: "Detailed design & approvals", desc: "Complete structure, foundations, electrical, water, safety, access and documentation." },
        { n: "05", title: "Production & logistics", desc: "Manufacture standard components and project-specific parts; prepare installation packs and traceability." },
        { n: "06", title: "Installation & commissioning", desc: "Install, test, map and register products; verify safety, drainage, access and agricultural function." },
        { n: "07", title: "Automatic project PDF", desc: "Issue the as-built layout, serials, strings, test records, warranty and service information through EMON." },
        { n: "08", title: "O&M & agricultural review", desc: "Inspect structure, electrical system, drainage, vegetation, protection zones and project documentation." },
      ],
    };
  }
}
</script>
</body>
</html>
