<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const TC = (w) => `[TO CONFIRM: ${w}]`;
    return {
      intro: "Measured airflow, tested heat recovery, declared efficiency and a documented end-of-life route. Every claim on this page is linked to a document.",
      durability: [
        { test: "Performance of residential ventilation units", standard: "EN 13141 series (applicable)", result: TC("result per model") },
        { test: "Heat recovery efficiency", standard: "EN 308 (applicable)", result: TC("efficiency per model") },
        { test: "Ecodesign of ventilation units", standard: "Regulation (EU) 1253/2014 (applicable)", result: TC("compliance per model") },
        { test: "Energy label", standard: "Regulation (EU) 1254/2014 (applicable)", result: TC("label class per model") },
      ],
      materials: [
        { label: "Refrigerant", headline: "Refrigerant declared where used.", value: "GUST uses R32. " + TC("charge per model and F-gas documentation"), dir: "AIRO_RESPONSIBILITY_MATERIALS_REFRIGERANT_01 · GUST rating plate detail · 16:10 · placeholder (P2)" },
        { label: "Declarations", headline: "Substances declared, not assumed.", value: "REACH and RoHS declarations per model. " + TC("which declarations exist"), dir: "AIRO_RESPONSIBILITY_MATERIALS_DECLARATION_01 · declaration document preview · 16:10 · placeholder (P2)" },
      ],
      certs: [
        { code: "CE", label: "CE marking under the applicable directives " + TC("per model") },
        { code: "ISO 9001", label: "Quality management " + TC("held for AIRO production") },
        { code: "ISO 14001", label: "Environmental management " + TC("held for AIRO production") },
      ],
      packaging: TC("packaging materials and pallet take-back"),
      eol: ["Unit in use", "Filters and parts replaced through the spare parts programme", "Disconnected by an installer", "Separate collection under the WEEE Directive 2012/19/EU", "Approved treatment and material recovery", "Closed ownership record"],
    };
  }
}
</script>
