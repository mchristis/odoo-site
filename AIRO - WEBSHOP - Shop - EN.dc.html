/* ws brand-switcher bar (injected) */
.wsbar{position:sticky;top:0;z-index:50;background:var(--color-text-primary);color:#fff;font-family:var(--font-web)}
.wsbar-in{max-width:1100px;margin:0 auto;padding:0 26px;height:52px;display:flex;align-items:center;justify-content:space-between;gap:16px}

.wsbar-menu>summary::-webkit-details-marker{display:none}
.wsbar-menu[open]>summary{background:#2a2a28}

const CATEGORY_ORDER=["Decentralized In-Room MVHR","Centralized MVHR Heat Pump","MVHR Controls & Accessories","Duct System","Air Valves / Vent Covers"];
const SERIES_ORDER=["SHIFT","SWAP","WAVE","GUST","ACC","ROUTE"];
function clean(s){return String(s||"").replace(/₂/g,"2").replace(/³/g,"3").replace(/Ø/g,"dia ").replace(/“|”/g,'"').trim()}
function airflow(txt){const m=clean(txt).match(/(\d+)\s*M3\s*\/\s*H/i)||clean(txt).match(/(\d+)\s*m3\s*\/\s*h/i);return m?+m[1]:0}
function diameter(txt){const m=clean(txt).match(/dia\s*(\d+)/i);return m?`dia ${m[1]} mm`:"n.a."}
function stage(art,note){return /TBD|Pending|newly assigned/i.test(art+" "+note)?"Taxonomy / config stage":"Orderable demo SKU"}
function seriesLabel(s){return {SHIFT:"SHIFT - through-wall MVHR",SWAP:"SWAP - wall unit dual-duct MVHR",WAVE:"WAVE - floor-standing MVHR",GUST:"GUST - centralized MVHR heat pump",ACC:"ACC - controls/accessories",ROUTE:"ROUTE - ducts and vents"}[s]||s}
function unitType(series,cat,desc){if(series==="SHIFT")return"Through-wall decentralized unit";if(series==="SWAP")return"Wall unit dual-duct";if(series==="WAVE")return"Floor-standing in-room unit";if(series==="GUST")return"Centralized ducted heat-pump unit";if(series==="ACC")return"Control / accessory";if(cat==="Duct System")return"Duct system component";if(cat==="Air Valves / Vent Covers")return"Air valve / vent cover";return cat}
function functionFor(cat,name,desc){const s=clean(cat+" "+name+" "+desc);if(/Decentralized/i.test(cat))return"MVHR unit";if(/Centralized/i.test(cat))return"MVHR heat-pump unit";if(/switch|sensor|controller|gateway|zonecontrol/i.test(s))return"Control / sensor";if(/preheater|heater/i.test(s))return"Preheater / heating accessory";if(/stand|frame/i.test(s))return"Mounting accessory";if(/plenum/i.test(s))return"Distribution plenum";if(/duct section/i.test(s))return"Duct section";if(/coupling|connector/i.test(s))return"Duct connector";if(/bend|elbow/i.test(s))return"Duct bend";if(/valve connection/i.test(s))return"Valve connection";if(/balancing valve/i.test(s))return"Balancing valve";if(/transition/i.test(s))return"Transition adapter";if(/vent cover|vent/i.test(s))return"Air valve / vent cover";return cat}
function features(desc){const s=clean(desc),out=[];if(/Wi-?Fi|APP GATEWAY/i.test(s))out.push("Wi-Fi / app");if(/CO2|CO₂/i.test(desc))out.push("CO2 sensor/control");if(/RH|humidity/i.test(s))out.push("Humidity RH control");if(/RF/i.test(s))out.push("RF control");if(/PTC|preheater|heating/i.test(s))out.push("PTC heating/preheat");if(/HEPA/i.test(s))out.push("HEPA option");if(/F7|MERV13/i.test(s))out.push("F7 / MERV13 filter option");return out.length?out:["No smart/filter feature stated"]}
function install(p){if(p.category.includes("Decentralized"))return"Installer wall opening and condensate/air path confirmation required";if(p.category.includes("Centralized"))return"HVAC installer and duct design required";if(p.category.includes("Duct")||p.category.includes("Valves"))return"Duct layout and airflow commissioning required";return"Compatible with central MVHR system"}
function basePrice(p){let v=90+p.i*12;if(p.category.includes("Decentralized"))v=520+p.i*70;if(p.category.includes("Centralized"))v=2200+p.air*2.2;if(p.category.includes("Controls"))v=80+p.i*18;if(p.category.includes("Duct"))v=45+p.i*6;if(p.category.includes("Valves"))v=55+p.i*5;if(p.stage.includes("Taxonomy"))v=Math.max(60,Math.round(v*.7));return Math.round(v/10)*10}
function routes(p){const base=basePrice(p),project=p.category.includes("Centralized")||p.category.includes("Decentralized"),moq=project?1:6,euq=project?4:30;return{EU:{q:euq,r:0,eta:"1 to 2 working days",moq:`${moq} pcs`,moqs:`${moq} pcs`,pr:base,locs:[{w:"Rotterdam NL",q:Math.ceil(euq*.45)},{w:"Hamburg DE",q:Math.ceil(euq*.30)},{w:"Poznan PL",q:Math.max(1,Math.floor(euq*.25))}]},Floating:{q:Math.max(moq*2,Math.round(euq*.55)),r:moq,eta:"under 6 weeks",moq:`${moq} pcs`,moqs:`${moq} pcs`,pr:Math.round(base*.97),sh:"AIRO 2026 "+String((p.i%8)+1).padStart(2,"0"),date:"08 Sep 2026"},Factory:{q:project?8:70,r:moq*2,eta:"under 8 weeks",moq:`${project?2:20} pcs`,moqs:`${project?2:20} pcs`,pr:Math.round(base*.94)},MTO:{q:null,r:0,eta:"under 10 weeks",moq:`${project?1:50} pcs`,moqs:`${project?1:50} pcs`,pr:Math.round(base*.91)}}}
const PRODUCTS=RAW.map((r,i)=>{const p={i,domain:r[0],series:r[1],category:r[2],goods:r[3],art:r[4],note:r[5],desc:r[6]};p.seriesLabel=seriesLabel(p.series);p.unitType=unitType(p.series,p.category,p.desc);p.function=functionFor(p.category,p.note,p.desc);p.features=features(p.desc);p.air=airflow(p.desc);p.airLabel=p.air?`${p.air} m3/h`:"n.a.";p.dia=diameter(p.desc);p.stage=stage(p.art,p.note);p.install=install(p);p.rt=routes(p);return p});
const RDEF={EU:{label:"EU stock",mark:"ok"},Floating:{label:"Floating stock",mark:"info"},Factory:{label:"Factory stock",mark:"warn"},MTO:{label:"Manufacturing order",mark:"idle"}},ORDER=["EU","Floating","Factory","MTO"],PAY={EU:"100%",Floating:"100%",Factory:"30 / 70 %",MTO:"30 / 70 %"},LOGIC={EU:"Ships from EU warehouse. 30 minute payment reservation; first completed payment wins.",Floating:"In transit under a named shipment. Reserved by others reduces free-to-order count.",Factory:"Ex-factory warehouse. Useful for installer and project stock.",MTO:"Made to order. Deposit confirms production slot; balance before dispatch."};
const DEFINITIONS=[
 {key:"category",label:"Product category",kick:"Technical",get:p=>[p.category],order:CATEGORY_ORDER},
 {key:"unit",label:"Unit / installation type",kick:"Subfilter",get:p=>[p.unitType],parent:"category"},
 {key:"series",label:"Series",kick:"Subfilter",get:p=>[p.series],order:SERIES_ORDER,parent:"category"},
 {key:"function",label:"Function / component type",kick:"Subfilter",get:p=>[p.function],parent:"category"},
 {key:"features",label:"Control / filter feature",kick:"Technical",get:p=>p.features},
 {key:"air",label:"Airflow capacity",kick:"Subfilter",get:p=>p.air?[p.airLabel]:[],order:["350 m3/h","620 m3/h","950 m3/h"],parent:"category"},
 {key:"dia",label:"Duct diameter",kick:"Subfilter",get:p=>p.dia==="n.a."?[]:[p.dia],order:["dia 125 mm","dia 150 mm","dia 180 mm"],parent:"category"},
 {key:"stage",label:"Product stage",kick:"Technical",get:p=>[p.stage],order:["Orderable demo SKU","Taxonomy / config stage"]},
 {key:"av",label:"Availability",kick:"Commercial",get:p=>ORDER.filter(r=>hasStock(p,r)).map(r=>RDEF[r].label),order:ORDER.map(r=>RDEF[r].label),mark:true,authOnly:true}
].filter(c=>c.authOnly||new Set(PRODUCTS.flatMap(p=>c.get(p)).filter(Boolean)).size>1);
const state={auth:false,checks:{},openCats:{}};DEFINITIONS.forEach(c=>state.checks[c.key]=new Set());
const hasStock=(p,r)=>r==="MTO"||p.rt[r].q>0,eur=n=>"EUR "+Math.round(n).toLocaleString("en-GB"),WCO={"Rotterdam NL":0,"Hamburg DE":.03,"Poznan PL":.06},whPrice=(base,w)=>Math.round(base*(1+(WCO[w]||0))),euLine=p=>Math.min(...p.rt.EU.locs.map(l=>whPrice(p.rt.EU.pr,l.w))),minPrice=p=>Math.min(euLine(p),p.rt.Floating.pr,p.rt.Factory.pr,p.rt.MTO.pr);
function match(p,except){for(const c of DEFINITIONS){if(c.key===except)continue;const s=state.checks[c.key];if(s.size&&!c.get(p).some(v=>s.has(v)))return false}return true}
function countFor(k,v,scope=()=>true){const c=DEFINITIONS.find(x=>x.key===k);return PRODUCTS.filter(p=>scope(p)&&match(p,k)&&c.get(p).includes(v)).length}
function valuesFor(c,scope){let vals=[...new Set(PRODUCTS.filter(scope).flatMap(p=>c.get(p)).filter(Boolean))];if(c.order)vals.sort((a,b)=>c.order.indexOf(a)-c.order.indexOf(b));else vals.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));return vals}
function shell(l,k){return `<div class="sec"><button><span>${l}<span class="kick">${k}</span></span><span class="pm"></span></button><div class="body">`}
function opt(c,v,n){const mk=c.mark?`<span class="mark ${RDEF[ORDER.find(r=>RDEF[r].label===v)]?.mark||""}"></span>`:"";return `<label class="opt" ${n===0?'style="display:none"':''} data-key="${c.key}" data-val="${v}"><input type="checkbox" ${state.checks[c.key].has(v)?"checked":""} style="accent-color:var(--color-brand-airo, #4F4F4E);width:20px;height:20px;"><span class="box"></span><span>${mk}${v}</span><span class="cnt">${n}</span></label>`}
function nestedLabel(cat,c){if(c.key==="function"&&cat==="Duct System")return"ROUTE component type";if(c.key==="function"&&cat==="Air Valves / Vent Covers")return"Vent / valve type";return c.label}
function nestedForCategory(cat){const scope=p=>p.category===cat;let html="";for(const key of ["unit","function","air","dia"]){const c=DEFINITIONS.find(x=>x.key===key);if(!c)continue;const vals=valuesFor(c,scope);if(vals.length<=1)continue;html+=`<div class="nest ${state.openCats[cat]?"":"closed"}"><div class="nestcap">${nestedLabel(cat,c)}</div>${vals.map(v=>opt(c,v,countFor(c.key,v,scope))).join("")}</div>`}return html}
function categoryBlock(c,v){const n=countFor(c.key,v),open=!!state.openCats[v];return `<div class="catblock"><div class="catrow">${opt(c,v,n)}<button class="subtoggle ${open?"open":""}" data-cat="${v}" aria-label="Open subfilters for ${v}">${open?"v":">"}</button></div>${nestedForCategory(v)}</div>`}
function checkHTML(c){let vals=valuesFor(c,()=>true);let html=shell(c.label,c.kick);vals.forEach(v=>{html+=c.key==="category"?categoryBlock(c,v):opt(c,v,countFor(c.key,v))});return html+"</div></div>"}
function buildFilters(){const top=["category","series","features","stage"].map(k=>DEFINITIONS.find(c=>c.key===k)).filter(Boolean);const commercial=DEFINITIONS.filter(c=>c.authOnly&&state.auth);document.getElementById("filters").innerHTML=[...top,...commercial].map(checkHTML).join("");document.querySelectorAll(".sec>button").forEach(b=>b.onclick=()=>b.parentElement.classList.toggle("collapsed"))}
function chips(){let h="";DEFINITIONS.forEach(c=>state.checks[c.key].forEach(v=>h+=`<span class="chip" data-key="${c.key}" data-val="${v}"><b>${c.label}</b> ${v}<button>x</button></span>`));const el=document.getElementById("chips");el.innerHTML=h;el.querySelectorAll("button").forEach(b=>b.onclick=()=>{const ch=b.closest(".chip");state.checks[ch.dataset.key].delete(ch.dataset.val);refresh()});document.getElementById("clearAll").disabled=!h}
function sortOptions(){const s=document.getElementById("sort"),cur=s.value;let opts=[["category","Product category"],["series","Series"],["air","Airflow, high to low"]];if(state.auth)opts.push(["speed","Availability, fastest first"],["price","Price, low to high"]);s.innerHTML=opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join("");s.value=opts.some(o=>o[0]===cur)?cur:"category"}
function warrantyBox(p){const base=basePrice(p),two=Math.round(base*.08/10)*10,five=Math.round(base*.16/10)*10;return `<div class="warrantybox"><div class="wtitle">Warranty system can be ordered</div><div class="wopts"><div class="wopt"><b>Standard warranty</b><span>Included - registered by serial number</span></div><div class="wopt"><b>+2 years extension</b><span>${eur(two)} - order with product</span></div><div class="wopt"><b>+5 years extension</b><span>${eur(five)} - service conditions apply</span></div></div></div>`}
function route(p,r){const d=p.rt[r],line=r==="EU"?euLine(p):d.pr,qty=r==="MTO"?"Made to order":`<b>${d.q} pcs</b> available`;let detail="";if(r==="EU")detail=`<div class="rdgrid">${d.locs.map(l=>`<div class="rd"><div class="k">${l.w}</div><div class="v">${l.q} pcs, ${eur(whPrice(d.pr,l.w))}</div></div>`).join("")}</div>`;else if(r==="Floating")detail=`<div class="rdgrid"><div class="rd"><div class="k">Available</div><div class="v">${d.q} pcs</div></div><div class="rd"><div class="k">Reserved</div><div class="v">${d.r} pcs</div></div><div class="rd"><div class="k">Shipment</div><div class="v">${d.sh}</div></div><div class="rd"><div class="k">ETA</div><div class="v">${d.date}</div></div></div>`;else detail=`<div class="rdgrid"><div class="rd"><div class="k">Minimum order</div><div class="v">${d.moq}</div></div><div class="rd"><div class="k">Route</div><div class="v">${r==="MTO"?"Made to order":"Factory stock"}</div></div></div>`;return `<details class="route"><summary><span class="mark ${RDEF[r].mark}"></span><span>${RDEF[r].label}</span><span>${d.eta}</span><span>MOQ ${d.moqs}</span><span>${qty}</span><b>${eur(line)}</b><span></span></summary><div class="rdetail">${detail}<div class="pay">Payment terms: <b>${PAY[r]}</b></div><div class="rlogic">${LOGIC[r]}</div><div class="orderblock"><button class="obtn go">Order now</button></div></div></details>`}
function info(p){const rows=[["Brand","AIRO"],["Product category",p.category],["Unit / installation type",p.unitType],["Series",p.seriesLabel],["Function",p.function],["Features",p.features.join(", ")],["Airflow",p.airLabel],["Duct diameter",p.dia],["Product stage",p.stage],["Installation route",p.install],["Warranty extension","Can be ordered"]];const downloads=["Datasheet","Installation manual","Airflow commissioning sheet","Filter replacement guide","Warranty extension terms"];return `<details class="pinfo-acc"><summary>Product information</summary><div class="pitabs"><button class="pitab active" data-pt="desc">Description</button><button class="pitab" data-pt="spec">Specifications</button><button class="pitab" data-pt="dl">Downloads</button></div><div class="pipanel" data-pt="desc"><p class="desc">${p.desc}</p></div><div class="pipanel hide" data-pt="spec"><div class="spectable">${rows.map(r=>`<div class="specr"><span class="sk">${r[0]}</span><span class="sv">${r[1]}</span></div>`).join("")}</div></div><div class="pipanel hide" data-pt="dl"><div class="dllist">${downloads.map(d=>`<a class="dlx" href="#download">${d} - AIRO ${p.series}<span>></span></a>`).join("")}</div></div></details>`}
function imageClass(p){if(p.category.includes("Controls"))return"control";if(p.category.includes("Duct")||p.category.includes("Valves"))return"duct";return"unit"}
function cards(){let list=PRODUCTS.filter(p=>match(p,"__none__")),s=document.getElementById("sort").value;list.sort((a,b)=>s==="series"?a.series.localeCompare(b.series):s==="air"?b.air-a.air:s==="price"?minPrice(a)-minPrice(b):a.category.localeCompare(b.category)||a.series.localeCompare(b.series));document.getElementById("rcount").textContent=list.length;const root=document.getElementById("cards");if(!list.length){root.innerHTML='<div class="empty-res"><b>No AIRO products match.</b> Loosen a filter.</div>';return}root.innerHTML=list.map(p=>`<article class="card"><div class="gallery"><div class="gview"><div class="ph ${imageClass(p)} view-photo" data-series="${p.series}"><span>AIRO<br>${p.series}<br>Photo</span></div></div><div class="gtabs"><button class="gtab active" data-view="Photo">Photo</button><button class="gtab" data-view="3D">3D</button><button class="gtab" data-view="Technical">Technical</button><button class="gtab" data-view="Install">Install</button></div></div><div class="c-body"><div class="c-head"><h3>AIRO ${p.series}<span class="artcode">${p.art}</span></h3><div><a class="dl" href="#datasheet">Datasheet</a><a class="dl" href="#downloads">Downloads</a></div></div><div class="c-sub">${p.category} · ${p.unitType}<span class="installtag">${p.install}</span></div><div class="specrow"><div class="spec"><div class="k">Series</div><div class="v">${p.series}</div></div><div class="spec"><div class="k">Airflow</div><div class="v">${p.airLabel}</div></div><div class="spec"><div class="k">Diameter</div><div class="v">${p.dia}</div></div><div class="spec"><div class="k">Stage</div><div class="v">${p.stage}</div></div></div><div class="eprline">AIRO products require compatibility confirmation for room volume, duct layout, airflow commissioning, filter replacement and condensate/penetration details before order release.</div>${state.auth?`<div class="pricenote">Prices, stock, warranty extension, warehouse split and MOQ are provisional demo data</div>${warrantyBox(p)}<div>${ORDER.map(r=>route(p,r)).join("")}</div>`:'<button class="gatebar">Log in to see availability, price and warranty options</button>'}${info(p)}</div></article>`).join("")}
function foot(){document.getElementById("foot").innerHTML='<b>AIRO filter logic v6:</b> Series is a normal visible selectable filter: SHIFT, SWAP, WAVE, GUST, ACC and ROUTE. Product category remains the parent filter; press > to open only the category-specific subfilters such as Unit / installation type, ROUTE component type, Airflow and Duct diameter. <br><b>ANDO warehouse method:</b> sidebar shows Availability only. Warehouse split appears inside the EU stock route after login. Warranty extension can be ordered from the commercial section after login.'}
