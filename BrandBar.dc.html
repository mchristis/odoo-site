<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="strohm-type.css">
<script src="./section-nav-data.js"></script>
<script src="./brandbar-data.js"></script>
<style>

</style>
</helmet>
<div data-bb="" ref="{{ rootRef }}" style="height:57px;font-family:var(--font-web);">

      <svg aria-hidden="true" width="18" height="9" viewBox="0 0 22 11" fill="none" stroke="{{ shopDot }}" stroke-width="1.2" style="flex:none;align-self:center;transition:transform .2s ease;transform:rotate({{ brandRot }});"><polyline points="1.5,1.5 11,9.5 20.5,1.5"></polyline></svg>
      <sc-if value="{{ showDesc }}" hint-placeholder-val="{{ true }}"><span style="font-size:var(--web-nav-size);font-weight:300;color:#666666;line-height:var(--web-small-lh);">· {{ category }}</span></sc-if>
    </button>
    <sc-if value="{{ isWide }}" hint-placeholder-val="{{ true }}">
      <nav aria-label="{{ navLabel }}" style="flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:32px;height:56px;">
        <sc-for list="{{ slots }}" as="s" hint-placeholder-count="4">
          <div ref="{{ s.ref }}" onMouseEnter="{{ s.onEnter }}" onMouseLeave="{{ hoverOut }}" style="flex:none;display:flex;align-items:center;gap:6px;height:56px;box-sizing:border-box;border-bottom:4px solid {{ s.underline }};">
            <a href="{{ s.href }}" aria-current="{{ s.ariaCurrent }}" style="text-decoration:none;font-size:var(--web-nav-size);font-weight:{{ s.weight }};color:{{ s.color }};white-space:nowrap;" style-hover="color:#222222;">{{ s.label }}</a>
            <button type="button" aria-label="{{ s.menuLabel }}" aria-expanded="{{ s.expanded }}" onClick="{{ s.onToggle }}" style="cursor:pointer;background:none;border:none;padding:0;width:1px;height:28px;overflow:hidden;opacity:0;margin-left:-6px;display:flex;align-items:center;justify-content:center;color:{{ s.color }};" style-hover="color:#222222;">

            </button>

          <a href="{{ g.href }}" style="text-decoration:none;display:flex;align-items:center;min-height:44px;font-size:15px;font-weight:500;color:#222222;">{{ g.label }}</a>
          <sc-for list="{{ g.items }}" as="i" hint-placeholder-count="2">
            <a href="{{ i.href }}" style="text-decoration:none;display:flex;align-items:center;min-height:44px;padding-left:16px;font-size:var(--web-nav-size);font-weight:300;color:#666666;">{{ i.label }}</a>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </sc-if>
</div>
</div>
</x-dc>

      brandOpen: st.panel === "brand", brandExpanded: st.panel === "brand" ? "true" : "false", brandRot: st.panel === "brand" ? "180deg" : "0deg",
      toggleBrand: () => this.setState((s) => ({ panel: s.panel === "brand" ? null : "brand" })),
      slots,
      showTool: !!(d && d.tool) && wide, toolLabel: d && d.tool ? d.tool[0] : "", toolHref: d && d.tool ? d.tool[1] : "#",
      toolWeight: toolOn ? 500 : 300, toolCurrent: toolOn ? "page" : "false",
      shopLabel: d && d.shop ? d.shop[0] : "", shopHref: d && d.shop ? d.shop[1] : "#",
      ddOpen: ddItems.length > 0, ddItems, ddLabel: (defs.find(([k]) => k === st.panel) || [0, ""])[1] + " pages",
      ddLeft: st.left + "px", ddCols: Math.min(3, Math.max(1, Math.ceil(ddItems.length / 9))),
      menuOpen: st.panel === "menu" && compact, menuExpanded: st.panel === "menu" ? "true" : "false",
      toggleMenu: () => this.setState((s) => ({ panel: s.panel === "menu" ? null : "menu" })),
      menuGroups,
    };
  }
}
