  heading="Covered routes that generate power."
  intro="Arcades, canopies, bus shelters and noise barriers for places where people arrive, wait and move. Designed for public use, vandal resistance and long maintenance intervals."
  body="Public structures carry requirements that private structures do not: free passage, accessibility, lighting, resistance to vandalism, municipal approvals and maintenance by third parties. The PV roof must never compromise the primary function of shelter and safe movement. CHILL public structures are designed around circulation beneath the roof, with drainage that does not discharge onto routes and electrical equipment placed out of public reach."

  guidance-heading="Route, movement or waiting?"
  guidance="{{ guidance }}"
  engineering="{{ engineering }}"
