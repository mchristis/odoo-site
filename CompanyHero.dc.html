<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/emon-strohm-energy-design-system-19842d9c-a171-4ea8-9e9e-bb2ea0c78d1d/colors_and_type.css">
<link rel="stylesheet" href="strohm-type.css">
<script src="_ds/emon-strohm-energy-design-system-19842d9c-a171-4ea8-9e9e-bb2ea0c78d1d/_ds_bundle.js"></script>
<script src="./image-slot.js"></script>
</helmet>
<section ref="{{ rootRef }}" data-screen-label="{{ label }}" style="position:relative;width:calc(100% - 2 * var(--web-side));max-width:1312px;margin:83px auto 0;min-height:var(--web-hero-h);border-radius:24px;overflow:hidden;background:#EBECEC;display:flex;align-items:stretch;">
  {{ imgEl }}
  <sc-for list="{{ slides }}" as="s" hint-placeholder-count="6">
    <div style="position:absolute;inset:0;opacity:{{ s.op }};pointer-events:{{ s.pe }};transition:opacity 0.9s ease;"><image-slot id="{{ s.id }}" shape="rect" placeholder="{{ s.ph }}"></image-slot></div>
  </sc-for>
  {{ videoEl }}
  <div style="position:relative;align-self:stretch;width:min(100%,max(40%,420px));box-sizing:border-box;padding:clamp(32px,4vw,56px) clamp(24px,4.5vw,67px);background:linear-gradient(rgba(247,104,1,0.3),rgba(247,104,1,0.3)),rgba(255,255,255,0.6);display:flex;flex-direction:column;justify-content:center;gap:24px;">{{ children }}</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1280px&quot;,&quot;height&quot;:&quot;640px&quot;},&quot;page&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;about&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;name&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;About&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;video&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;poster&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;children&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;React.ReactNode&quot;}}">
class Component extends DCLogic {
  state = { cur: 0 };
  componentDidMount() {
    this._rm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    this._t = setInterval(() => this.tick(), 6000);
    this._v = setInterval(() => this.vis(), 1200);
    this.vis();
  }
  componentWillUnmount() { clearInterval(this._t); clearInterval(this._v); }
  filled() {
    const el = this._root; if (!el) return [];
    return [...el.querySelectorAll('image-slot')].map((s, i) => (s.hasAttribute('data-filled') ? i : -1)).filter((i) => i >= 0);
  }
  tick() {
    if (this._rm || this.props.video) return;
    const f = this.filled(); if (f.length < 2) return;
    const k = f.indexOf(this.state.cur); this.setState({ cur: f[(k + 1) % f.length] });
  }
  vis() {
    const el = this._root; if (!el) return;
    const ed = !!(window.omelette && window.omelette.writeFile);
    document.querySelectorAll('[data-editor-only]').forEach((n) => { const w = ed ? '' : 'none'; if (n.style.display !== w) n.style.display = w; });
    const f = this.filled();
    const media = ed || f.length > 0 || !!this.props.video || !!this.props.img;
    if (this._fb !== (f.length === 0)) { this._fb = f.length === 0; this.forceUpdate(); }
    // No media for visitors: keep the heading and intro, drop the image card (text-only hero).
    const mh = media ? 'var(--web-hero-h)' : '0px', bg = media ? '#EBECEC' : 'transparent';
    if (el.style.minHeight !== mh) el.style.minHeight = mh;
    if (el.style.background !== bg) el.style.background = bg;
    el.querySelectorAll(':scope > div').forEach((d) => { if (d.querySelector('image-slot')) { const w = media ? '' : 'none'; if (d.style.display !== w) d.style.display = w; } });
    const panel = el.lastElementChild;
    if (panel) {
      if (panel.dataset.pad0 === undefined) panel.dataset.pad0 = panel.style.padding;
      const pw = media ? 'min(100%,max(40%,420px))' : '100%', pad = media ? panel.dataset.pad0 : '0px';
      if (panel.style.width !== pw) panel.style.width = pw;
      if (panel.style.padding !== pad) panel.style.padding = pad;
    }
    if (f.length && !f.includes(this.state.cur)) this.setState({ cur: f[0] });
  }
  renderVals() {
    const p = this.props.page || 'company', name = this.props.pageName || 'Company', cur = this.state.cur || 0;
    const slides = [0, 1, 2, 3, 4, 5].map((i) => ({ id: p + '-hero-' + (i + 1), ph: name + ' · hero picture ' + (i + 1) + ' of 6 · drop a photo', op: i === cur ? 1 : 0, pe: i === cur ? 'auto' : 'none' }));
    const v = this.props.video;
    const videoEl = v ? React.createElement('video', { key: 'v', src: v, poster: this.props.poster || undefined, autoPlay: !this._rm, muted: true, loop: true, playsInline: true, 'aria-hidden': 'true', style: { position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover' } }) : null;
    const im = this.props.img;
    const imgEl = (im && this._fb !== false && !v) ? React.createElement('img', { key: 'fb', src: im, alt: this.props.imgAlt || '', style: { position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', objectPosition: this.props.imgPos || 'center', pointerEvents: 'none' } }) : null;
    return { slides, videoEl, imgEl, label: (this.props.pageName || 'Company') + ' — Hero', rootRef: (el) => { this._root = el; } };
  }
}
</script>
</body>
</html>
