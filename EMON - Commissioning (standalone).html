        e.target.tagName, String(e.target.src || e.target.href || ''));

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin

    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;

      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

      const entry = manifest[uuid];

              const { done, value } = await reader.read();

            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"4d0a216b-940e-4710-b9cf-64ea17ad343b\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet data-dc-atomics=\"\">\n<script src=\"98fb3d00-1a29-455b-9fe1-54b7e5954e4d\"><\u002Fscript>\n<style>\n  body { margin:0; background:#FFFFFF; }\n  a { color:#1E1E1E; text-decoration:none; }\n  a:hover { color:#21AE8F; }\n  .em-step:hover { border-color:#21AE8F !important; }\n  .em-tab:hover { color:#1E1E1E !important; }\n  .em-field:hover { background:#FAFAFA !important; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:#FFFFFF;min-height:100vh;color:#1E1E1E;\">\n\n  <dc-import name=\"NavBar\" active=\"systems\" hint-size=\"100%,84px\"><\u002Fdc-import>\n  <dc-import name=\"EmonNav\" active=\"commissioning\" hint-size=\"100%,64px\"><\u002Fdc-import>\n\n  <!-- HERO -->\n  <section style=\"max-width:1440px;margin:0 auto;padding:76px 32px 0;\">\n    <div style=\"font-size:11px;font-weight:700;letter-spacing:0.11em;text-transform:uppercase;color:#B2B3B3;margin-bottom:20px;\">EMON commissioning<\u002Fdiv>\n    <h1 style=\"margin:0 0 22px;font-size:clamp(34px,4.4vw,56px);line-height:1.04;font-weight:700;letter-spacing:-0.03em;max-width:940px;\">Scan. Connect. Validate.<br><span style=\"font-weight:100;color:#5F5E5E;\">Document. Handover.<\u002Fspan><\u002Fh1>\n    <p style=\"margin:0 0 32px;font-size:16px;font-weight:300;line-height:1.6;color:#5F5E5E;max-width:800px;\">Commissioning is not a support feature — it is one of the main reasons EMON exists. A guided workflow scans the product, discovers the system, validates it, documents it and activates the warranty and digital passport.<\u002Fp>\n    <div style=\"aspect-ratio:16/9;background:#F5F5F5;\">\n      <image-slot id=\"emon-comm-hero\" shape=\"rect\" placeholder=\"Installer scans QR on MOEBIUS inverter; EMON discovers SYNQ and FLUXX nearby, validates and generates a commissioning PDF\"><\u002Fimage-slot>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 14-STEP FLOW -->\n  <section style=\"max-width:1440px;margin:0 auto;padding:96px 32px 0;\">\n    <div style=\"border-top:1px solid #D4D4D4;padding-top:40px;\">\n      <div style=\"font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#21AE8F;margin-bottom:16px;\">The commissioning flow<\u002Fdiv>\n      <h2 style=\"margin:0 0 32px;font-size:clamp(26px,3vw,34px);font-weight:400;line-height:1.2;max-width:680px;\">Fourteen guided steps, one automatic record.<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#D4D4D4;border:1px solid #D4D4D4;\">\n        <sc-for list=\"{{ flow }}\" as=\"f\" hint-placeholder-count=\"14\">\n          <div style=\"background:#FFFFFF;padding:18px 14px;display:flex;flex-direction:column;gap:8px;min-height:120px;\">\n            <span style=\"font-size:11px;font-weight:700;color:#21AE8F;\">{{ f.n }}<\u002Fspan>\n            <span style=\"font-size:12px;font-weight:400;line-height:1.35;color:#1E1E1E;\">{{ f.t }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ANDO / MOEBIUS DETAIL (interactive tabs) -->\n  <section style=\"background:#FAFAFA;margin-top:96px;\">\n    <div style=\"max-width:1440px;margin:0 auto;padding:80px 32px;\">\n      <div style=\"font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#21AE8F;margin-bottom:16px;\">Product-specific commissioning<\u002Fdiv>\n      <h2 style=\"margin:0 0 28px;font-size:clamp(26px,3vw,34px);font-weight:400;line-height:1.2;max-width:680px;\">{{ activeProduct.title }}<\u002Fh2>\n      <div style=\"display:inline-flex;border:1px solid #D4D4D4;background:#F5F5F5;margin-bottom:24px;\">\n        <sc-for list=\"{{ productTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n          <button class=\"em-tab\" sc-camel-on-click=\"{{ t.onClick }}\" style=\"cursor:pointer;font-family:inherit;border:none;background:{{ t.bg }};color:{{ t.color }};font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;padding:13px 24px;\">{{ t.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- intro + functions -->\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start;margin-bottom:16px;\">\n        <div>\n          <p style=\"margin:0 0 20px;font-size:15px;font-weight:300;line-height:1.7;color:#5F5E5E;\">{{ activeProduct.intro }}<\u002Fp>\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:#B2B3B3;margin-bottom:12px;\">Commissioning functions<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:8px 20px;\">\n            <sc-for list=\"{{ activeProduct.functions }}\" as=\"fn\" hint-placeholder-count=\"8\"><span style=\"font-size:13px;font-weight:300;line-height:1.5;color:#5F5E5E;display:flex;gap:8px;align-items:baseline;\"><span style=\"color:#21AE8F;font-size:9px;\">●<\u002Fspan>{{ fn }}<\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF;border:1px solid #21AE8F;\">\n          <div style=\"padding:16px 24px;border-bottom:1px solid #D4D4D4;background:#F0FAF7;display:flex;align-items:center;gap:10px;\">\n            <span style=\"font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#21AE8F;\">{{ activeProduct.pdfTitle }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:8px 24px 16px;\">\n            <sc-for list=\"{{ activeProduct.fields }}\" as=\"d\" hint-placeholder-count=\"10\">\n              <div class=\"em-field\" style=\"display:grid;grid-template-columns:150px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid #F5F5F5;align-items:baseline;\">\n                <span style=\"font-size:11px;font-weight:700;letter-spacing:0.02em;text-transform:uppercase;color:#B2B3B3;\">{{ d.k }}<\u002Fspan>\n                <span style=\"font-size:13px;font-weight:400;color:#1E1E1E;\">{{ d.v }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- scan document + as-built line diagram -->\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:32px;\">\n        <div style=\"background:#F5F5F5;border:1px solid #D4D4D4;padding:22px;\">\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#21AE8F;margin-bottom:4px;\">{{ activeProduct.scanTitle }}<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:300;color:#9A9A98;margin-bottom:16px;\">{{ activeProduct.scanSub }}<\u002Fdiv>\n          <sc-if value=\"{{ isAndo }}\" hint-placeholder-val=\"{{ true }}\">\n            <dc-import name=\"AndoScanSheet\" hint-size=\"100%,360px\"><\u002Fdc-import>\n            <div style=\"display:flex;flex-wrap:wrap;gap:16px;margin-top:16px;\">\n              <sc-for list=\"{{ scanLegend }}\" as=\"l\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:center;gap:7px;\"><span style=\"width:16px;height:12px;border:1.5px dashed {{ l.c }};display:inline-block;\"><\u002Fspan><span style=\"font-size:10px;font-weight:300;color:#6B6B69;\">{{ l.t }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isMoebius }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"aspect-ratio:4/3;background:#F5F5F5;\"><image-slot id=\"emon-cx-moebius-scandoc\" shape=\"rect\" placeholder=\"MOEBIUS location scan document: inverter position on the site plan, project reference, serial and QR code, phase and grid-code fields\"><\u002Fimage-slot><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"background:#F5F5F5;border:1px solid #D4D4D4;padding:22px;\">\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#21AE8F;margin-bottom:4px;\">As-built line diagram<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:300;color:#9A9A98;margin-bottom:16px;\">{{ activeProduct.lineSub }}<\u002Fdiv>\n          <div style=\"aspect-ratio:4/3;background:#F5F5F5;\"><image-slot id=\"{{ activeProduct.lineSlot }}\" shape=\"rect\" placeholder=\"{{ activeProduct.linePh }}\"><\u002Fimage-slot><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- product measured-record card (ANDO flash test / MOEBIUS validation) -->\n      <div style=\"margin-top:16px;background:#1E1E1E;padding:28px;display:grid;grid-template-columns:0.9fr 1.1fr;gap:40px;align-items:start;\">\n        <div>\n          <div style=\"font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#8A8A88;margin-bottom:14px;\">{{ activeProduct.measuredTitle }}<\u002Fdiv>\n          <div style=\"font-size:13px;font-weight:400;color:#21AE8F;margin-bottom:18px;\">{{ activeProduct.measuredRef }}<\u002Fdiv>\n          <div style=\"border-top:1px solid #2C2C2C;\">\n            <sc-for list=\"{{ activeProduct.measured }}\" as=\"m\" hint-placeholder-count=\"7\">\n              <div style=\"display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #2C2C2C;gap:12px;\">\n                <span style=\"font-size:13px;font-weight:300;color:#B2B3B3;\">{{ m.k }}<\u002Fspan>\n                <span style=\"font-size:13px;font-weight:400;color:#EDEDED;text-align:right;\">{{ m.v }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <p style=\"margin:0;font-size:15px;font-weight:300;line-height:1.6;color:#B8B8B5;\">{{ activeProduct.measuredNote }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- USP cards -->\n      <div style=\"margin-top:40px;\">\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#21AE8F;margin-bottom:16px;\">Why it matters<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#D4D4D4;border:1px solid #D4D4D4;\">\n          <sc-for list=\"{{ activeProduct.usps }}\" as=\"u\" hint-placeholder-count=\"4\">\n            <div style=\"background:#FFFFFF;padding:24px 22px;display:flex;flex-direction:column;gap:8px;min-height:170px;border-top:3px solid #21AE8F;\">\n              <div style=\"font-size:11px;font-weight:700;color:#B2B3B3;\">{{ u.n }}<\u002Fdiv>\n              <div style=\"font-size:15px;font-weight:700;line-height:1.25;\">{{ u.title }}<\u002Fdiv>\n              <p style=\"margin:0;font-size:13px;font-weight:300;line-height:1.55;color:#5F5E5E;\">{{ u.body }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- DIGITAL PASSPORT -->\n  <section style=\"max-width:1440px;margin:0 auto;padding:96px 32px 0;\">\n    <div style=\"border-top:1px solid #D4D4D4;padding-top:40px;display:grid;grid-template-columns:1fr 1.1fr;gap:48px;align-items:center;\">\n      <div>\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#21AE8F;margin-bottom:16px;\">Digital installation passport<\u002Fdiv>\n        <h2 style=\"margin:0 0 16px;font-size:clamp(24px,2.6vw,30px);font-weight:400;line-height:1.25;\">The record that outlives the installation visit.<\u002Fh2>\n        <p style=\"margin:0 0 16px;font-size:15px;font-weight:300;line-height:1.7;color:#5F5E5E;\">Every commissioned STROHM system receives a permanent digital passport — a single source of truth for service, warranty, resale and future replacement.<\u002Fp>\n        <p style=\"margin:0;font-size:14px;font-weight:300;line-height:1.7;color:#5F5E5E;\">Access: owner, authorised installer and STROHM support, transferable to a new owner or service company with permission controls.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:1px;background:#D4D4D4;border:1px solid #D4D4D4;\">\n        <sc-for list=\"{{ timeline }}\" as=\"t\" hint-placeholder-count=\"6\">\n          <div style=\"background:#FFFFFF;padding:16px 22px;display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:baseline;\">\n            <span style=\"font-size:11px;font-weight:700;letter-spacing:0.03em;text-transform:uppercase;color:#21AE8F;\">{{ t.stage }}<\u002Fspan>\n            <span style=\"font-size:13px;font-weight:300;line-height:1.5;color:#5F5E5E;\">{{ t.desc }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CTA -->\n  <section style=\"max-width:1440px;margin:0 auto;padding:96px 32px;\">\n    <div style=\"background:#1E1E1E;padding:56px;color:#FFFFFF;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between;\">\n      <div>\n        <h2 style=\"margin:0 0 8px;font-size:clamp(24px,3vw,32px);font-weight:400;color:#FFFFFF;\">Commission the whole system in one flow.<\u002Fh2>\n        <p style=\"margin:0;font-size:15px;font-weight:300;color:#B8B8B5;max-width:560px;\">Scan, validate, document and hand over — with a permanent passport and remote support from day one.<\u002Fp>\n      <\u002Fdiv>\n      <a href=\"EMON - Overview.dc.html#define\" style=\"font-size:12px;padding:0 26px;height:48px;display:inline-flex;align-items:center;background:#21AE8F;color:#FFFFFF;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;white-space:nowrap;\">Become an EMON installer<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <dc-import name=\"Footer\" show-ebook=\"{{ true }}\" hint-size=\"100%,400px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nconst PRODUCTS = [\n  { key: \"ando\", label: \"ANDO\", title: \"ANDO commissioning: every panel verified, mapped and documented.\",\n    intro: \"ANDO is solar hardware, so EMON does not control the panel directly. It documents, maps and connects each module to the system record using QR/NFC identity and the installer workflow.\",\n    functions: [\"Scan module QR code\", \"Register serial numbers\", \"Attach factory flash-test data\", \"Record measured peak power\", \"Map panel position on the roof\", \"Assign panel to string\", \"Assign string to MOEBIUS MPPT\", \"Record orientation and tilt\", \"Upload roof & installation photos\", \"Create panel layout plan\", \"Attach warranty information\", \"Generate commissioning PDF\"],\n    pdfTitle: \"ANDO commissioning record\", \n    fields: [\n      { k: \"Project\", v: \"Name & installation address\" }, { k: \"Installer\", v: \"Company & date\" },\n      { k: \"Module type\", v: \"Model & serial number\" }, { k: \"Flash-test\", v: \"Attached file & peak power\" },\n      { k: \"String\", v: \"String number & row / position\" }, { k: \"Orientation\", v: \"Azimuth & tilt\" },\n      { k: \"Inverter\", v: \"MOEBIUS & MPPT input\" }, { k: \"Photos\", v: \"Roof & installation evidence\" },\n      { k: \"Warranty\", v: \"Status & passport link\" },\n    ],\n    scanTitle: \"EMON ANDO solar panel scan sheet \\u2014 A4 landscape\",\n    scanSub: \"ANDO panels only \\u00b7 one QR code each window \\u00b7 36 panels per sheet. A single scan registers serial, position, orientation, string and warranty.\",\n    lineSub: \"Every physical roof position linked to its electrical position \\u2014 string, DC isolator, surge protection and MOEBIUS MPPT.\",\n    lineSlot: \"emon-cx-ando-line\",\n    linePh: \"ANDO as-built single-line string diagram: panels in electrical order with position code and short serial, DC isolator, surge protection, MOEBIUS inverter and MPPT assignment, string voltage / current and module count\",\n    measuredTitle: \"EMON app \\u2014 flash-test data per module\",\n    measuredRef: \"SN: ANDO-2026-SL-W-004471 \\u00b7 QR verified \\u2713\",\n    measured: [\n      { k: \"Pmax (measured)\", v: \"403 Wp\" }, { k: \"Nominal rated\", v: \"400 Wp\" },\n      { k: \"Short-circuit current Isc\", v: \"11,24 A\" }, { k: \"Open-circuit voltage Voc\", v: \"45,6 V\" },\n      { k: \"Fill factor FF\", v: \"79,8%\" }, { k: \"STC test date\", v: \"2026-03-14\" },\n      { k: \"EMON curve start value\", v: \"403 Wp \\u2190 measured\" },\n    ],\n    measuredNote: \"Every ANDO module is flash-tested before dispatch and the result is stored against the individual serial, not a batch. On the installation scan, EMON initialises the degradation curve from the measured Pmax \\u2014 so the 99% year-one and 80% year-30 guarantees track the real starting point, not the lower datasheet value.\",\n    usps: [\n      { n: \"01\", title: \"One-scan commissioning\", body: \"A single scan of the sheet registers serial, position, orientation, string diagram and warranty. No manual entry.\" },\n      { n: \"02\", title: \"Panel-level traceability\", body: \"Every panel traceable by serial from production to installation \\u2014 flash-test, shipment and registration on one record.\" },\n      { n: \"03\", title: \"Automatic warranty activation\", body: \"Warranty activates per panel at installation, not through a separate portal. Linked to the installed set from day one.\" },\n      { n: \"04\", title: \"Monitoring from measured value\", body: \"The EMON curve starts from the module's own measured output, so degradation monitoring is calibrated to reality.\" },\n    ] },\n  { key: \"moebius\", label: \"MOEBIUS\", title: \"MOEBIUS commissioning: inverter setup without scattered paperwork.\",\n    intro: \"EMON turns MOEBIUS commissioning into a structured guided process \\u2014 scan, connect to the project, map MPPTs and strings, confirm grid settings, link meter and battery, validate communication and create the record automatically.\",\n    functions: [\"QR scan / NFC tap\", \"Serial number recognition\", \"Wi-Fi mesh discovery\", \"Firmware status\", \"Grid-country & grid-code setting\", \"Phase setup\", \"MPPT & string mapping\", \"ANDO panel link\", \"Battery & SYNQ meter link\", \"EPS / backup status\", \"Export-limit setting\", \"Communication & pass/fail test\"],\n    pdfTitle: \"MOEBIUS commissioning record\",\n    fields: [\n      { k: \"Inverter\", v: \"Model & serial number\" }, { k: \"Firmware\", v: \"Version & status\" },\n      { k: \"Grid\", v: \"Country & grid code\" }, { k: \"Phase\", v: \"Single / three-phase\" },\n      { k: \"MPPT map\", v: \"Strings per MPPT\" }, { k: \"Panels\", v: \"Model & quantity per string\" },\n      { k: \"Battery\", v: \"FLUXX connection\" }, { k: \"Meter\", v: \"SYNQ connection\" },\n      { k: \"EPS / backup\", v: \"Setting & export-limit mode\" }, { k: \"Test result\", v: \"Pass/fail & photo evidence\" },\n    ],\n    scanTitle: \"MOEBIUS location scan document\",\n    scanSub: \"Scan the inverter QR to place it on the site plan and open the project. Position, serial, phase and grid code are captured in one action.\",\n    lineSub: \"The commissioned system drawn as one single-line diagram \\u2014 strings and MPPTs through the inverter to battery, meter and grid.\",\n    lineSlot: \"emon-cx-moebius-line\",\n    linePh: \"MOEBIUS as-built single-line diagram: strings \\u2192 MPPT 1 / MPPT 2 \\u2192 MOEBIUS inverter \\u2192 FLUXX battery and SYNQ meter \\u2192 grid, showing phase, export limit and EPS / backup path\",\n    measuredTitle: \"EMON app \\u2014 validation & communication test\",\n    measuredRef: \"SN: MOEBIUS-2026-HY-3P-002218 \\u00b7 QR verified \\u2713\",\n    measured: [\n      { k: \"Grid code\", v: \"VDE-AR-N 4105 \\u2713\" }, { k: \"Firmware\", v: \"Up to date \\u2713\" },\n      { k: \"MPPT / string map\", v: \"6 strings, 2 MPPT \\u2713\" }, { k: \"FLUXX battery link\", v: \"Connected \\u2713\" },\n      { k: \"SYNQ meter link\", v: \"Connected \\u2713\" }, { k: \"Export limit\", v: \"70% \\u2713\" },\n      { k: \"Communication test\", v: \"22 / 22 passed \\u2713\" },\n    ],\n    measuredNote: \"EMON walks the installer through firmware, grid code, phase and MPPT / string mapping, then links the FLUXX battery and SYNQ meter and runs the pass / fail checks. Nothing is written on paper \\u2014 the validated settings and communication test become the commissioning record automatically.\",\n    usps: [\n      { n: \"01\", title: \"Guided grid-code setup\", body: \"Country and grid code are selected from a guided list and validated \\u2014 no wrong-region settings, no re-visits.\" },\n      { n: \"02\", title: \"Whole-system linking\", body: \"Panels, battery and meter are mapped to the inverter in one flow, so the system is understood as one system.\" },\n      { n: \"03\", title: \"Communication pass / fail\", body: \"Every check runs on site and flags anything outside tolerance before handover, with photo evidence attached.\" },\n      { n: \"04\", title: \"Report generated automatically\", body: \"The MOEBIUS commissioning report and passport entry are produced from the validated data, not typed up later.\" },\n    ] },\n];\n\nclass Component extends DCLogic {\n  state = { product: 1 };\n  renderVals() {\n    const st = this.state;\n    return {\n      flow: [\n        { n: \"01\", t: \"Scan QR or tap NFC\" }, { n: \"02\", t: \"Identify product & serial\" },\n        { n: \"03\", t: \"Assign project & location\" }, { n: \"04\", t: \"Detect connected devices\" },\n        { n: \"05\", t: \"Confirm wiring & communication\" }, { n: \"06\", t: \"Map product relationships\" },\n        { n: \"07\", t: \"Upload installation photos\" }, { n: \"08\", t: \"Validate settings\" },\n        { n: \"09\", t: \"Run product-specific checks\" }, { n: \"10\", t: \"Generate commissioning report\" },\n        { n: \"11\", t: \"Activ
