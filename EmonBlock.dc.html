<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>

<x-dc>
<helmet data-dc-atomics>
<script src="./emon-block-data.js"></script>
<script src="./emon-explainers.js"></script>
<script src="./range-data.js"></script>

@keyframes eb-line { 0% { stroke-dashoffset: 120; } 100% { stroke-dashoffset: 0; } }

</helmet>

      <image-slot id="{{ photoSlot }}" shape="rect" placeholder="{{ photoPh }}" style="position:absolute;inset:0;"></image-slot>
      {{ stage }}
    </div>
  </div>
</section>
</x-dc>
