<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<style> a { text-decoration:none; } </style>
</helmet>
<section style="max-width:calc(1312px + 2 * var(--web-side));margin:0 auto;padding:0 var(--web-side) 72px;box-sizing:border-box;font-family:var(--font-web);color:#4F4F4E;">
  <div style="border-top:1px solid #D4D4D4;padding-top:32px;background:#F5F5F5;border:1px solid #D4D4D4;border-radius:12px;padding:36px;">
    <div data-stack="1" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:40px;align-items:start;">
      <div>
        <div style="font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);letter-spacing:var(--web-eyebrow-ls);text-transform:uppercase;color:{{ accent }};margin-bottom:12px;">Engineered into your project</div>
        <h2 style="margin:0 0 14px;font-size:clamp(36px,3.6vw,52px);font-weight:200;line-height:1.08;letter-spacing:-1px;color:#252525;text-wrap:balance;">Project-specific deliverables can be prepared <span style="color:#8E8E8E;">for this product.</span></h2>
        <a href="STROHM.ENERGY - PROJECT - All Projects - EN.dc.html#routes" style="height:46px;padding:0 24px;display:inline-flex;align-items:center;background:{{ accent }};color:#FFFFFF;font-size:var(--cta-font);border-radius:8px;font-weight:var(--web-btn-weight);">Request a technical project file</a>
      </div>
      <div data-cols="3" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 24px;--cg:24px;">
        <sc-for list="{{ deliverables }}" as="d" hint-placeholder-count="9">
          <div style="font-size:var(--web-small-size);font-weight:300;color:#5F5E5E;line-height:var(--web-small-lh);padding-top:10px;border-top:1px solid #D9D9D9;">{{ d }}</div>
        </sc-for>
      </div>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1480,&quot;height&quot;:320},&quot;accent&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#5F5E5E&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent || "#5F5E5E",
      deliverables: ["Layout", "Configuration", "Calculations", "Electrical design", "Mechanical drawings", "Bill of materials", "Installation plan", "Commissioning file", "Warranty documentation"],
    };
  }
}
</script>
</body>
</html>
