 var cf=document.getElementById('cf');if(cf)cf.onsubmit=function(ev){ev.preventDefault();var i=document.getElementById('ci'),v=i.value.trim();if(!v)return;chatLog[p.id].push({t:v,u:1});chatLog[p.id].push({t:'Thank you. This is a prototype, so the message was not sent.'});render();document.getElementById('ci').focus();var mm=document.getElementById('msgs');mm.scrollTop=mm.scrollHeight};
 post();
}
function who0(){return '<p style="font-size:13px;margin:0 0 12px">Contacting as <b>'+(state.q.type==='A'?'EPC / Professional Installer':'Business / Distribution Partner')+'</b> · <button type="button" id="chg" style="all:unset;cursor:pointer;text-decoration:underline;color:#111">Change</button></p>'}
var M=null,FREE=/@(gmail|googlemail|hotmail|outlook|live|yahoo|icloud|me|aol|gmx|proton|protonmail)\./i;
var CT=['Wholesaler','Distributor','Developer','Engineering company','Manufacturer','Other professional organisation'];
var MN={email:'Email',meeting:'Meeting',chat:'Quick chat'};
function openModal(method){M={step:'pick',method:method||'email',vals:{},err:{}};drawModal();try{parent.postMessage({expModal:1},'*')}catch(e){}}
function closeModal(){M=null;drawModal()}
function opt(id,t,d){return '<button type="button" class="opt" data-t="'+id+'"><b>'+t+'</b><span>'+d+'</span></button>'}
function fld(n,l,html,w,req){return '<div class="fl'+(w?' w':'')+'"><label for="f-'+n+'">'+l+(req?' *':'')+'</label>'+html+(M.err[n]?'<div class="er" role="alert">'+M.err[n]+'</div>':'')+'</div>'}
function inp(n,type,ph){var v=M.vals[n]||'';return '<input id="f-'+n+'" name="'+n+'" type="'+(type||'text')+'" value="'+esc(v)+'"'+(ph?' placeholder="'+ph+'"':'')+(M.err[n]?' class="bad"':'')+'>'}
function sel(n,opts){var v=M.vals[n]||'';return '<select id="f-'+n+'" name="'+n+'"'+(M.err[n]?' class="bad"':'')+'><option value="">Select</option>'+opts.map(function(o){return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}
function drawModal(){
 var m=document.getElementById('modal');
 if(!M){if(m)m.remove();post();return}
 if(!m){m=document.createElement('div');m.id='modal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label','Contact qualification');document.body.appendChild(m)}
 var ps=who(state.b||''),p=ps[Math.min(state.pi,ps.length-1)],h='<div class="card"><button type="button" class="x" id="mx">Close</button>';
 if(M.step==='pick'){
  h+='<h3>Who are you contacting us as?</h3><p>To connect you with the right specialist, please tell us how you work with energy products.</p><div style="margin-top:18px">'+opt('A','A. EPC / Professional Installer','I represent an EPC contractor, electrical installer, HVAC installer or renewable energy installation company.')+opt('B','B. Business / Distribution Partner','I represent a wholesaler, distributor, developer, engineering company, manufacturer or other professional organisation.')+opt('C','C. Private Consumer / Homeowner','I am looking for an energy solution for my home or private property.')+'</div>';
 } else if(M.step==='consumer'){
  h+='<div class="ctx" style="margin:0 0 14px"><b>'+esc(state.b||'')+'</b> · '+esc(p?p.name:'')+'</div><h3>Looking for a solution for your home?</h3><p>STROHM.ENERGY supplies its products through professional EPC contractors, installers and distribution partners. Our installation partners can help you select and install the right solution.</p><div class="row" style="margin-top:16px"><a class="btn" target="_top" href="STROHM.ENERGY - SITE - Find an Installer - EN.dc.html">Find an installation partner</a><button type="button" class="btn alt" id="mb">Back</button></div><p class="am" style="margin-top:14px">CONSENT STEP BEFORE SHARING DETAILS WITH INSTALLERS: TO CONFIRM</p>';
 } else if(M.step==='form'){
  var A=M.type==='A';
  h+='<div class="tag" style="margin:0 0 6px">'+(A?'EPC / Professional Installer':'Business / Distribution Partner')+'</div><h3>Tell us about your company</h3><div class="ctx"><b>'+esc(state.b||'')+'</b> · '+esc(p?p.name:'')+' <span style="color:#6E6E6E">· preselected</span></div><form id="qf" novalidate>'+
  fld('name','Full name',inp('name'),0,1)+fld('company','Company name',inp('company'),0,1)+
  fld('country','Country',inp('country'),0,1)+fld('email','Business email',inp('email','email','name@company.com'),0,1)+
  (A?'':fld('ctype','Company type',sel('ctype',CT),0,1))+fld('website','Company website (optional)',inp('website','text','https://'),0,0)+
  fld('interest','Area of interest / product category',sel('interest',BR.concat(['Not sure yet'])),0,1)+
  fld('reason','Reason for contacting the expert','<textarea id="f-reason" name="reason"'+(M.err.reason?' class="bad"':'')+'>'+esc(M.vals.reason||'')+'</textarea>',1,1)+
  '<div class="fl w"><span class="lb">Preferred contact method</span><div class="rad">'+['email','meeting','chat'].map(function(k){return '<label><input type="radio" name="method" value="'+k+'"'+(M.method===k?' checked':'')+'> '+MN[k]+'</label>'}).join('')+'</div></div>'+
  '<div class="row"><button type="submit" class="btn">'+(A?'Continue to expert':'Continue')+'</button><button type="button" class="btn alt" id="mb">Back</button></div></form>';
 } else {
  var L=M.lead;
  h+='<h3>Details accepted</h3><p>You can now contact '+esc(L.expert)+' ('+esc(L.brand)+') by '+MN[L.contact_method].toLowerCase()+'.</p><p class="am">PROTOTYPE: NOT SENT TO CRM. ODOO INTEGRATION TO CONFIRM</p><details><summary style="cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase">Lead record</summary><pre>'+esc(JSON.stringify(L,null,2))+'</pre></details><div class="row" style="margin-top:12px"><button type="button" class="btn" id="mo">Open '+MN[L.contact_method].toLowerCase()+'</button></div>';
 }
 h+='</div>';m.innerHTML=h;
 var q=function(s){return m.querySelector(s)};
 q('#mx').onclick=closeModal;
 var b=q('#mb');if(b)b.onclick=function(){M.step='pick';M.err={};drawModal()};
 [].forEach.call(m.querySelectorAll('[data-t]'),function(o){o.onclick=function(){var t=o.dataset.t;if(t==='C'){M.step='consumer'}else{M.type=t;M.step='form';M.vals.interest=M.vals.interest||state.b||''}drawModal()}});
 var f=q('#qf');if(f)f.onsubmit=function(ev){ev.preventDefault();var fd=new FormData(f),v={};['name','company','country','email','ctype','website','interest','reason'].forEach(function(k){v[k]=(fd.get(k)||'').toString().trim()});M.vals=v;M.method=fd.get('method')||M.method;
  var er={};['name','company','country','interest','reason'].forEach(function(k){if(!v[k])er[k]='Required'});
  if(M.type==='B'&&!v.ctype)er.ctype='Required';
  if(!v.email)er.email='Required';else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email))er.email='Enter a valid email address';else if(FREE.test(v.email))er.email='Please use your business email address';
  M.err=er;if(Object.keys(er).length){drawModal();var bad=m.querySelector('.bad');if(bad)bad.focus();return}
  var pp=ps[Math.min(state.pi,ps.length-1)];
  M.lead={lead_type:M.type==='A'?'EPC_INSTALLER':'BUSINESS_PARTNER',originating_page:'Company - About#experts',brand:state.b,expert:pp.name,expert_id:pp.id,contact_method:M.method,country:v.country,company:v.company,company_type:M.type==='B'?v.ctype:undefined,name:v.name,business_email:v.email,website:v.website||undefined,interest:v.interest,message:v.reason};
  state.q={type:M.type,lead:M.lead};saveQ();M.step='done';drawModal()};
 var o=q('#mo');if(o)o.onclick=function(){state.mode=M.lead.contact_method;closeModal();render()};
 var first=m.querySelector('input,select,textarea,.opt,.btn,.x');if(first)first.focus();
 post();
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&M)closeModal()});
window.addEventListener('message',function(e){var d=e.data;if(!d||!d.expPick||BR.indexOf(d.expPick)<0)return;var ps=who(d.expPick),i=0;ps.forEach(function(p,k){if(p.id===d.pid)i=k});state.b=d.expPick;state.pi=i;state.mode='email';render()});
function post(){setTimeout(function(){try{parent.postMessage({expHeight:Math.max(Math.ceil(document.body.getBoundingClientRect().height),M?(document.getElementById('modal')?document.getElementById('modal').firstChild.offsetHeight+48:0):0)},'*')}catch(e){}},30)}
window.addEventListener('load',post);window.addEventListener('resize',post);if(window.ResizeObserver)new ResizeObserver(post).observe(document.body);
render();
})();
</script></body></html>
