<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const TC = (w) => `[TO CONFIRM: ${w}]`;
    return {
      intro: "Tested electrical safety, declared efficiency, restricted substances and a documented end-of-life route. Every claim on this page is linked to a document.",
      durability: [
        { test: "Safety of room heaters", standard: "EN 60335-2-30 (applicable)", result: TC("result per model") },
        { test: "Safety of flexible sheet heating elements", standard: "EN 60335-2-96 (applicable, where used)", result: TC("result per model") },
        { test: "Ecodesign of local space heaters", standard: "Regulation (EU) 2015/1188 (applicable)", result: TC("control functions and efficiency per model") },
        { test: "Surface temperature and ingress protection", standard: TC("IP class per model, for bathroom and outdoor use"), result: TC("result per model") },
      ],
      materials: [
        { label: "Surfaces", headline: "Panel materials and finishes.", value: TC("glass, metal, mirror and coating materials per family"), dir: "FEU_RESPONSIBILITY_MATERIALS_SURFACE_01 · panel edge and surface detail · 16:10 · placeholder (P2)" },
        { label: "Declarations", headline: "Substances declared, not assumed.", value: "REACH and RoHS declarations per model. " + TC("which declarations exist"), dir: "FEU_RESPONSIBILITY_MATERIALS_DECLARATION_01 · declaration document preview · 16:10 · placeholder (P2)" },
      ],
      certs: [
        { code: "CE", label: "CE marking under the applicable directives " + TC("per model") },
        { code: "ISO 9001", label: "Quality management " + TC("held for FEU production") },
        { code: "ISO 14001", label: "Environmental management " + TC("held for FEU production") },
      ],
      packaging: TC("packaging materials and pallet take-back"),
      eol: ["Panel in use", "Disconnected by an installer or the owner", "Separate collection under the WEEE Directive 2012/19/EU", "Approved treatment and material recovery", "Recycling record", "Closed ownership record"],
    };
  }
}
</script>
