<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="_ds/emon-strohm-energy-design-system-19842d9c-a171-4ea8-9e9e-bb2ea0c78d1d/colors_and_type.css">
<style>body{margin:0;background:#F7F7F5;} a{color:#4F4F4E;} a:hover{color:#F76801;}</style>
</helmet>
<section style="padding:64px;display:flex;flex-direction:column;gap:32px;font-family:var(--font-web);color:#4F4F4E;">
  <div style="display:flex;flex-direction:column;gap:8px;max-width:900px;">
    <span style="font-size:13px;letter-spacing:2px;text-transform:uppercase;">DEPTH-1405 · Phase 2 prototype</span>
    <h1 style="margin:0;font-size:44px;font-weight:200;color:#252525;">Station 01 <span style="color:#8E8E8E;">three versions</span></h1>
    <p style="margin:0;font-size:17px;font-weight:300;line-height:1.5;">The refined drawing now applies to all 24 stations on the Generate page. Stations, texts, order, controls and data are unchanged.</p>
  </div>
  <div style="display:flex;gap:48px;align-items:flex-start;">
    <div id="1a" style="width:1312px;flex:none;display:flex;flex-direction:column;gap:16px;">
      <span style="align-self:flex-start;background:#4F4F4E;color:#FFFFFF;border-radius:8px;padding:4px 12px;font-size:15px;">1a · Before</span>
      <dc-import name="FactoryWalk" set="ando" refine="none" hint-size="1312px,900px"></dc-import>
    </div>
    <div id="1b" style="width:1312px;flex:none;display:flex;flex-direction:column;gap:16px;">
      <span style="align-self:flex-start;background:#F76801;color:#FFFFFF;border-radius:8px;padding:4px 12px;font-size:15px;">1b · After (all 24 stations, live)</span>
      <dc-import name="FactoryWalk" set="ando" refine="all" hint-size="1312px,900px"></dc-import>
    </div>
    <div id="1c" style="width:1312px;flex:none;display:flex;flex-direction:column;gap:16px;">
      <span style="align-self:flex-start;background:#252525;color:#FFFFFF;border-radius:8px;padding:4px 12px;font-size:15px;">1c · Three.js prototype, station 01</span>
      <dc-import name="FactoryWalk" set="ando" refine="all" three="s01" hint-size="1312px,900px"></dc-import>
    </div>
  </div>
</section>
</x-dc>
</body>
