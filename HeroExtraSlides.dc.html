<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;inset:0;pointer-events:none;">
  <sc-for list="{{ extra }}" as="x" hint-placeholder-count="2">
    <div style="position:absolute;inset:0;opacity:{{ x.op }};transition:opacity 300ms ease-out;pointer-events:{{ x.pe }};background:#EBECEC;">
      <image-slot id="{{ x.id }}" shape="rect" placeholder="{{ x.ph }}"></image-slot>
    </div>
  </sc-for>
</div>
<div style="position:absolute;right:{{ inset }};bottom:{{ bottom }};top:{{ top }};z-index:3;">
  <dc-import name="StrohmSlider" count="3" active="{{ active }}" on-select="{{ select }}" color="{{ color }}" label="{{ label }}" hint-size="120px,44px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:800,&quot;height&quot;:400},&quot;brand&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ANDO&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;page&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;overview&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { a: 0 };
  componentDidMount() {
    this._mw = window.matchMedia ? window.matchMedia("(max-width: 720px)") : null;
    this._mt = window.matchMedia ? window.matchMedia("(max-width: 1024px)") : null;
    this._h = () => this.forceUpdate();
    [this._mw, this._mt].forEach(m => m && m.addEventListener && m.addEventListener("change", this._h));
    this._t = setInterval(() => this.setState(s => ({ a: (s.a + 1) % 3 })), 6000);
  }
  componentWillUnmount() { clearInterval(this._t); [this._mw, this._mt].forEach(m => m && m.removeEventListener && m.removeEventListener("change", this._h)); }
  renderVals() {
    const brand = (this.props.brand || "STROHM").toUpperCase(), key = brand.toLowerCase().replace(/[^a-z]/g, "");
    const strohm = brand === "STROHM" || brand === "STROHM.ENERGY";
    const mob = this._mw && this._mw.matches, tab = this._mt && this._mt.matches;
    const a = this.state.a;
    return {
      extra: [1, 2].map(n => ({ id: "hero-" + key + "-" + (this.props.page || "overview") + "-slide-" + (n + 1), ph: (strohm ? "STROHM.ENERGY" : brand) + " hero photo " + (n + 1), op: a === n ? 1 : 0, pe: a === n ? "auto" : "none" })),
      active: a,
      select: (i) => { this.setState({ a: i }); clearInterval(this._t); this._t = setInterval(() => this.setState(s => ({ a: (s.a + 1) % 3 })), 6000); },
      color: strohm ? "#F36D1C" : "var(--color-brand-" + key + ", " + ({ EMON: "#21AE8F", KALK: "#898989", TRIBE: "#689AB2", KERN: "#1DABC1", PUSH: "#3EAB57", PACT: "#D6990E", DEPOT: "#7690C9" }[brand] || "#4F4F4E") + ")", /* DEPTH-576: systems use their own colour */
      label: (strohm ? "STROHM.ENERGY" : brand) + " hero photos",
      inset: mob ? "16px" : tab ? "24px" : "32px",
      bottom: mob ? "auto" : tab ? "24px" : "32px",
      top: mob ? "16px" : "auto"
    };
  }
}
</script>
</body>
</html>
