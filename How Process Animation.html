<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HOW process animation</title>
<style>
html,body{margin:0;background:#FFFFFF;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#252525}
.box{background:#F4F4F4;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box;min-height:100vh}
svg{width:100%;height:auto;display:block}
.g{transition:opacity 420ms ease,transform 620ms cubic-bezier(.2,.7,.2,1)}
.steps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0 6px}
.steps button{font:inherit;background:none;border:0;border-top:2px solid #DDDDDD;padding:8px 0 4px;text-align:left;cursor:pointer;color:#5F5E5E;font-size:12px;line-height:1.25;min-height:44px;transition:border-color 160ms ease,color 160ms ease}
.steps button span{display:block;font-weight:500;letter-spacing:.12em;font-size:12px}
.steps button[aria-pressed="true"]{border-top-color:#F76801;color:#252525}
.steps button:focus-visible,.ctl button:focus-visible{outline:1px solid #4F4F4E;outline-offset:2px}
.txt{display:flex;flex-direction:column;gap:4px;min-height:72px;transition:opacity 200ms ease}
.txt h3{margin:0;font-size:18px;font-weight:400}
.txt p{margin:0;font-size:14px;font-weight:300;line-height:1.5;color:#5F5E5E}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ctl{display:flex;gap:8px}
.ctl button{font:inherit;font-size:14px;background:#FFFFFF;border:1px solid #BBBBBB;border-radius:8px;padding:6px 12px;cursor:pointer;color:#252525;min-height:32px}
.note{font-size:12px;color:#5F5E5E;font-weight:300}
.pt{cursor:pointer}
@media (max-width:520px){.steps{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 6px}}
@media (prefers-reduced-motion:reduce){.g,.txt,.steps button{transition:none!important}}
</style></head><body>
<div class="box">
<svg viewBox="0 0 520 330" role="img" aria-label="Conceptual illustration of one product developing through seven stages">
  <g id="grid" class="g" style="opacity:0" stroke="#DDDDDD" stroke-width="1">
    <path d="M140 40V290M180 40V290M220 40V290M260 40V290M300 40V290M340 40V290M380 40V290M100 80H420M100 120H420M100 160H420M100 200H420M100 240H420"/>
  </g>
  <g id="links" class="g" style="opacity:0" stroke="#8E8E8E" stroke-width="1" fill="none" font-size="11" font-family="Helvetica Neue,Helvetica,Arial" >
    <path d="M200 165H70M320 165H450M260 105V45M260 225V290"/>
    <g fill="#FFFFFF" stroke="#4F4F4E"><rect x="22" y="150" width="48" height="30" rx="6"/><rect x="450" y="150" width="48" height="30" rx="6"/><rect x="236" y="18" width="48" height="28" rx="6"/><rect x="226" y="290" width="68" height="28" rx="6"/></g>
    <g fill="#252525" stroke="none" text-anchor="middle"><text x="46" y="169">Meter</text><text x="474" y="169">Battery</text><text x="260" y="36">Inverter</text><text x="260" y="308">EMON</text></g>
  </g>
  <g id="lid" class="g"><rect x="200" y="105" width="120" height="22" rx="6" fill="#E3E3E3" stroke="#4F4F4E"/></g>
  <g id="board" class="g"><rect x="212" y="132" width="96" height="46" rx="3" fill="#FFFFFF" stroke="#4F4F4E"/><path d="M222 146h30M222 156h44M222 166h22" stroke="#8E8E8E"/><rect x="282" y="142" width="16" height="16" fill="#4F4F4E"/></g>
  <g id="base" class="g"><rect x="200" y="127" width="120" height="98" rx="6" fill="none" stroke="#4F4F4E"/></g>
  <g id="conn" class="g"><rect x="244" y="225" width="32" height="12" rx="2" fill="#4F4F4E"/></g>
  <g id="dims" class="g" style="opacity:0" stroke="#F76801" stroke-width="1" fill="none" font-size="11" font-family="Helvetica Neue,Helvetica,Arial">
    <path d="M200 252H320M200 246v12M320 246v12M340 105V237M334 105h12M334 237h12"/>
    <g fill="#252525" stroke="none"><text x="230" y="270">Dimensions</text><text x="350" y="175">Insulation</text><text x="118" y="120">Temperature</text></g>
    <path d="M180 116h18" />
  </g>
  <g id="obs" class="g" style="opacity:0" font-size="11" font-family="Helvetica Neue,Helvetica,Arial">
    <g class="pt" data-req="Mounting takes too long." tabindex="0" role="button" aria-label="Inspection point 1"><circle cx="200" cy="127" r="9" fill="#F76801"/><text x="196" y="131" fill="#FFF">1</text></g>
    <g class="pt" data-req="Cables are hard to reach." tabindex="0" role="button" aria-label="Inspection point 2"><circle cx="260" cy="231" r="9" fill="#F76801"/><text x="256" y="235" fill="#FFF">2</text></g>
    <g class="pt" data-req="Status is not visible." tabindex="0" role="button" aria-label="Inspection point 3"><circle cx="320" cy="127" r="9" fill="#F76801"/><text x="316" y="131" fill="#FFF">3</text></g>
  </g>
  <g id="qr" class="g" style="opacity:0" font-size="11" font-family="Helvetica Neue,Helvetica,Arial">
    <rect x="292" y="190" width="22" height="22" fill="#FFFFFF" stroke="#252525"/><path d="M296 194h5v5h-5zM305 194h5v5h-5zM296 203h5v5h-5zM306 204h3v3h-3z" fill="#252525"/>
    <rect x="360" y="70" width="140" height="110" rx="8" fill="#FFFFFF" stroke="#BBBBBB"/>
    <text x="372" y="90" fill="#5F5E5E" font-size="10" letter-spacing="1">EXAMPLE RECORD</text>
    <g fill="#252525"><text x="372" y="110">Documents</text><text x="372" y="130">Test results</text><text x="372" y="150">Service history</text></g>
    <path d="M314 200L360 150" stroke="#BBBBBB" fill="none"/>
  </g>
</svg>
<div class="steps" role="group" aria-label="Process stages" id="steps"></div>
<div class="txt" id="txt" aria-live="polite"><h3 id="tt"></h3><p id="tp"></p></div>
<div class="row"><span class="note">Conceptual illustration, not a technical drawing.</span><div class="ctl"><button type="button" id="play">Play</button><button type="button" id="pause">Pause</button><button type="button" id="replay">Replay</button></div></div>
</div>
<script>
const S=[['Observe','We study how existing products are installed, used and serviced. Select a point to see a practical requirement.'],
['Design','Requirements become a product concept, built on a precise grid.'],
['Engineer','The concept is split into housing, electronics and connections.'],
['Validate','Every part is measured and tested against the requirements.'],
['Manufacture','Components come together into one finished product.'],
['Connect','The product connects to the meter, battery, inverter and EMON.'],
['Support','A QR code opens the product record: documents, test results and service history.']];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=(i)=>document.getElementById(i);const st=$('steps');let cur=0,timer=null,played=false;
S.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.innerHTML='<span>0'+(i+1)+'</span>'+s[0];b.onclick=()=>{stop();show(i)};st.appendChild(b)});
const set=(id,o,tf)=>{const e=$(id);e.style.opacity=o;e.style.transform=tf||'translate(0,0)'};
function show(i){cur=i;[...st.children].forEach((b,k)=>b.setAttribute('aria-pressed',k===i?'true':'false'));
 $('tt').textContent=S[i][0];$('tp').textContent=S[i][1];
 const ex=i===2,pre=i===4&&!RM;
 set('grid',i===1?1:0);set('obs',i===0?1:0);set('dims',i===3?1:0);set('links',i===5?1:0);set('qr',i===6?1:0);
 const op=i===1?.55:1;
 set('lid',op,ex?'translate(0,-48px)':'');set('board',op,ex?'translate(120px,0)':'');set('base',op,'');set('conn',op,ex?'translate(0,40px)':'');
 if(pre){set('lid',1,'translate(0,-48px)');set('board',1,'translate(120px,0)');set('conn',1,'translate(0,40px)');setTimeout(()=>{if(cur===4){set('lid',1,'');set('board',1,'');set('conn',1,'')}},380)}}
function play(from){stop();let i=from||0;show(i);if(RM)return;timer=setInterval(()=>{i++;if(i>=S.length){stop();return}show(i)},1900)}
function stop(){clearInterval(timer);timer=null}
$('play').onclick=()=>play(cur>=S.length-1?0:cur+1);$('pause').onclick=stop;$('replay').onclick=()=>play(0);
document.querySelectorAll('.pt').forEach(p=>{const f=()=>{stop();show(0);$('tp').textContent=p.dataset.req};p.onclick=f;p.onkeydown=(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}}});
show(0);
new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting&&!played){played=true;if(!RM)play(0)}if(!e.isIntersecting)stop()})},{threshold:.4}).observe(document.querySelector('svg'));
</script>
</body></html>
