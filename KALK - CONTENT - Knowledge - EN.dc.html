const KALK_LEAD = [{"title":"Roof fit","text":"Input: Roof outline, keep out zones, setback, module size. Output: Panel count, layout, kWp. Limit: Modelled from the outline entered."},{"title":"System performance","text":"Input: Location, azimuth, tilt, module rating. Output: Annual yield, performance ratio, loss breakdown. Limit: Estimate, not a guarantee."},{"title":"Storage and load","text":"Input: Consumption profile, battery capacity. Output: Self consumption share, battery size. Limit: Needs load data."},{"title":"Technical proposal","text":"Input: Calculation results, product choice. Output: Proposal document. Limit: Based on the inputs entered."}];
const KALK_FAQ = [{"page":"KALK","href":"KALK - SYSTEM - Overview - EN.dc.html","groups":[{"title":"Questions about KALK","count":"8 questions","items":[{"q":"What is KALK?","a":"KALK is the energy calculation environment of STROHM.ENERGY. It designs energy systems, calculates performance and prepares technical proposals."},{"q":"Which products does KALK cover?","a":"Each STRØHM.ENERGY product has its own module. The status on each row shows Prototype, a working tool page, or Planned, no calculator yet."},{"q":"Does KALK calculate how many panels fit on a roof?","a":"Yes. ANDO calculates panels per roof from the roof outline, keep out zones, edge setback and module dimensions.","note":"Prototype"},{"q":"What is the difference between ANDO and LINA?","a":"ANDO fits panels on any roof. LINA is the vertical layout for flat roofs."},{"q":"What inputs does KALK need?","a":"Site data, the choice of products and load data. Each module table lists the inputs and outputs per product."},{"q":"Are the results guaranteed?","a":"No. Results are modelled estimates and depend on the inputs entered."},{"q":"What does the technical proposal contain?","a":"The results of each product module, the inputs used and the assumptions behind them."},{"q":"How does KALK connect to KERN?","a":"Where the connection is included, calculation results can be used to prepare a quotation and project in KERN.","note":"To confirm"}]}]}];

ning costs.","note":"Planned","link":"FEU planning and operation","href":"FEU - PRODUCT - Overview - EN.dc.html#planning"},{"title":"OGO · Domestic hot-water sizing","text":"Use KALK to compare hot-water capacity and estimated consumption.","note":"Prototype","link":"OGO planning and operation","href":"OGO - PRODUCT - Overview - EN.dc.html#planning"},{"title":"XOOM · Charging capacity and site configuration","text":"Use KALK to plan charging capacity for your site.","note":"Planned","link":"XOOM planning and operation","href":"XOOM - PRODUCT - Overview - EN.dc.html#planning"},{"title":"AIRO · Ventilation and fan-energy assessment","text":"Use KALK to compare airflow requirements and system options.","note":"Prototype","link":"AIRO planning and operation","href":"AIRO - PRODUCT - Overview - EN.dc.html#planning"},{"title":"GLOW · Lighting and autonomy assessment","text":"Use KALK to assess lighting requirements and seasonal energy balance.","note":"Planned","link":"GLOW planning and operation","href":"GLOW - PRODUCT - Overview - EN.dc.html#planning"},{"title":"MOX · Architectural integration and component configuration","text":"Use KALK to assemble an architectural PV concept.","note":"Prototype","link":"MOX planning and operation","href":"MOX - PRODUCT - Overview - EN.dc.html#planning"},{"title":"AGRIX · Agrivoltaic layout and scenario assessment","text":"Use KALK to compare layouts against energy and agricultural requirements.","note":"Prototype","link":"AGRIX planning and operation","href":"AGRIX - PRODUCT - Overview - EN.dc.html#planning"},{"title":"TERRIX · Ground-mount concept and quantities","text":"Use KALK to develop a ground-mount concept and preliminary materials schedule.","note":"Planned","link":"TERRIX planning and operation","href":"TERRIX - PRODUCT - Overview - EN.dc.html#planning"},{"title":"PONTIX · Floating platform concept and quantities","text":"Use KALK to assess a floating mounting concept.","note":"Planned","link":"PONTIX planning and operation","href":"PONTIX - PRODUCT - Overview - EN.dc.html#planning"},{"title":"TECTIX · Roof mounting configuration","text":"Use KALK to configure the mounting arrangement and identify the information needed for roof approval.","note":"Planned","link":"TECTIX planning and operation","href":"TECTIX - PRODUCT - Overview - EN.dc.html#planning"},{"title":"PARX · Parking layout and integrated energy configuration","text":"Use KALK to compare parking layouts with generation, storage and charging options.","note":"Planned","link":"PARX planning and operation","href":"PARX - PRODUCT - Overview - EN.dc.html#planning"},{"title":"CHILL · Infrastructure module and energy-balance configuration","text":"Use KALK to define the services and energy balance for your site.","note":"Planned","link":"CHILL planning and operation","href":"CHILL - PRODUCT - Overview - EN.dc.html#planning"},{"title":"TOGU · Cable and connection configuration","text":"Use KALK to estimate cable and connection requirements.","note":"Prototype","link":"TOGU planning and operation","href":"TOGU - PRODUCT - Overview - EN.dc.html#planning"},{"title":"DODO · Protection perimeter and kit quantities","text":"Use KALK to estimate protection lengths and fixings.","note":"Prototype","link":"DODO planning and operation","href":"DODO - PRODUCT - Overview - EN.dc.html#planning"},{"title":"SHELTR · Protection configuration and risk checklist","text":"Use KALK to identify protection requirements and suitable product options.","note":"Prototype","link":"SHELTR planning and operation","href":"SHELTR - PRODUCT - Overview - EN.dc.html#planning"},{"title":"MUKI · Whole-system kit configuration","text":"Use KALK to compare defined energy sets against your requirements.","note":"Planned","link":"MUKI planning and operation","href":"MUKI - PRODUCT - Overview - EN.dc.html#planning"},{"title":"WURK · Installation equipment selector","text":"Use the KALK selector to identify installation equipment for the task.","note":"Prototype","link":"WURK planning and operation","href":"WURK - PRODUCT - Overview - EN.dc.html#planning"}];
