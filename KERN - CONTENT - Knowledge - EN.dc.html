<dc-import name="ContentArchive" brand="KERN" section="knowledge" lead="{{ lead }}" lead-title="Guidance for the work around an installation" lead-intro="Use these topics to review how information moves through your business. Each topic connects an operational problem with the records and responsibilities needed to resolve it." faq-pages="{{ faqPages }}" faq-title="Questions about KERN, by page" hint-size="100%,100%"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
const KERN_LEAD = [{"title":"From calculation to quotation","text":"Understand which assumptions belong in the technical assessment and which decisions belong in the commercial offer. Retain the selected revision when the project proceeds.","link":"Explore the KALK connection","href":"KERN - SYSTEM - Connections - EN.dc.html"},{"title":"From materials to installation readiness","text":"Review the relationship between the proposed bill of materials, committed stock, supplier confirmation and the crew appointment.","link":"Explore purchasing","href":"KERN - SYSTEM - Modules - EN.dc.html"},{"title":"From installation to operation","text":"Identify the installed equipment and commissioning evidence needed before an operational connection is activated.","link":"Explore commissioning","href":"KERN - SYSTEM - Modules - EN.dc.html"},{"title":"From an alert to a service response","text":"Keep fault evidence, case ownership, field work and the resolution connected without granting unnecessary access to operational data.","link":"Explore the EMON connection","href":"KERN - SYSTEM - Connections - EN.dc.html"},{"title":"From project records to commercial reporting","text":"Distinguish estimates, commitments and approved actuals when reviewing costs and margins.","link":"Explore reporting","href":"KERN - SYSTEM - Modules - EN.dc.html"}];
const KERN_FAQ = [{"page":"Overview","href":"KERN - SYSTEM - Overview - EN.dc.html","groups":[{"title":"Questions about multi-company operation","count":"2 questions","items":[{"q":"Does multi-company support mean consolidated accounting is included?","a":"No. Consolidation, intercompany accounting and local financial requirements must be explicitly included and assessed during implementation."},{"q":"Can companies use different currencies?","a":"Confirm the currencies, rate sources, transaction flows and reporting requirements within the financial scope. Document formatting alone does not settle those requirements."}]},{"title":"Questions for solar teams","count":"1 question","items":[{"q":"Can we combine storage or charging in the proposal?","a":"Yes. Keep the combined commercial scope together while using the relevant technical checks and a consistent whole-system calculation."}]},{"title":"Questions for storage teams","count":"1 question","items":[{"q":"Does a battery size alone establish backup duration?","a":"No. The load, inverter, transfer arrangement, usable energy and reserve settings affect the result. Retain those assumptions with the assessment."}]},{"title":"Questions for heating teams","count":"1 question","items":[{"q":"Does the software replace professional design review?","a":"No. A calculation or form supports the assessment. The responsible professional must verify the inputs and review the result appropriate to the installation."}]},{"title":"Questions for charging teams","count":"1 question","items":[{"q":"Does KERN provide charging transactions and roaming?","a":"KERN manages the business and project workflow. Public charging payments, roaming and charge-point operation require a separately defined service and connection."}]},{"title":"Questions for EPC teams","count":"1 question","items":[{"q":"Can external partners see the whole programme?","a":"Only where their role requires it and access is granted. Site or work-package access should not automatically expose unrelated commercial information."}]},{"title":"Questions for supply teams","count":"1 question","items":[{"q":"Can KERN support a mix of own stock and supplier delivery?","a":"That flow can be included in the implementation scope. Define ownership, order status, delivery evidence and financial responsibilities for each route."}]},{"title":"Questions about KERN","count":"4 questions","items":[{"q":"Who is KERN for?","a":"KERN is intended for installers, EPCs and energy businesses managing equipment sales, installation projects and aftercare. It supports the business processes around solar, storage, heating, charging and other energy technologies."},{"q":"Do we have to buy STRØHM.ENERGY equipment?","a":"No. KERN is available independently. Product catalogues and connected services are configured around the equipment and interfaces validated for your implementation."},{"q":"Do we need KALK and EMON?","a":"No. They can be used separately. Connect KALK where technical design and calculations are needed, and EMON where supported operational data and energy management are part of the service."},{"q":"Can we keep some existing systems?","a":"Yes, subject to an agreed integration scope. During implementation, we identify which system owns each record and how information moves between them."}]},{"title":"Questions before contacting us","count":"2 questions","items":[{"q":"Do we need a complete specification?","a":"No. Start with the process and the problem. Detailed requirements can be developed after the workflow and responsibilities are understood."},{"q":"Can we discuss only one module?","a":"Yes. Explain the module and the records it needs to exchange with your existing process."}]}]},{"page":"Process","href":"KERN - SYSTEM - Process - EN.dc.html","groups":[{"title":"Questions about the process","count":"4 questions","items":[{"q":"Can we start with a limited scope?","a":"Yes. Define a useful first workflow and the records it needs. Additional functions can be introduced once that workflow is established and the next stage has been agreed."},{"q":"Will our team need to use several interfaces?","a":"KERN provides its own interface for the agreed workflows. Where an external service remains part of the process, its role and access requirements are explained during implementation."},{"q":"Can one programme contain several sites?","a":"Yes. Use an overall programme view while retaining the individual scope, dates, costs and permissions of each site project."},{"q":"What happens after handover?","a":"The project record remains available to the authorised service team. Service requests can refer to the installed equipment and the original commissioning evidence."}]}]},{"page":"Modules","href":"KERN - SYSTEM - Modules - EN.dc.html","groups":[{"title":"Questions about CRM","count":"2 questions","items":[{"q":"Can one customer have several projects?","a":"Yes. Structure the customer relationship separately from individual sites and projects so that each installation retains its own scope and history."},{"q":"What happens when a prospect becomes a customer?","a":"The existing record continues into the quotation and project workflow. Review duplicate records before creating another customer entry."}]},{"title":"Questions about lead management","count":"2 questions","items":[{"q":"Can different project types use different stages?","a":"The pipeline should reflect the agreed sales processes. Solar supply, an installed battery and a multi-site charging programme may need different qualification steps."},{"q":"Does every calculator user become a lead?","a":"No. A public calculation becomes a shared enquiry when the visitor chooses to submit it and provides the information required for follow-up."}]},{"title":"Questions about forms","count":"2 questions","items":[{"q":"Can forms be used on a phone or tablet?","a":"The field workflow is intended for those devices. Confirm supported devices and any offline requirements during implementation."},{"q":"Does a signature confirm the whole installation is compliant?","a":"A signature records the stated acceptance. The form must identify what was checked, who checked it and what remains outstanding."}]},{"title":"Questions about catalogues","count":"1 question","items":[{"q":"Can supplier data be imported?","a":"Import scope depends on the available source, rights, format and agreed connection. Confirm fields, update behaviour and exception handling before relying on a catalogue feed."}]},{"title":"Questions about quotations","count":"2 questions","items":[{"q":"Can one proposal include several technologies?","a":"Yes. Combine the relevant equipment and services while retaining the technical basis for each part of the system. Whole-system financial results should come from a consistent calculation."},{"q":"Is a KALK estimate a quotation?","a":"No. KALK supplies a calculation and proposed configuration. KERN applies the approved commercial scope, pricing and terms to create the offer."}]},{"title":"Questions about purchasing","count":"2 questions","items":[{"q":"Can the materials list come from KALK?","a":"Yes. Bring the selected design and proposed quantities into the project, then apply the purchasing checks and approvals required by your business."},{"q":"Can a substitute be accepted without recalculation?","a":"Only where the responsible reviewer confirms that no affected technical check needs to be repeated. Compatibility and customer scope must remain controlled."}]},{"title":"Questions about inventory","count":"2 questions","items":[{"q":"Does expected stock count as available stock?","a":"It should remain distinguishable. A confirmed supplier delivery and goods received into an approved location are different states."},{"q":"Can vehicle stock be included?","a":"Include it where vehicle movements and responsibilities form part of the agreed implementation. Define how field teams record issue, use and return."}]},{"title":"Questions about planning","count":"2 questions","items":[{"q":"Can different teams have different assignments?","a":"Yes. A survey, electrical installation and commissioning visit can have different responsible teams and prerequisites."},{"q":"Are suggested dates automatically customer commitments?","a":"No. Distinguish an internal planning proposal from an appointment that has been checked and confirmed."}]},{"title":"Questions about tasks","count":"1 question","items":[{"q":"Can tasks be created from a project event?","a":"Defined workflows can create the next task when their conditions are met. The trigger, responsible role and required action should be configured and tested before use."}]},{"title":"Questions about handover","count":"1 question","items":[{"q":"Does completing the project activate device control?","a":"No. Operational access requires the supported connection, commissioned equipment and appropriate permission. Project completion alone does not provide control authority."}]},{"title":"Questions about invoices","count":"2 questions","items":[{"q":"Can invoices use fixed amounts or percentages?","a":"Define the billing method in the commercial agreement and configure the supported stages accordingly. The invoice should reflect the agreed amount and milestone."},{"q":"Are invoices created automatically when work is completed?","a":"That depends on the agreed workflow. Automation should run only when its required approvals and data checks have been satisfied."}]},{"title":"Questions about payments","count":"2 questions","items":[{"q":"Does automatic collection guarantee payment?","a":"No. Transactions can fail or be disputed. The process must include status updates, exceptions and the agreed follow-up procedure."},{"q":"Can payment methods vary by customer or market?","a":"The supported methods depend on the provider and implementation scope. Confirm availability and commercial conditions for the markets you serve."}]},{"title":"Questions about service","count":"2 questions","items":[{"q":"Can an EMON alert become a service case?","a":"Yes, where that connection and workflow are included. The case should retain the alert reference and necessary evidence, with duplicate events handled deliberately."},{"q":"Does closing a ticket prove the equipment is operating normally?","a":"Closure records the agreed service outcome. Where performance verification is required, include the relevant test or measured evidence before closure."}]},{"title":"Questions about contracts","count":"2 questions","items":[{"q":"Can one agreement cover several sites?","a":"Where included in the implementation, define the sites and assets individually while retaining the overall commercial agreement."},{"q":"Does a missed payment give KERN control of the installation?","a":"No. Commercial payment state does not itself grant device-control authority. Operational permissions are managed through the supported EMON arrangements."}]},{"title":"Questions about the portal","count":"2 questions","items":[{"q":"Will customers see our costs or other customers?","a":"Customer access is limited to the records deliberately shared with them. Internal costs, personnel information and unrelated projects are outside that scope."},{"q":"Can several people access one installation?","a":"Access can be assigned to the relevant people according to the agreed roles. Define who may view documents, approve changes or manage operational permissions."}]},{"title":"Questions about reporting","count":"2 questions","items":[{"q":"Will everyone see the same dashboard?","a":"Views should match the user’s role and permissions. Access to a summary does not override the restrictions on its underlying records."},{"q":"Can we export information?","a":"Define the required exports, fields and access during implementation. Preserve enough context to interpret the exported values correctly."}]}]},{"page":"Documents","href":"KERN - SYSTEM - Documents - EN.dc.html","groups":[{"title":"Questions about documents","count":"1 question","items":[{"q":"Can we import an existing archive?","a":"The migration scope should identify the files, their ownership and how they map to customers, sites and projects. Unstructured files may need review before they can be linked reliably."}]}]},{"page":"Finance and People","href":"KERN - SYSTEM - Finance and People - EN.dc.html","groups":[{"title":"Questions about finance","count":"2 questions","items":[{"q":"Does KERN include our complete accounting scope?","a":"The scope is agreed during implementation. Confirm the accounts, countries, reporting and any external accounting connections required before deciding what is included."},{"q":"Can we see estimated and actual margin separately?","a":"Those values should use distinguishable inputs. An estimate based on planned materials and hours is different from a result based on approved actual costs."}]},{"title":"Questions about people","count":"1 question","items":[{"q":"Can KERN replace payroll?","a":"Payroll is a separate implementation decision. Personnel, planning and time records do not by themselves establish a complete payroll service."}]},{"title":"Questions about time","count":"2 questions","items":[{"q":"Can field teams submit hours from their device?","a":"That is part of the intended field workflow. Confirm supported entry methods and approval requirements during implementation."},{"q":"Are unapproved hours treated as final costs?","a":"They should remain distinguishable. Reporting must explain whether a value includes submitted estimates or approved actual time."}]},{"title":"Questions about leave","count":"1 question","items":[{"q":"Are entitlement rules the same in every country?","a":"No. Rules depend on the employment context. The implementation must use the policy and legal requirements appropriate to the affected staff."}]},{"title":"Questions about access","count":"2 questions","items":[{"q":"Can one sign-in access several services?","a":"A connected sign-in can simplify access where implemented, but permissions remain specific to the organisation, service and records involved."},{"q":"Does hiding a screen protect its data?","a":"No. Restrictions must be enforced for the underlying request and action. The interface should reflect those permissions rather than act as their only control."}]},{"title":"Questions about administration","count":"1 question","items":[{"q":"Can every user change company-wide settings?","a":"No. Administrative changes should be assigned to appropriate roles and limited to their organisation or agreed scope."}]}]},{"page":"Connections","href":"KERN - SYSTEM - Connections - EN.dc.html","groups":[{"title":"Questions about KALK","count":"2 questions","items":[{"q":"Can KERN be used without KALK?","a":"Yes. KERN is available independently. KALK is relevant where a supported technical calculation or design workflow forms part of the process."},{"q":"Can a public estimate enter our sales workflow?","a":"Yes, when the visitor chooses to share it. Retain its indicative status until the required professional and commercial reviews are complete."}]},{"title":"Questions about EMON","count":"2 questions","items":[{"q":"Does every physical product connect directly to EMON?","a":"No. Inverters, meters and other supported devices can exchange data. Mounting structures, protection products and other passive components are linked through installation and service records."},{"q":"Can an installer access operational data indefinitely?","a":"Only according to the permissions granted. Access should be reviewed and withdrawn when the authorised purpose ends."}]},{"title":"Questions about integrations","count":"2 questions","items":[{"q":"Is every supplier or software logo a supported connection?","a":"No. Supported connections must be identified by function and status. Compatibility should be confirmed for the version and workflow you intend to use."},{"q":"Can we request a custom connection?","a":"Yes. Describe the required outcome, systems, data and responsibilities so that its feasibility and scope can be assessed."}]},{"title":"Questions about the API","count":"2 questions","items":[{"q":"Are API access and unlimited usage automatically included?","a":"No terms have been assumed. Available endpoints, limits, support and commercial conditions belong in the agreed integration scope."},{"q":"Will users need to understand the backend?","a":"No. The user experience is presented through KERN’s own interface. Technical connection details belong in implementation documentation."}]},{"title":"Questions about automation","count":"1 question","items":[{"q":"How is automation different from AI?","a":"A workflow follows defined triggers and conditions. AI interprets a request and can help retrieve, explain or prepare information. Both need permissions appropriate to the action."}]},{"title":"Questions about AI","count":"3 questions","items":[{"q":"Does AI have access to every record?","a":"It should operate within the user’s authorised scope. AI is not a separate permission to view unrelated customers or confidential information."},{"q":"Can AI control energy equipment?","a":"KERN business AI does not provide blanket device-control authority. Supported operational functions belong to EMON and its separate permission model."},{"q":"Which functions are available?","a":"The proposal should name the available functions, pilot features and actions requiring review. Discuss the release scope before including AI in your implementation."}]}]},{"page":"Plans","href":"KERN - SYSTEM - Plans - EN.dc.html","groups":[{"title":"Questions about pricing","count":"4 questions","items":[{"q":"Is there a fixed public price?","a":"Request a proposal for the scope your organisation needs. Prices and inclusions are confirmed in that proposal."},{"q":"Is a free trial included?","a":"No trial offer is assumed. Discuss the available evaluation process and its conditions before making a commitment."},{"q":"Are API, AI and integrations included?","a":"The proposal should identify which functions and usage conditions are included and which require an additional agreement."},{"q":"Can we purchase KERN without STRØHM.ENERGY hardware?","a":"Yes. KERN is available independently, with product and service connections defined by their validated scope."}]}]},{"page":"Support","href":"KERN - SYSTEM - Support - EN.dc.html","groups":[{"title":"Questions about implementation","count":"2 questions","items":[{"q":"How long does implementation take?","a":"Timing depends on scope, data quality, custom workflows and connections. The proposal should identify stages, dependencies and the responsibilities required from each side."},{"q":"Do we have to change everything at once?","a":"No. A staged rollout can retain selected systems while the ownership and handover between them are clearly defined."}]},{"title":"Questions about migration","count":"1 question","items":[{"q":"Can every existing system be migrated automatically?","a":"No universal migration is assumed. Feasibility depends on export access, data structure, completeness and the records included in the agreed scope."}]},{"title":"Questions about support","count":"2 questions","items":[{"q":"Is support available at all times?","a":"Support hours, channels and response commitments must be stated in the commercial agreement. No round-the-clock service is implied by this page."},{"q":"Are custom changes included?","a":"That depends on the agreed service. New functionality and integration changes should have a clear scope and approval process."}]},{"title":"Questions about security","count":"3 questions","items":[{"q":"Where is our data hosted?","a":"The location and processing arrangements must be identified for the service offered to your organisation. Request the applicable documentation before entering an agreement."},{"q":"Is a particular certification included?","a":"Only certifications explicitly identified for the service and their stated scope should be relied on. No certification is implied by this page."},{"q":"Who owns operational device permissions?","a":"Those permissions are managed separately through the supported operational arrangements. KERN administrative access does not itself grant equipment control."}]}]}];
class Component extends DCLogic { renderVals() { return { lead: KERN_LEAD, faqPages: KERN_FAQ }; } }
</script>
