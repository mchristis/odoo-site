<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./section-nav-data.js"></script>
<script src="./brandbar-data.js"></script>
</helmet>
<section id="kalk-brands" data-screen-label="KALK brand selector" style="width:calc(100% - 2 * var(--web-side, clamp(20px,5.8vw,84px)));max-width:1312px;margin:72px auto 0;box-sizing:border-box;">
  <div style="margin-bottom:16px;font-size:var(--web-eyebrow-size,12px);font-weight:var(--web-eyebrow-weight,500);letter-spacing:var(--web-eyebrow-ls,2px);text-transform:uppercase;color:#5F5E5E;">KALK per brand</div>
  <dc-import name="EcosystemGrid" set="products" layout="grid5" word="KALK" entries="{{ entries }}" hint-size="100%,640px"></dc-import>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:720}}">
class Component extends DCLogic {
  state = { tick: 0 };
  componentDidMount() { this._t = setTimeout(() => this.setState({ tick: 1 }), 600); }
  componentWillUnmount() { clearTimeout(this._t); }
  renderVals() {
    const C = { ANDO: "#CDDB65", LINA: "#B5C64A", FLUXX: "#FDC706", MOEBIUS: "#F1931B", SYNQ: "#598F94", OZZY: "#8BCF3F", NENDO: "#1B8B9A", OGO: "#00A0E3", XOOM: "#8EB15F", AIRO: "#0083BB", FEU: "#ED704C", GLOW: "#FCDE15", PROP: "#527A83", MOX: "#D8392C", AGRIX: "#6B8E4E", TERRIX: "#6B755F", PONTIX: "#06768A", TECTIX: "#4A5B73", PARX: "#7A9337", CHILL: "#6BC0B0", TOGU: "#C48723", DODO: "#E5B73B", SHELTR: "#5B6592", MUKI: "#DF550C", WURK: "#9E3D2E" };
    const G = [["Solar, storage and switching", ["ANDO", "LINA", "FLUXX", "MOEBIUS", "SYNQ", "OZZY"]], ["Heat, air and water", ["NENDO", "FEU", "AIRO", "OGO"]], ["Mobility, light and wind", ["XOOM", "GLOW", "PROP"]], ["Structures", ["MOX", "AGRIX", "TERRIX", "PONTIX", "TECTIX", "PARX"]], ["Infrastructure and tools", ["CHILL", "TOGU", "DODO", "SHELTR", "MUKI", "WURK"]]];
    const BB = window.STROHM_BRANDBAR; if (BB && !this._d) { try { BB.derive(); } catch (e) {} this._d = 1; }
    const B = (BB && BB.BRANDS) || {};
    const SCAN = { ANDO: "KALK - Roof scan - EN.dc.html", LINA: "KALK - Roof scan LINA - EN.dc.html", PROP: "KALK - Wind site check PROP - EN.dc.html", MOEBIUS: "KALK - Inverter MOEBIUS - EN.dc.html", FLUXX: "KALK - Battery FLUXX - EN.dc.html", OGO: "KALK - Water OGO - EN.dc.html", SYNQ: "KALK - Meter SYNQ - EN.dc.html", OZZY: "KALK - Switch OZZY - EN.dc.html", NENDO: "KALK - Heat pump NENDO - EN.dc.html", FEU: "KALK - Heating FEU - EN.dc.html", XOOM: "KALK - Charger XOOM - EN.dc.html", AIRO: "KALK - Ventilation AIRO - EN.dc.html", GLOW: "KALK - Lighting GLOW - EN.dc.html", MOX: "KALK - Structure MOX - EN.dc.html", AGRIX: "KALK - Agri-PV AGRIX - EN.dc.html", TERRIX: "KALK - Solar park TERRIX - EN.dc.html", PONTIX: "KALK - Floating PV PONTIX - EN.dc.html", TECTIX: "KALK - Roof mounting TECTIX - EN.dc.html", PARX: "KALK - Carport PARX - EN.dc.html", CHILL: "KALK - Street furniture CHILL - EN.dc.html", TOGU: "KALK - Cabling TOGU - EN.dc.html", DODO: "KALK - Panel protection DODO - EN.dc.html", SHELTR: "KALK - Enclosure SHELTR - EN.dc.html", MUKI: "KALK - Energy set MUKI - EN.dc.html", WURK: "KALK - Crew kit WURK - EN.dc.html" };
    const LINE = { ANDO: "Draw your roof on the map and see how many ANDO panels fit, what they produce and what you save.", LINA: "Flat roofs only. Draw your flat roof and see how many LINA rows fit and what they produce.", NENDO: "Tell KALK about your house and how you heat it. KALK estimates the heat demand and suggests the NENDO system. Your local distributor sends the price.", FEU: "Tell KALK which rooms or terrace you want to heat. KALK calculates the power and suggests the FEU panels or terrace heaters. Your local distributor sends the price.", XOOM: "Tell KALK where you park and how you drive. KALK suggests the XOOM charger and the power. Your local distributor sends the price.", AIRO: "Tell KALK about the space and how airtight it is. KALK calculates the airflow and suggests the AIRO system. Your local distributor sends the price.", GLOW: "Tell KALK where you need light and what else the frame should do. KALK suggests the GLOW frames, modules and heads. Your local distributor sends the price.", MOX: "Tell KALK what you want to build with solar: awning, porch, pergola, fence or facade. KALK picks the MOX structure and the article codes. Your local distributor sends the price.", AGRIX: "Find your field on the satellite map, draw it and tell KALK the crop or animals. KALK suggests the AGRIX structure, the row spacing and the power. Your local distributor sends the price.", TERRIX: "Find your land on the satellite map, draw it and choose the type of mounting. KALK estimates the power, the tables and the yield. Your local distributor sends the price.", PONTIX: "Find the water on the satellite map, draw its outline and tell KALK how much to cover. KALK estimates the float area, the power and the anchoring. Your local distributor sends the price.", TECTIX: "Find your roof on the satellite map, draw it and tell KALK the roof type. KALK suggests the TECTIX mounting, rails and hooks or ballast. Your local distributor sends the price.", PARX: "Find your parking on the satellite map, draw it and tell KALK what parks there. KALK picks the PARX carport or bikeport and the article codes. Your local distributor sends the price. Your local distributor sends the price.", CHILL: "Drop a pin on the map where you want to place it, then tell KALK what the place needs: seating, shade, charging or light. KALK suggests the CHILL modules. Your local distributor sends the price.", TOGU: "Tell KALK the system, the power and the cable length. KALK suggests the TOGU cable cross-section, protection and routing. Your local distributor sends the price.", DODO: "Panels already on the roof: draw the panel field on the satellite map. Not yet: enter the panel size and layout. KALK calculates the edge and the DODO QUILL strips and clips. Your local distributor sends the price. Your local distributor sends the price.", SHELTR: "Name your project, then choose the SHELTR enclosures from a list or put dots on the map where each one goes. KALK makes the product list. Your local distributor sends an offer with price and lead time. Your local distributor sends the price.", MUKI: "Tell KALK what you want to start with. KALK puts together a MUKI set from the brands that work together. Your local distributor sends the price.", WURK: "Tell KALK what your crew installs. KALK puts together the WURK tools. Your local distributor sends the price.", OZZY: "Tell KALK what you want to switch, your connection and phase; KALK picks the OZZY plugs, switches and hubs and draws them on the Wi-Fi mesh. Hardwired switches need an electrician.", SYNQ: "Tell KALK your meter type, phase and what to measure; KALK puts together the SYNQ set and draws it into your fuse box.", OGO: "Find your place in Europe, enter roof area and water use; KALK suggests the OGO tank and shows the tank level per month.", FLUXX: "Enter your yearly use, price, solar and tariff; KALK shows the FLUXX battery, capacity and a typical day.", MOEBIUS: "Choose panels, grid connection and roof directions; KALK suggests the MOEBIUS inverter and draws the DC diagram.", PROP: "Place the turbine on the map, choose the mast and see the wind at hub height and which PROP turbine fits." };
    const item = (k) => { const t = (B[k] && B[k].tool) || null; const tool = k === "PROP" ? "Wind site check" : k === "MOEBIUS" ? "Calculate your inverter" : k === "FLUXX" ? "Find your battery" : k === "OGO" ? "Rainwater check" : k === "SYNQ" ? "Find your meter" : k === "OZZY" ? "Find your OZZY" : k === "MOX" ? "Find your MOX structure" : k === "AGRIX" ? "Plan your agri-PV" : k === "TERRIX" ? "Plan your solar park" : k === "PONTIX" ? "Plan your floating PV" : k === "TECTIX" ? "Size your roof mounting" : k === "PARX" ? "Find your solar carport" : k === "CHILL" ? "Plan your street furniture" : k === "TOGU" ? "Size your cabling" : k === "DODO" ? "Protect your panels" : k === "SHELTR" ? "Plan your SHELTR project" : k === "MUKI" ? "Find your energy set" : k === "WURK" ? "Build your crew kit" : k === "NENDO" ? "Size your heat pump" : k === "FEU" ? "Size your heating" : k === "XOOM" ? "Find your charger" : k === "AIRO" ? "Find your ventilation" : k === "GLOW" ? "Plan your lighting" : SCAN[k] ? "Plan your roof" : (t ? t[0] : null), href = SCAN[k] || (t ? t[1] : null); if (!tool || !href) return null;
      return { label: k, title: "KALK for " + k, subtitle: tool, text: LINE[k] || (tool + " with the " + k + " range, based on your site and use."), href, firstLabel: tool, colour: C[k] }; };
    return { entries: G.map(([name, ks]) => ({ name, items: ks.map(item).filter(Boolean) })).filter((g) => g.items.length) };
  }
}
</script>
</body>
</html>
