<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/emon-strohm-energy-design-system-19842d9c-a171-4ea8-9e9e-bb2ea0c78d1d/colors_and_type.css">
<link rel="stylesheet" href="strohm-type.css">
<script src="_ds/emon-strohm-energy-design-system-19842d9c-a171-4ea8-9e9e-bb2ea0c78d1d/_ds_bundle.js"></script>
<title>LINA Responsibility | STRØHM.ENERGY</title>
<meta name="robots" content="noindex">
<style> body { margin:0; background:#FFFFFF; } a { color:var(--color-text-primary); text-decoration:none; } a:hover { color:var(--color-text-primary); } </style>
</helmet>
<div style="font-family:var(--font-web);background:#FFFFFF;min-height:100vh;color:var(--color-text-primary);">
  <dc-import name="NavBar" active="products" hint-size="100%,80px"></dc-import>
  <dc-import name="LinaNav" active="responsibility" hint-size="100%,49px"></dc-import>
  <div style="max-width:calc(1312px + 2 * var(--web-side));margin:0 auto;padding:16px var(--web-side);box-sizing:border-box;font-size:12px;font-weight:700;letter-spacing:0.08em;color:#B07818;border-bottom:1px solid var(--color-divider);">DRAFT. Certifications and specifications taken from the uploaded VPV unit datasheet (xM-3 QUATTRO-256S). Items without a source are marked [TO CONFIRM].</div>
  <dc-import name="BrandResponsibility" brand="LINA" unit="unit" intro="{{ intro }}" durability="{{ durability }}" materials="{{ materials }}" certs="{{ certs }}" packaging="{{ packaging }}" eol="{{ eol }}" hint-size="100%,2400px"></dc-import>
  <dc-import name="ContentSections" brand="LINA" scope="brand" hint-size="100%,1600px"></dc-import>
  <dc-import name="ReachSpecialist" brand="LINA" hint-size="100%,420px"></dc-import>
  <dc-import name="Footer" hint-size="100%,400px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const TC = (w) => `[TO CONFIRM: ${w}]`;
    return {
      intro: "Certified module safety, a glass-glass construction, a light roof load and a unit designed to let green roofs keep growing underneath.",
      durability: [
        { test: "Module design and performance", standard: "IEC / EN 61215-1:2021, IEC 61215-2:2021", result: "Listed on datasheet" },
        { test: "Module safety", standard: "IEC / EN 61730-1:2023, IEC 61730-2:2023", result: "Listed on datasheet" },
        { test: "Junction box", standard: "IEC 62790:2020", result: "Listed on datasheet, IP68" },
        { test: "North American safety", standard: "UL 61730-1/-2:2022, UL 3730:2014", result: "Listed on datasheet" },
        { test: "Fire safety", standard: "Class B", result: "Listed on datasheet" },
        { test: "Wind load calculation", standard: "EN 1991-1-4 (national annexes), ASCE 7-22, NBCC 2020", result: "Listed on datasheet" },
      ],
      materials: [
        { label: "Construction", headline: "Glass-glass, bifacial.", value: "2 x 3,2 mm tempered solar glass, silicon heterojunction cells, bifaciality approx. 95%. Area load approx. 12.2 kg/m².", dir: "LINA_RESPONSIBILITY_MATERIALS_GLASS_01 · glass-glass edge detail of the VPV unit · 16:10 · placeholder (P2)" },
        { label: "Green roofs", headline: "The roof keeps working.", value: "The BIO foot is engineered for green roofs such as sedum, supporting plant growth, biodiversity and water retention. The roof stays accessible for inspection and repair.", dir: "LINA_RESPONSIBILITY_MATERIALS_GREENROOF_01 · VPV units on a sedum roof, plants growing between rows · 16:10 · placeholder (P2)" },
      ],
      certs: [
        { code: "ISO 9001", label: "Quality management " + TC("held for LINA manufacturing") },
        { code: "ISO 14001", label: "Environmental management " + TC("held for LINA manufacturing") },
        { code: "CE", label: "Listed on datasheet" },
      ],
      packaging: "27 pre-assembled units per pallet, 6,9 kWp, covering over 60 m². " + TC("packaging materials and pallet take-back"),
      eol: [
        "Unit in use",
        "Removal without roof penetration",
        "Separate collection under the WEEE Directive 2012/19/EU",
        "Approved treatment: glass, aluminium, cells and cabling recovered",
        "Recycling record",
        "Closed ownership record",
      ],
    };
  }
}
</script>
</body>
</html>
