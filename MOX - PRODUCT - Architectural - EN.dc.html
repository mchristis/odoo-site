<dc-import name="StructureCategory"

  eyebrow="MOX · Architectural structures"
  heading="Structures that belong to the building."
  intro="Awnings, entrances, outdoor rooms, balconies, boundaries and façades where photovoltaics are part of the architecture, not added to it. Each structure solves shading, rain, drainage, cabling and access as one product."
  body="Architectural PV structures are seen every day, at close range, by the people who live and work beside them. They are judged first as architecture and only then as energy systems. MOX architectural structures are therefore designed from the building interface outward: the wall anchor, the entrance, the terrace, the boundary line. Frame, module support, water management and cable routes are coordinated so that the finished structure looks deliberate and stays serviceable. Every structure is configured per project and documented at handover."

  hero-placeholder="BNR-MOX-ARCHITECTURAL-01 · 21:9 · V3-R3 context: a contemporary building with a façade awning or pergola integrated · awaiting upload"

  products="{{ products }}"
  guidance-heading="Awning, entrance, room, boundary or envelope?"
  guidance="{{ guidance }}"
  engineering="{{ engineering }}"
  hint-size="100%,100%"></dc-import>
</x-dc>

        { name: "BALCONY", status: "In preparation", statusColor: "#898989", href: "MOX - PRODUCT - BALCONY - EN.dc.html", tagline: "Balcony-integrated PV", desc: "PV modules as balustrade or balcony roof for apartments and terraced houses. Compact, plug-in ready where national rules allow." },
