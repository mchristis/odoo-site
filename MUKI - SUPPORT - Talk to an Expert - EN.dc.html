<html>
<head>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/emon-strohm-energy-design-system-19842d9c-a171-4ea8-9e9e-bb2ea0c78d1d/colors_and_type.css">
<link rel="stylesheet" href="strohm-type.css">

<title>Talk to a MUKI Expert | STRØHM.ENERGY</title>
<style> body { margin:0; background:#FFFFFF; } a { color:var(--color-text-primary); text-decoration:none; } a:hover { color:var(--color-text-primary); } </style>
</helmet>
<div style="font-family:var(--font-web);background:#FFFFFF;min-height:100vh;color:var(--color-text-primary);">
  <dc-import name="NavBar" active="products" hint-size="100%,80px"></dc-import>
  <dc-import name="MukiNav" active="support" hint-size="100%,73px"></dc-import>
  <dc-import name="PageHero" brand="MUKI" rgb="223,85,12" title="A set must fit the home. Ask which one." intro="Roof, connection, consumption and existing equipment decide which MUKI set fits." slot="muki-talk-to-an-expert-hero" shot="MUKI · Talk to an Expert · hero photo or short muted loop (3–6 s)" hint-size="100%,625px"></dc-import><section style="max-width:calc(1312px + 2 * var(--web-side));margin:0 auto;padding:40px var(--web-side) 0;box-sizing:border-box;">
    <div style="font-size:12px;font-weight:300;color:var(--color-grey-70);margin-bottom:20px;display:flex;gap:6px;flex-wrap:wrap;"><a href="MUKI - PRODUCT - Overview - EN.dc.html" style="color:var(--color-grey-70);">MUKI</a><span>&#8250;</span><span style="color:var(--color-text-primary);">TALK TO AN EXPERT</span></div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;"><span style="width:9px;height:9px;background:var(--color-brand-muki,#4F4F4E);border-radius:50%;"></span><span style="font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);letter-spacing:var(--web-eyebrow-ls);text-transform:uppercase;color:var(--color-text-primary);">Talk to an expert</span></div>
    <p style="margin:0 0 32px;font-size:var(--web-body-size);font-weight:var(--web-body-weight);line-height:var(--web-body-lh);color:var(--color-text-primary);max-width:720px;">Reach a specialist before ordering.</p>
    <!-- DEPTH-1062: selected product/set from URL -->
    <sc-if value="{{ hasSelected }}" hint-placeholder-val="{{ false }}">
      <div style="display:inline-flex;align-items:center;gap:12px;background:#F4F4F4;border-radius:8px;padding:12px 16px;margin:0 0 32px;font-size:var(--web-small-size);line-height:var(--web-small-lh);"><span style="font-weight:500;">Selected:</span><span style="font-weight:300;">{{ selectedText }}</span></div>
    </sc-if>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:48px;">
      <a href="MUKI - PRODUCT - Set Selector - EN.dc.html" style="height:44px;padding:0 22px;display:inline-flex;align-items:center;background:var(--color-card-muki,#F4F4F4);border:1px solid var(--color-divider);color:var(--color-text-primary);font-size:var(--cta-font);border-radius:8px;font-weight:var(--web-btn-weight);">Set selector</a>
    </div>
  </section>
  <section style="max-width:calc(1312px + 2 * var(--web-side));margin:0 auto;padding:48px var(--web-side) 0;box-sizing:border-box;">
    <div style="border-top:1px solid var(--color-divider);padding-top:32px;display:flex;flex-direction:column;gap:16px;">
      <div style="font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);letter-spacing:var(--web-eyebrow-ls);text-transform:uppercase;color:var(--color-text-primary);">Products Filip De Smet covers</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px;">
        <a href="MUKI - PRODUCT - Products - EN.dc.html" style="background:#F4F4F4;padding:16px 20px;font-size:var(--web-btn-sm-size);font-weight:var(--web-btn-weight);border-radius:12px;" style-hover="background:#E3E3E3;">MUKI sets</a>
        <a href="MUKI - PRODUCT - ZORBA - EN.dc.html" style="background:#F4F4F4;padding:16px 20px;font-size:var(--web-btn-sm-size);font-weight:var(--web-btn-weight);border-radius:12px;" style-hover="background:#E3E3E3;">MUKI ZORBA</a>
      </div>
    </div>
  </section>
  <dc-import name="ReachSpecialist" brand="MUKI" photo-slot-id="muki-expert-specialist" hint-size="100%,420px"></dc-import>
  <div style="height:64px;"></div>
  <dc-import name="Footer" hint-size="100%,400px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
// DEPTH-1062: shows the product and set passed from MUKI ZORBA (?product=ZORBA&set=…&topic=…).
class Component extends DCLogic {
  state = { text: "" };
  componentDidMount() {
    let q; try { q = new URLSearchParams(location.search); } catch (e) { return; }
    if (q.get("product") !== "ZORBA") return;
    const set = q.get("set"), topic = q.get("topic");
    const done = (lbl) => this.setState({ text: ["MUKI ZORBA", lbl, topic].filter(Boolean).join(" · ") });
    if (!set) { done(""); return; }
    import("./muki-zorba-sets.js").then((m) => { const s = m.default.sets.find((x) => x.id === set); done(s ? m.default.label(s) : ""); }).catch(() => done(""));
  }
  renderVals() { return { hasSelected: !!this.state.text, selectedText: this.state.text }; }
}
</script>
</body>
</html>
