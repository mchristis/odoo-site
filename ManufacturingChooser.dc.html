<x-dc>
<helmet>
<style>body{margin:0;background:#FFFFFF;font-family:var(--font-web);color:#5F5E5E}a{color:#4F4F4E;text-decoration:none}a:hover{color:#F76801}</style>
</helmet>
<div style="display:flex;flex-wrap:wrap;gap:24px;font-family:var(--font-web);">

    <div style="font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);letter-spacing:var(--web-eyebrow-ls);text-transform:uppercase;color:#5F5E5E;">Products</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:clamp(4px,1vw,12px);">
    <sc-for list="{{ flat }}" as="t" hint-placeholder-count="25">
      <button type="button" onMouseEnter="{{ t.enter }}" onFocus="{{ t.focus }}" onClick="{{ t.click }}" aria-pressed="{{ t.pressed }}" aria-label="{{ t.aria }}" style="font:inherit;background:transparent;border:0;cursor:pointer;padding:10px 0;min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;min-width:0;" style-focus="outline:1px solid #4F4F4E;outline-offset:2px;">
        <span style="position:relative;display:block;height:clamp(26px,2.6vw,34px);width:clamp(26px,2.6vw,34px);transform:scale({{ t.scale }});transform-origin:center top;transition:transform 180ms ease;"><img src="{{ t.logo }}" alt="" style="display:block;height:100%;width:100%;object-fit:contain;visibility:{{ t.colVis }};"><span style="position:absolute;inset:0;background:#A3A3A3;visibility:{{ t.monoVis }};-webkit-mask:url('{{ t.logo }}') center / contain no-repeat;mask:url('{{ t.logo }}') center / contain no-repeat;"></span></span>
        <span style="display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:{{ t.labelGap }};opacity:{{ t.labelOp }};transition:opacity 180ms ease,margin-top 180ms ease;text-align:center;">
          <span style="font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);letter-spacing:var(--web-eyebrow-ls);line-height:1;color:#4F4F4E;text-transform:uppercase;">{{ t.name }}</span>
        </span>
      </button>
    </sc-for>
    </div>
  </div>
  <aside aria-live="polite" onMouseEnter="{{ panelEnter }}" style="flex:1.4 1 420px;min-width:0;min-height:560px;box-sizing:border-box;padding:32px 28px 16px;border-radius:12px;background:#F7F7F5;display:flex;flex-direction:column;justify-content:space-between;gap:24px;">
    <sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;">
        <span style="font-size:32px;font-weight:100;line-height:1.1;color:#5F5E5E;">H</span>
        <span style="font-size:32px;font-weight:100;line-height:1.1;color:#5F5E5E;">O</span>
        <span style="font-size:32px;font-weight:100;line-height:1.1;color:#5F5E5E;">W</span>
      </div>
    </sc-if>
    <sc-if value="{{ hasActive }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:20px;min-width:0;">
        <div style="display:flex;flex-direction:column;gap:6px;">
          <div style="font-size:clamp(28px,3vw,44px);font-weight:100;letter-spacing:0.15em;line-height:1.05;text-transform:uppercase;color:#4F4F4E;overflow-wrap:anywhere;">{{ a.name }}</div>
          <div style="font-size:var(--web-body-size);font-weight:300;color:#4F4F4E;line-height:var(--web-body-lh);">{{ a.sub }}</div>
          <div style="font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);letter-spacing:var(--web-eyebrow-ls);text-transform:uppercase;color:#5F5E5E;">{{ a.group }}</div>
        </div>
        <div role="tablist" aria-label="How it is made" data-cols="4" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 12px;--cg:12px;">
          <sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="4">
            <button type="button" role="tab" aria-selected="{{ tb.sel }}" onClick="{{ tb.pick }}" style="cursor:pointer;background:none;border:0;border-top:2px solid {{ tb.line }};padding:8px 0 4px;font:inherit;font-size:14px;font-weight:{{ tb.weight }};color:#252525;text-align:left;min-height:44px;transition:border-color 200ms ease;" style-focus="outline:1px solid #4F4F4E;outline-offset:2px;">{{ tb.label }}</button>
          </sc-for>
        </div>
        <p style="margin:0;font-size:var(--web-small-size);font-weight:300;line-height:var(--web-small-lh);color:#5F5E5E;text-wrap:pretty;">{{ tabIntro }}</p>
        <div style="display:flex;flex-direction:column;">
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:2px 24px;padding:8px 0;border-top:1px solid #E3E3E3;">
              <span style="font-size:14px;font-weight:400;line-height:1.45;color:#252525;">{{ r.t }}</span>
              <span style="font-size:var(--web-small-size);font-weight:300;line-height:var(--web-small-lh);color:#5F5E5E;text-wrap:pretty;">{{ r.p }}</span>
            </div>
          </sc-for>
        </div>

14px;font-weight:300;line-height:1.5;color:#5F5E5E;"><span style="font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);letter-spacing:var(--web-eyebrow-ls);text-transform:uppercase;color:#5F5E5E;">Video · required asset</span><span>{{ videoLabel }}</span><span>Protect · 15 s, plays on click</span></figcaption></figure></sc-if><sc-if value="{{ vg.g8 }}" hint-placeholder-val="{{ false }}"><figure style="margin:0;display:flex;flex-direction:column;gap:8px;"><div style="aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#F4F4F4;"><image-slot id="how-mfg-video-complete-systems" shape="rounded" radius="8" placeholder="VIDEO (poster image until the video file is supplied) · Complete systems: machine at work, 15 s, no sound"></image-slot></div><figcaption style="display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;font-weight:300;line-height:1.5;color:#5F5E5E;"><span style="font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);letter-spacing:var(--web-eyebrow-ls);text-transform:uppercase;color:#5F5E5E;">Video · required asset</span><span>{{ videoLabel }}</span><span>Complete systems · 15 s, plays on click</span></figcaption></figure></sc-if><sc-if value="{{ vg.g9 }}" hint-placeholder-val="{{ false }}"><figure style="margin:0;display:flex;flex-direction:column;gap:8px;"><div style="aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#F4F4F4;"><image-slot id="how-mfg-video-tools" shape="rounded" radius="8" placeholder="VIDEO (poster image until the video file is supplied) · Tools: machine at work, 15 s, no sound"></image-slot></div><figcaption style="display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;font-weight:300;line-height:1.5;color:#5F5E5E;"><span style="font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);letter-spacing:var(--web-eyebrow-ls);text-transform:uppercase;color:#5F5E5E;">Video · required asset</span><span>{{ videoLabel }}</span><span>Tools · 15 s, plays on click</span></fi     <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;">
      <span style="font-size:12px;font-weight:300;color:#5F5E5E;">{{ hint }}</span>

        <span style="display:block;width:1px;height:28px;background:#5F5E5E;"></span>
        <span style="display:block;width:1px;height:28px;background:#5F5E5E;"></span>
      </button>
    </div>
  </aside>
</div>

      flat, a: active || { name: '', sub: '', group: '' }, hasActive: !!active, idle: !active, rows,
      tabs: MC_TABS.map(([k, l]) => ({ label: l, sel: tab === k ? 'true' : 'false', line: tab === k ? '#F76801' : '#E3E3E3', weight: tab === k ? 400 : 300, pick: () => this.setState({ tab: k }) })),
      tabIntro: tdef[2], page, hasPage: !!page, noPage: !page, videoLabel: active ? tdef[1] + ' · ' + active.name : '',
      ...(() => { const slug = grp ? MC_SLUG[grp.title] : ''; const src = slug ? MC_VIDEO[slug] : ''; const vg = {}; ["generate","convert","store","measure-and-control","use","build-and-connect","protect","complete-systems","tools"].forEach((s, i) => { vg['g' + (i + 1)] = !!grp && !src && s === slug; }); return { vg, hasVideo: !!src, videoSrc: src || '', vidRef: this.vidRefCb }; })(),
      hint: pinned ? 'Selected. Tap the lines to go back.' : 'Hover or tap a symbol to see how it is made.',
      rot: pinned ? '90deg' : '0deg',
      gridLeave: () => { clearTimeout(this.t); }, panelEnter: () => { clearTimeout(this.t); },
      unpin: () => this.setState({ pinned: null, hover: null })
    };
  }
}</script>
