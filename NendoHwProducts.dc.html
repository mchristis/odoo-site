<!DOCTYPE html>
<html>
<head>
<!-- Body of OGO - PRODUCT - Products - EN.dc.html for NENDO Read more (DEPTH-970). Content unchanged. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/emon-strohm-energy-design-system-19842d9c-a171-4ea8-9e9e-bb2ea0c78d1d/colors_and_type.css">
<link rel="stylesheet" href="strohm-type.css">
<script src="_ds/emon-strohm-energy-design-system-19842d9c-a171-4ea8-9e9e-bb2ea0c78d1d/_ds_bundle.js"></script>
<title>NENDO Products | STRØHM.ENERGY</title>
<style> body { margin:0; background:#FFFFFF; } a { color:var(--color-text-primary); text-decoration:none; } a:hover { color:var(--color-brand-nendo); } html { scroll-behavior:smooth; } [id] { scroll-margin-top:130px; } </style>
</helmet>
<div style="font-family:var(--font-web);background:#FFFFFF;min-height:100vh;color:var(--color-text-primary);">

  <dc-import name="PageHero" brand="NENDO" rgb="27,139,154" title="Three ways to make hot water smarter." intro="An electric water tank with integrated solar MPPT, an all-in-one heat pump boiler, and the same heat pump boiler with integrated solar MPPT." slot="ogo-products-hero" shot="NENDO · Products · hero photo or short muted loop (3–6 s)" hint-size="100%,625px"></dc-import><section style="max-width:calc(1312px + 2 * var(--web-side));margin:0 auto;padding:40px var(--web-side) 0;box-sizing:border-box;">
    <div style="font-size:12px;font-weight:300;color:var(--color-grey-70);margin-bottom:20px;display:flex;gap:6px;"><a href="NENDO - PRODUCT - Overview - EN.dc.html#hot-water" style="color:var(--color-grey-70);">NENDO</a><span>&#8250;</span><span style="color:var(--color-text-primary);">PRODUCTS</span></div>
    <p style="margin:0 0 40px;font-size:var(--web-body-size);font-weight:var(--web-body-weight);line-height:var(--web-body-lh);color:var(--color-text-primary);max-width:760px;">All three can be controlled by EMON.</p>
    <div style="margin-bottom:40px;"><figure style="margin:0;display:flex;flex-direction:column;gap:8px;"><div style="aspect-ratio:16/9;background:var(--color-card-ogo);overflow:hidden;border-radius:12px;"><img src="assets/ogo/ogo-cutaway-01.png" alt="Cutaway of the NENDO all-in-one heat pump boiler" style="width:100%;height:100%;object-fit:cover;display:block;"></img></div><figcaption style="font-size:var(--web-min-size);font-weight:300;color:var(--color-grey-70);line-height:var(--web-min-lh);">NENDO AIO Heat Pump Boiler, cutaway.</figcaption></figure></div>
    <div style="border-top:1px solid var(--color-text-primary);overflow-x:auto;">
      <div data-stack="1" style="display:grid;grid-template-columns:minmax(220px,1.6fr) minmax(160px,1fr) minmax(120px,0.8fr) minmax(120px,0.8fr);min-width:620px;">
        <sc-for list="{{ overviewHead }}" as="h" hint-placeholder-count="4"><div style="padding:12px 12px 12px 0;font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);letter-spacing:var(--web-eyebrow-ls);text-transform:uppercase;color:var(--color-text-primary);border-bottom:1px solid var(--color-divider);">{{ h }}</div></sc-for>
        <sc-for list="{{ overviewCells }}" as="c" hint-placeholder-count="12"><a href="{{ c.href }}" style="padding:14px 12px 14px 0;font-size:var(--web-small-size);font-weight:{{ c.w }};color:{{ c.fg }};border-bottom:1px solid var(--color-divider);">{{ c.v }}</a></sc-for>
      </div>
    </div>
  </section>

  <sc-for list="{{ series }}" as="s" hint-placeholder-count="3">
    <section id="{{ s.id }}" style="max-width:calc(1312px + 2 * var(--web-side));margin:0 auto;padding:80px var(--web-side) 0;box-sizing:border-box;">
      <div style="border-top:1px solid var(--color-divider);padding-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:40px;">
        <div style="display:flex;flex-direction:column;gap:8px;">
          <div style="font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);letter-spacing:var(--web-eyebrow-ls);text-transform:uppercase;color:#898989;">{{ s.num }} / Series</div>
          <h2 style="margin:0;font-size:clamp(24px,2.4vw,32px);font-weight:200;line-height:1.08;letter-spacing:-1px;color:#252525;text-wrap:balance;">{{ s.name }}</h2>
          <div style="font-size:var(--web-small-size);font-weight:300;color:var(--color-text-primary);line-height:var(--web-small-lh);">{{ s.type }}</div>
          <a href="{{ s.page }}" style="font-size:14px;border-bottom:1px solid var(--color-text-primary);padding-bottom:2px;align-self:flex-start;margin-top:8px;">Product page &#8250;</a>
        </div>
        <div style="grid-column:span 2;min-width:0;display:flex;flex-direction:column;gap:16px;">
          <p style="margin:0;max-width:820px;font-size:var(--web-body-size);font-weight:var(--web-body-weight);line-height:var(--web-body-lh);color:#5F5E5E;text-wrap:pretty;">{{ s.text }}</p>
          <div style="display:flex;flex-wrap:wrap;gap:8px;"><sc-for list="{{ s.tags }}" as="t" hint-placeholder-count="3"><span style="font-size:var(--web-tag-size);font-weight:var(--web-tag-weight);background:var(--color-card-ogo);padding:8px 12px;border-radius:8px;">{{ t }}</span></sc-for></div>
          <div style="overflow-x:auto;border-top:1px solid var(--color-text-primary);">
            <div data-stack="1" style="display:grid;grid-template-columns:minmax(80px,0.5fr) minmax(170px,1fr) minmax(200px,1.2fr);min-width:480px;">
              <sc-for list="{{ modelHead }}" as="h" hint-placeholder-count="3"><div style="padding:10px 12px 10px 0;font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);letter-spacing:var(--web-eyebrow-ls);text-transform:uppercase;color:var(--color-text-primary);border-bottom:1px solid var(--color-divider);">{{ h }}</div></sc-for>
              <sc-for list="{{ s.cells }}" as="c" hint-placeholder-count="12"><div style="padding:12px 12px 12px 0;font-size:var(--web-small-size);font-weight:{{ c.w }};color:{{ c.fg }};border-bottom:1px solid var(--color-divider);font-family:{{ c.font }};">{{ c.v }}</div></sc-for>
            </div>
          </div>
        </div>
      </div>
    </section>
  </sc-for>

  <section style="max-width:calc(1312px + 2 * var(--web-side));margin:0 auto;padding:64px var(--web-side) 0;box-sizing:border-box;display:flex;gap:12px;flex-wrap:wrap;">
    <a class="emon-btn-primary" href="NENDO - WEBSHOP - Shop - EN.dc.html#hot-water" style="font-size:var(--web-link-size);padding:0 22px;height:44px;display:inline-flex;align-items:center;border-radius:var(--radius-btn);;width:auto;font-family:var(--font-web);font-weight:var(--web-link-weight);">Shop NENDO<svg width="0.5em" height="0.9em" viewBox="0 0 8 14" aria-hidden="true" style="display:inline-block;vertical-align:-0.12em;margin-left:0.4em;flex:none;"><polyline points="1,1 7,7 1,13" fill="none" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"></polyline></svg></a>
    <a href="NENDO - PRODUCT - Hot Water Sizing - EN.dc.html" style="font-size:var(--cta-font);padding:0 22px;height:44px;display:inline-flex;align-items:center;background:var(--color-card-ogo);color:var(--color-text-primary);border-radius:var(--radius-btn);font-weight:var(--web-btn-weight);">Which NENDO do I need?</a>
    <a href="NENDO - PRODUCT - Hot Water with EMON - EN.dc.html" style="font-size:var(--cta-font);padding:0 22px;height:44px;display:inline-flex;align-items:center;background:var(--color-card-ogo);color:var(--color-text-primary);border-radius:var(--radius-btn);font-weight:var(--web-btn-weight);">NENDO with EMON</a>
  </section>

  <div style="height:64px;"></div>
  <dc-import name="ContentSections" brand="NENDO" scope="brand" hint-size="100%,1600px"></dc-import>
  <dc-import name="ReachSpecialist" brand="NENDO" photo-slot-id="ogo-overview-specialist" hint-size="100%,420px"></dc-import>
  <dc-import name="SupportModule" kind="product" brand="NENDO" accent="var(--color-brand-nendo)" hint-size="100%,520px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const TC = "TO CONFIRM";
const SERIES = [
  { id: "mppt-tank", name: "NENDO MPPT Water Tank Boiler", type: "Water tank boiler, solar MPPT integrated",
    text: "An electric water tank with an integrated solar MPPT controller. Solar panels connect directly to the tank: surplus solar is turned into hot water without an inverter in between. The simplest way to store solar energy as heat.",
    tags: ["Solar MPPT integrated", "Electric heating element", "EMON compatible"],
    models: [["80 L", TC, "OG-WTB-80L-V1"]] },
  { id: "aio", name: "NENDO AIO Heat Pump Boiler", type: "All-in-one heat pump boiler",
    text: "An all-in-one heat pump water heater. It moves heat from the air into the water instead of making all of it from electricity, so the same hot water needs substantially less purchased electricity than an electric boiler.",
    tags: ["Heat pump", "Four tank sizes", "EMON compatible"],
    models: [["80 L", "Ø 520 × H 1160 mm", "OG-AIO-HPB-80L-V1"], ["200 L", "Ø 560 × H 1745 mm", "OG-AIO-HPB-200L-V1"], ["300 L", "Ø 600 × H 1850 mm", "OG-AIO-HPB-300L-V1"], ["500 L", "Ø 700 × H 2253 mm", "OG-AIO-HPB-500L-V1"]] },
  { id: "aio-mppt", name: "NENDO AIO Heat Pump Boiler with MPPT", type: "All-in-one heat pump boiler, solar MPPT integrated",
    text: "The all-in-one heat pump boiler with an integrated solar MPPT controller. Solar panels feed the boiler directly, and the heat pump multiplies every kWh of solar electricity into several kWh of hot water.",
    tags: ["Heat pump", "Solar MPPT integrated", "Four tank sizes", "EMON compatible"],
    models: [["80 L", "Ø 520 × H 1160 mm", "OG-AIO-HPB-MPPT-80L-V1"], ["200 L", "Ø 560 × H 1745 mm", "OG-AIO-HPB-MPPT-200L-V1"], ["300 L", "Ø 600 × H 1850 mm", "OG-AIO-HPB-MPPT-300L-V1"], ["500 L", "Ø 700 × H 2253 mm", "OG-AIO-HPB-MPPT-500L-V1"]] },
];
const PAGES = { "mppt-tank": "NENDO - PRODUCT - MPPT Water Tank Boiler - EN.dc.html", "aio": "NENDO - PRODUCT - AIO Heat Pump Boiler - EN.dc.html", "aio-mppt": "NENDO - PRODUCT - AIO Heat Pump Boiler with MPPT - EN.dc.html" };
class Component extends DCLogic {
  renderVals() {
    return {
      overviewHead: ["Series", "Heating", "Solar MPPT", "Sizes"],
      overviewCells: SERIES.flatMap(s => [
        { v: s.name, w: 700, fg: "#4F4F4E", href: PAGES[s.id] },
        { v: /heat pump/i.test(s.name) ? "Heat pump" : "Electric element", w: 300, fg: "#4F4F4E", href: "#" + s.id },
        { v: /MPPT/.test(s.name) ? "Integrated" : "No", w: 300, fg: "#4F4F4E", href: "#" + s.id },
        { v: s.models.map(m => m[0].replace(" L", "")).join(" / ") + " L", w: 300, fg: "#4F4F4E", href: "#" + s.id },
      ]),
      modelHead: ["Volume", "Dimensions", "Article code"],
      series: SERIES.map((s, i) => ({ ...s, page: PAGES[s.id], num: String(i + 1).padStart(2, "0"),
        cells: s.models.flatMap(m => m.map((v, j) => ({ v, w: j === 0 ? 700 : 300, fg: v === TC ? "#B07818" : j === 0 ? "#4F4F4E" : "#4F4F4E", font: j === 2 ? "var(--font-web)" : "inherit" }))) })),
    };
  }
}
</script>
</body>
</html>
