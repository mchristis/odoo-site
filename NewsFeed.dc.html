<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="max-width:calc(1312px + 2 * var(--web-side));margin:0 auto;padding:120px var(--web-side) 0;box-sizing:border-box;font-family:var(--font-web);color:#4F4F4E;">
  <div style="border-top:1px solid #E3E1DB;padding-top:40px;">

    <!-- NEWS -->
    <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:32px;">
      <div>
        <div style="font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);letter-spacing:var(--web-eyebrow-ls);text-transform:uppercase;color:#898989;margin-bottom:16px;">{{ eyebrow }}</div>
        <sc-if value="{{ heroTitles }}" hint-placeholder-val="{{ false }}"><h2 style="margin:0;font-size:clamp(36px,3.6vw,52px);font-weight:200;line-height:1.08;letter-spacing:-1px;color:#252525;text-wrap:balance;">{{ heading }}</h2></sc-if><sc-if value="{{ plainTitles }}" hint-placeholder-val="{{ true }}"><h3 style="margin:0;font-size:32px;font-weight:400;line-height:1.2;">{{ heading }}</h3></sc-if>
      </div>
      <a href="{{ allHref }}" style="text-decoration:none;font-size:var(--cta-font,16px);font-weight:400;color:#4F4F4E;border:1px solid #E3E1DB;padding:4px var(--cta-pad-x,32px);min-height:var(--cta-height,56px);border-radius:var(--cta-radius,8px);display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;">{{ allLabel }}</a>
    </div>

    <div data-cols="3" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;--cg:12px;">
      <sc-for list="{{ items }}" as="n" hint-placeholder-count="3">
        <span style="text-decoration:none;display:flex;flex-direction:column;background:#F4F4F4;border-radius:12px;" data-placeholder-link="true">
          <div style="font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);letter-spacing:var(--web-eyebrow-ls);text-transform:uppercase;color:{{ accent }};padding:16px 20px 0;">{{ n.tag }}</div>
          <div style="margin:16px 20px;aspect-ratio:16/10;">
            <image-slot id="{{ n.slotId }}" shape="rounded" radius="8" placeholder="Drop a news image"></image-slot>
          </div>
          <div style="padding:0 20px 20px;">
            <div style="font-size:var(--web-h3-size);font-weight:var(--web-h3-weight);color:#4F4F4E;margin-bottom:10px;line-height:var(--web-h3-lh);">{{ n.title }}</div>
            <div style="font-size:var(--web-min-size);font-weight:300;color:#5F5E5E;line-height:var(--web-min-lh);margin-bottom:14px;">{{ n.desc }}</div>
            <div style="font-size:var(--web-min-size);font-weight:300;color:#898989;line-height:var(--web-min-lh);">{{ n.meta }}</div>
          </div>
        </span>
      </sc-for>
    </div>

    <!-- FROM OUR INSTALLATIONS -->
    <div style="margin-top:56px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:24px;">
        <div>
          <div style="font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);letter-spacing:var(--web-eyebrow-ls);text-transform:uppercase;color:#898989;margin-bottom:12px;">From our installations</div>
          <h4 style="margin:0;font-size:var(--web-h3-size);font-weight:300;line-height:var(--web-h3-lh);">{{ installHeading }}</h4>
        </div>
        <span style="font-size:var(--web-min-size);font-weight:300;color:#898989;line-height:var(--web-min-lh);">{{ installNote }}</span>
      </div>
      <div data-cols="4" style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;--cg:16px;">
        <sc-for list="{{ installations }}" as="inst" hint-placeholder-count="4">
          <div>
            <div style="aspect-ratio:4/3;margin-bottom:12px;">
              <image-slot id="{{ inst.slotId }}" shape="rounded" radius="12" placeholder="Drop an installation photo"></image-slot>
            </div>
            <div style="font-size:var(--web-small-size);font-weight:300;color:#4F4F4E;margin-bottom:2px;line-height:var(--web-small-lh);">{{ inst.title }}</div>
            <div style="font-size:var(--web-min-size);font-weight:300;color:#5F5E5E;line-height:var(--web-min-lh);">{{ inst.meta }}</div>
          </div>
        </sc-for>
      </div>
    </div>

  </div>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1400, &quot;height&quot;: 900}, &quot;eyebrow&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;News&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;heading&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Latest updates.&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;accent&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#21AE8F&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;allHref&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;#&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;allLabel&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;All news&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;installHeading&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Installed. Documented. Monitored.&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;installNote&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Shown where permission has been granted.&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;items&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;Array&lt;{tag:string,title:string,desc:string,meta:string,slotId:string}&gt;&quot;}, &quot;installations&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;Array&lt;{title:string,meta:string,slotId:string}&gt;&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { heroTitles: !!this.props.hero, plainTitles: !this.props.hero,
      eyebrow: this.props.eyebrow ?? "News",
      heading: this.props.heading ?? "Latest updates.",
      accent: this.props.accent ?? "#21AE8F",
      allHref: this.props.allHref ?? "#",
      allLabel: this.props.allLabel ?? "All news",
      installHeading: this.props.installHeading ?? "Installed. Documented. Monitored.",
      installNote: this.props.installNote ?? "Shown where permission has been granted.",
      items: this.props.items ?? [],
      installations: this.props.installations ?? [],
    };
  }
}

</script>
</body>
</html>
