<script type="text/x-dc" data-dc-script>
// DEPTH-1006: OGO questions moved here from DIVAN, WALL, TONY, Water System and EMON (OF-Q1 A).
class Component extends DCLogic {
  renderVals() {
    return { faqPages: [
     {
      "page": "DIVAN",
      "href": "OGO - PRODUCT - DIVAN - EN.dc.html",
      "groups": [
       {
        "title": "Questions",
        "count": "8",
        "items": [
         {
          "q": "What is included with DIVAN?",
          "a": "The intended standard package includes 750 litre storage, an automatic pressure pump, a 20 metre hose, spray gun, water fed wash brush, accessory couplings and a drip irrigation starter kit with suitable filtration and pressure regulation."
         },
         {
          "q": "Can I use a lawn sprinkler?",
          "a": "Use a sprinkler listed as compatible with the tested pump and hose arrangement. Coverage depends on the sprinkler, pressure, flow and site conditions."
         },
         {
          "q": "Is the lawn sprinkler included?",
          "a": "The proposed standard package includes drip irrigation. A lawn sprinkler is a separate accessory."
         },
         {
          "q": "Can I wash a car?",
          "a": "The supplied spray gun and water fed brush support ordinary washing and rinsing of suitable surfaces. Use appropriate filtration and follow the vehicle and surface care instructions."
         },
         {
          "q": "Is this a pressure washer?",
          "a": "No. The system provides garden hose pressure. High pressure cleaning requires a separate suitable appliance."
         },
         {
          "q": "Is 750 litres the usable volume?",
          "a": "The final specification will distinguish nominal storage capacity from usable pumped volume. Minimum operating level and any selected reserve reduce the volume available for a particular task."
         },
         {
          "q": "Can I connect on either side?",
          "a": "The design permits a left or right downpipe arrangement. Confirm the selected OGO connection kit and service layout for the installation."
         },
         {
          "q": "Can I connect several storage products?",
          "a": "A compatible linked arrangement may be specified, subject to the tank levels, pipe route and required transfer or balancing components. Do not assume any two tanks can be joined without a design review."
         }
        ]
       }
      ]
     },
     {
      "page": "WALL",
      "href": "OGO - PRODUCT - WALL - EN.dc.html",
      "groups": [
       {
        "title": "Questions",
        "count": "5",
        "items": [
         {
          "q": "Does WALL have the same equipment?",
          "a": "The WALL equipment package provides the same core watering and washing functions in a separate box beside the storage body. Refer to the selected configuration for the exact delivery contents."
         },
         {
          "q": "Is the slimline system the same product as storage fencing?",
          "a": "They belong to the WALL family but use separate article specifications and installation arrangements. Choose the appropriate format before comparing capacity or price."
         },
         {
          "q": "Can WALL stand anywhere along a fence?",
          "a": "The surface, support, clearance, exposure and plumbing must suit the selected module. The proposed location needs to be checked before installation."
         },
         {
          "q": "Does more storage automatically reduce flooding?",
          "a": "Available empty capacity can retain some incoming rainfall. The effect depends on rainfall, connected collection area, starting level and overflow design. No flood-prevention guarantee is made."
         },
         {
          "q": "Can every module be controlled separately?",
          "a": "That depends on the installed valves, pumps, sensors and hydraulic connections. Specify separate operation where it is required rather than assuming it follows from modular construction."
         }
        ]
       }
      ]
     },
     {
      "page": "TONY",
      "href": "OGO - PRODUCT - TONY - EN.dc.html",
      "groups": [
       {
        "title": "Questions",
        "count": "4",
        "items": [
         {
          "q": "Does TONY include a pump?",
          "a": "No. TONY does not include this integrated pump and accessory package."
         },
         {
          "q": "What capacity is available?",
          "a": "TONY is available as 350 L and 500 L. The product selector lists the approved articles."
         },
         {
          "q": "Can I water without a pump?",
          "a": "A gravity outlet may be suitable for some low-level uses. Its performance depends on water height and the connected route; it is not equivalent to a pressurised irrigation circuit."
         },
         {
          "q": "Is the tap controlled by EMON?",
          "a": "Only where the installed configuration includes a supported actuated valve or a controlled pumping route. The app does not make a standard manual tap remote controlled."
         }
        ]
       }
      ]
     },
     {
      "page": "Water system",
      "href": "OGO - PRODUCT - Water System - EN.dc.html",
      "groups": [
       {
        "title": "Questions",
        "count": "10",
        "items": [
         {
          "q": "Do I change the pressure for drip irrigation?",
          "a": "No manual adjustment is intended. A dedicated regulator matches the irrigation branch to the supplied drippers."
         },
         {
          "q": "Can I use both outlets together?",
          "a": "The base design is sized around one main application at a time. Simultaneous use is only supported if confirmed for the final configuration."
         },
         {
          "q": "What happens when the water level is too low?",
          "a": "Local low water protection stops pumping. Restart behaviour is specified for the selected pump and controller."
         },
         {
          "q": "Will it work without the internet?",
          "a": "Basic hose use and pump protection operate locally. Remote features require supported connectivity."
         },
         {
          "q": "Is EMON required to use the hose?",
          "a": "No app interaction is intended for ordinary hose use. The automatic pump responds locally to water demand."
         },
         {
          "q": "Can I expand the drip system?",
          "a": "Only within the limits published for the supplied line, regulator, pump and drippers. Additional components must be compatible."
         },
         {
          "q": "Does the pump run continuously?",
          "a": "The automatic system responds to water demand. Its controls are designed to stop pumping when water is no longer required."
         },
         {
          "q": "Is the hose included?",
          "a": "DIVAN includes a 20 metre garden hose and a dedicated storage compartment. WALL accommodates the hose in its separate equipment box. TONY does not include this package."
         },
         {
          "q": "Can the system remain outside in winter?",
          "a": "The storage body and water equipment have different winter requirements. Follow the model instructions and protect pumps, filters, valves and hoses from freezing."
         },
         {
          "q": "Can I drink the stored rainwater?",
          "a": "No. The proposed system is for suitable non drinking applications."
         }
        ]
       }
      ]
     },
     {
      "page": "EMON water control",
      "href": "OGO - PRODUCT - OGO with EMON - EN.dc.html",
      "groups": [
       {
        "title": "Questions",
        "count": "5",
        "items": [
         {
          "q": "Can I see the volume in litres and as a percentage?",
          "a": "Those displays use the configured tank capacity and calibration. Confirm the sensor and usable-volume settings for the installed product."
         },
         {
          "q": "Does pump on mean water is flowing?",
          "a": "Not necessarily. A command, an electrical running state and measured flow are different forms of evidence. The interface should identify which information is available."
         },
         {
          "q": "Can one app show several tanks?",
          "a": "The intended OGO experience groups the installed tanks by site. Individual readings depend on the sensor locations and hydraulic configuration."
         },
         {
          "q": "Can watering be automatic?",
          "a": "A supported schedule can activate the configured circuit. More advanced decisions require the relevant sensors, rules and tested operating logic."
         },
         {
          "q": "Does EMON make the water safe to drink?",
          "a": "No. The described monitoring and control functions do not establish drinking-water quality."
         }
        ]
       }
      ]
     }
    ] };
  }
}
</script>
