<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const TC = (w) => `[TO CONFIRM: ${w}]`;
    return {
      intro: "Declared conformity, restricted substances, a documented radio module and a clear end-of-life route. Every claim on this page is linked to a document.",
      durability: [
        { test: "Electrical safety of plugs and sockets", standard: "IEC 60884 / BS 1363 (applicable)", result: TC("result per model") },
        { test: "Radio equipment", standard: "Radio Equipment Directive 2014/53/EU (applicable)", result: TC("declaration per model") },
        { test: "Electromagnetic compatibility", standard: "EN 301 489 series (applicable)", result: TC("result per model") },
        { test: "Ingress protection, RUGO", standard: "IEC 60529, IP44", result: TC("test report") },
      ],
      materials: [
        { label: "Substances", headline: "Substances declared, not assumed.", value: "RoHS Directive 2011/65/EU and REACH apply. " + TC("declarations per model"), dir: "OZZY_RESPONSIBILITY_MATERIALS_DECLARATION_01 · declaration document preview · 16:10 · placeholder (P2)" },

      ],
      certs: [
        { code: "CE", label: "CE marking under the applicable directives " + TC("per model") },
        { code: "UKCA", label: "UKCA marking for UK versions " + TC("per model") },
        { code: "ISO 9001", label: "Quality management " + TC("held for OZZY production") },
      ],
      packaging: TC("packaging materials and recycled content"),
      eol: ["Device in use", "Removed from the socket or disconnected by an electrician (FLIP)", "Separate collection under the WEEE Directive 2012/19/EU", "Approved treatment and material recovery", "Recycling record", "Closed ownership record"],
    };
  }
}
