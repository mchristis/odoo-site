function shell(label,kick){return `<div class="sec"><button><span class="lbl">${label}<span class="kick">${kick}</span></span><span class="pm"></span></button><div class="body">`}

function renderSort(){const so=document.getElementById("sort"),cur=so.value;let opts=[["load-asc","Load, low to high"],["load-desc","Load, high to low"],["amp-desc","Current, high to low"]];if(state.auth){opts.push(["speed","Availability, fastest first"],["price","Price, low to high"])}so.innerHTML=opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join("");so.value=opts.some(o=>o[0]===cur)?cur:"load-asc"}
function moqNum(d){const m=String(d.moq).match(/([\d,]+)\s*(pcs|unit)/i);return m?parseInt(m[1].replace(/,/g,"")):(d.q||1)}
function calcStatus(q,base,fixed,floor,isEU){const unit=base+(fixed>0?fixed/q:0),total=q*unit,burden=fixed>0?fixed/total:0;let key;if(isEU)key=total<floor?"minval":"allowed";else key=total<floor?"consol":burden>.15?"blocked":burden>.10?"approval":"allowed";return{unit,total,burden,key}}
function orderBlock(p,r){const d=p.rt[r],moq=moqNum(d),isEU=r==="EU",unitMOQ=isEU?euLinePrice(p):d.pr,fixed=isEU?0:FIXED,base=unitMOQ-(fixed?fixed/moq:0),floor=FLOOR[r],c=calcStatus(moq,base,fixed,floor,isEU),S=STAT[c.key],dis=(c.key==="blocked"||c.key==="minval")?"disabled":"";const bt=fixed?` &middot; burden ${(c.burden*100).toFixed(0)}%`:"";return `<div class="orderblock"><div class="qctl"><div class="qlbl">Quantity <span class="qnow">${moq} pcs</span></div><input type="range" class="qslider" min="1" max="${moq}" value="${moq}" step="1" data-base="${base}" data-fixed="${fixed}" data-floor="${floor}" data-eu="${isEU?1:0}"></div><div class="oread">${moq} pcs &middot; ${eur(c.unit)}/pc &middot; total ${eur(c.total)}${bt} &middot; <b class="s-${S.mark}">${S.lab}</b></div><button class="obtn ${S.cls}" ${dis}>${S.btn.replace("{floor}",eur(floor))}</button></div>`}
function routePanel(p,r){const d=p.rt[r],def=RDEF[r],empty=!hasStock(p,r)&&r!=="MTO",lineP=r==="EU"?euLinePrice(p):d.pr,qty=r==="MTO"?"Made to order":(d.q>0?`<b>${d.q} pcs</b> available`:"No stock");let detail="";if(r==="EU"&&d.locs){detail+=`<div class="rdgrid">${d.locs.map(l=>`<div class="rd"><div class="k">${l.w}</div><div class="v">${l.q} pcs, ${eur(whPrice(d.pr,l.w))}</div></div>`).join("")}</div>`}else if(r==="Floating"){const free=Math.max(0,(d.q||0)-(d.r||0));detail+=`<div class="qbreak"><div class="qcell"><div class="k">Available</div><div class="v">${d.q} pcs</div></div><div class="qcell r"><div class="k">Reserved</div><div class="v">${d.r} pcs</div></div><div class="qcell f"><div class="k">Free to order</div><div class="v">${free} pcs</div></div></div><div class="rd"><div class="k">Named shipment</div><div class="v">${d.sh||"pending"}${d.date?", ETA "+d.date:""}</div></div>`}else{detail+=`<div class="rdgrid"><div class="rd"><div class="k">Where</div><div class="v">${d.w}</div></div>${r!=="MTO"?`<div class="rd"><div class="k">Available</div><div class="v">${d.q} pcs</div></div>`:""}<div class="rd"><div class="k">Minimum order</div><div class="v">${d.moq}</div></div></div>`}return `<details class="route ${empty?"empty":""}"><summary><span class="mark ${def.mark}"></span><span class="rname">${def.label}</span><span class="reta">${d.eta}</span><span class="rmoq">MOQ ${d.moqs}</span><span class="rqty">${qty}</span><span class="rprice">${eur(lineP)}</span><span class="caret"></span></summary><div class="rdetail">${detail}<div class="pay">Payment terms: <b>${PAY[r]}</b></div><div class="rlogic">${LOGIC[r]}</div>${orderBlock(p,r)}</div></details>`}
function genDesc(p){return `The OZZY ${p.series} is a ${p.family.toLowerCase()} for ${p.app.join(" / ").toLowerCase()} use. It is rated ${p.amp} A, ${p.volt}, maximum load ${p.maxW} W. Installation requirement: ${p.install.toLowerCase()}. ${p.installNote}`}
const PEND=`<span class="pend">datasheet pending</span>`;
function specTable(p){const rows=[["Brand","OZZY"],["Series",p.series],["Category",p.cat],["Installation",p.install],["Socket / connection",p.socket],["Phase",p.phase],["Current rating",p.amp+" A"],["Voltage",p.volt],["Maximum load",p.maxW+" W"],["Continuous load",p.contW?p.contW+" W":PEND],["Use environment",p.use],["IP rating",p.ip],["Connectivity",p.conn],["App",p.emon],["USB",p.usb],["Cable length",p.cable],["Dimensions",PEND],["Net weight",PEND],["Certifications",PEND],["Warranty term",PEND]];return `<div class="spectable">${rows.map(r=>`<div class="specr"><span class="sk">${r[0]}</span><span class="sv">${r[1]}</span></div>`).join("")}</div>`}
const DOWNLOADS=["Datasheet","Installation guide","Safety sheet","Commissioning checklist"];
function productInfo(p){return `<details class="pinfo-acc"><summary>Product information<span class="caret"></span></summary><div class="pi-inner"><div class="pitabs"><button class="pitab active" data-pt="desc">Description</button><button class="pitab" data-pt="spec">Specifications</button><button class="pitab" data-pt="dl">Downloads</button></div><div class="pipanel" data-pt="desc"><p class="desc">${genDesc(p)}</p></div><div class="pipanel hide" data-pt="spec">${specTable(p)}</div><div class="pipanel hide" data-pt="dl"><div class="dllist">${DOWNLOADS.map(d=>`<a class="dlx" href="#download">${d} &middot; OZZY ${p.series}<span>></span></a>`).join("")}</div></div></div></details>`}
function gallery(p){const cls=p.thumb==="strip"?"strip":p.thumb==="switch"?"switch":p.thumb==="outdoor"?"outdoor":"";return `<div class="gallery"><div class="gview" data-active="main"><div class="ph ${cls}">OZZY<br>${p.series}</div></div><div class="gtabs">${["Main","360","App","Install"].map((v,i)=>`<button class="gtab ${i===0?"active":""}" data-view="${v.toLowerCase()}">${v}</button>`).join("")}</div></div>`}
function renderCards(){let list=PRODUCTS.filter(passAll);const s=document.getElementById("sort").value;list.sort((x,y)=>s==="load-desc"?y.maxW-x.maxW:s==="amp-desc"?y.amp-x.amp:s==="speed"?bestRoute(x)-bestRoute(y)||x.maxW-y.maxW:s==="price"?minPrice(x)-minPrice(y):x.maxW-y.maxW);document.getElementById("rcount").textContent=list.length;const root=document.getElementById("cards");if(!list.length){root.innerHTML=`<div class="empty-res"><b>No OZZY products match.</b> Loosen a filter.</div>`;return}root.innerHTML=list.map(p=>{const commercial=state.auth?`<div class="pricenote">Prices, stock and MOQ are provisional demo data</div><div class="routes">${ORDER.map(r=>routePanel(p,r)).join("")}</div>`:`<button class="gatebar">Log in to see availability and price</button>`;const pro=p.install==="Qualified electrician required";return `<article class="card">${gallery(p)}<div class="c-body"><div class="c-head"><h3>OZZY ${p.series}<span class="artcode">${p.art}</span></h3><div class="dls"><a class="dl" href="#datasheet">Datasheet</a><a class="dl" href="#catalogue">Catalogue</a></div></div><div class="c-sub">${p.cat} &middot; ${p.topology}<span class="installtag ${pro?"pro":""}">${p.install}</span></div><div class="specrow"><div class="spec"><div class="k">Current</div><div class="v">${p.amp} A</div></div><div class="spec"><div class="k">Max load</div><div class="v">${p.maxW} W</div></div><div class="spec"><div class="k">Phase</div><div class="v">${p.phase}</div></div><div class="spec"><div class="k">Connection</div><div class="v">${p.socket}</div></div><div class="spec"><div class="k">Install</div><div class="v">${pro?"Electrician":"Consumer"}</div></div></div><div class="eprline">Environmental contribution and WEEE/EPR handling depend on delivery country and seller setup, shown at checkout.</div>${commercial}${productInfo(p)}</div></article>`}).join("")}
function renderFoot(){document.getElementById("foot").innerHTML=`<b>OZZY filter logic:</b> Product type, installation requirement, socket/connection, phase, current rating, maximum load, use environment, application and USB. After login: EU warehouse location and availability route.<br><b>Key decision:</b> plug-in products are marked Consumer installable; hardwired FLIP inline switches are marked Qualified electrician required.<br><span class="am">Provisional: warehouse locations, price, stock, reserved quantity, MOQ, route dates and carton assumptions.</span>`}
function refresh(){buildFilters();renderChips();renderCards()}
document.getElementById("filters").addEventListener("input",e=>{const t=e.target;if(t.classList.contains("srange")||t.classList.contains("snum")){const key=t.dataset.key,st=state.sliders[key],s=SLIDERS.find(x=>x.key===key);let v=parseFloat(t.value);if(isNaN(v))return;v=Math.max(s.dmin,Math.min(s.dmax,v));if(t.dataset.role==="min")st.min=Math.min(v,st.max);else st.max=Math.max(v,st.min);buildFilters();renderChips();renderCards()}});
document.getElementById("filters").addEventListener("change",e=>{const t=e.target;if(t.type==="checkbox"){const el=t.closest(".opt"),k=el.dataset.key,v=el.dataset.val;t.checked?state.checks[k].add(v):state.checks[k].delete(v);refresh()}});
document.getElementById("clearAll").onclick=()=>{SLIDERS.forEach(s=>state.sliders[s.key]={min:s.dmin,max:s.dmax});CHECKS.forEach(c=>state.checks[c.key].clear());refresh()};
document.getElementById("sort").onchange=renderCards;
document.getElementById("btnAnon").onclick=()=>{state.auth=false;setAuth()};
document.getElementById("btnAuth").onclick=()=>{state.auth=true;setAuth()};
function setAuth(){document.getElementById("btnAnon").classList.toggle("active",!state.auth);document.getElementById("btnAuth").classList.toggle("active",state.auth);if(!state.auth)state.checks.av.clear();renderSort();refresh()}
document.getElementById("cards").addEventListener("input",e=>{const s=e.target;if(!s.classList.contains("qslider"))return;const q=+s.value,c=calcStatus(q,+s.dataset.base,+s.dataset.fixed,+s.dataset.floor,s.dataset.eu==="1"),S=STAT[c.key],w=s.closest(".orderblock"),bt=+s.dataset.fixed?" &middot; burden "+(c.burden*100).toFixed(0)+"%":"";w.querySelector(".qnow").textContent=q+" pcs";w.querySelector(".oread").innerHTML=`${q} pcs &middot; ${eur(c.unit)}/pc &middot; total ${eur(c.total)}${bt} &middot; <b class="s-${S.mark}">${S.lab}</b>`;const b=w.querySelector(".obtn");b.className="obtn "+S.cls;b.textContent=S.btn.replace("{floor}",eur(+s.dataset.floor));b.disabled=(c.key==="blocked"||c.key==="minval")});
document.getElementById("cards").addEventListener("click",e=>{const pt=e.target.closest&&e.target.closest(".pitab");if(pt){const w=pt.closest(".pi-inner"),to=pt.dataset.pt;w.querySelectorAll(".pitab").forEach(b=>b.classList.toggle("active",b===pt));w.querySelectorAll(".pipanel").forEach(pl=>pl.classList.toggle("hide",pl.dataset.pt!==to));return}const tab=e.target.closest&&e.target.closest(".gtab");if(tab){const g=tab.closest(".gallery");g.querySelectorAll(".gtab").forEach(b=>b.classList.toggle("active",b===tab));g.querySelector(".ph").innerHTML="OZZY<br>"+tab.textContent}});
renderSort();buildFilters();renderChips();renderCards();renderFoot();

/* ROLLOUT_DECOR v2 positional */
(function(){
var KEYS=["EU","Floating","Factory","MTO"];
var HOLD={EU:"Reservation hold, payment within 24 h or the hold lapses.",Floating:"Reservation hold, payment within 12 h or the hold lapses.",Factory:"Reservation hold, payment within 48 h or the hold lapses."};
function cetNow(){var t=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Amsterdam",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date());var a=t.split(":");return(+a[0])*60+(+a[1]);}
function cutoffHTML(){var n=cetNow(),c=14*60;if(n<c){var r=c-n;var soon=r<60?" soon":"";return '<span class="ck-k">Order before 14:00 CET</span><span class="ck-t'+soon+'">'+Math.floor(r/60)+' h '+String(r%60).padStart(2,"0")+' min left</span><span class="ck-s ok">Ships today</span>';}return '<span class="ck-k">Cutoff 14:00 CET passed</span><span class="ck-s warn">Ships next business day</span>';}
function routeKey(d){var p=d.parentElement;if(!p)return"MTO";var all=Array.prototype.filter.call(p.children,function(x){return x.matches&&x.matches("details.route");});return KEYS[all.indexOf(d)]||"MTO";}
function pcs(t){var m=(t||"").match(/(\d[\d\s.,]*)\s*pcs/);return m?parseInt(m[1].replace(/[^\d]/g,""),10):null;}
function euPairs(d){var out=[];d.querySelectorAll(".rdgrid .rd").forEach(function(r){var k=r.querySelector(".k"),v=r.querySelector(".v");var q=pcs(v&&v.textContent);if(k&&q!=null)out.push([k.textContent.trim(),q]);});if(out.length)return out;d.querySelectorAll(".whprice .whrow .wn").forEach(function(w){var q=pcs(w.textContent);var name=w.textContent.split("\u00b7")[0].trim();if(q!=null)out.push([name,q]);});return out;}
function flNums(d){var a=null,r=null,f=null;d.querySelectorAll(".qbreak .qcell").forEach(function(c){var k=(c.querySelector(".k")||{}).textContent||"";var q=pcs((c.querySelector(".v")||{}).textContent);if(/available/i.test(k))a=q;else if(/reserved/i.test(k))r=q;else if(/free/i.test(k))f=q;});return[a,r,f];}
function bar(segs,legend){var tot=segs.reduce(function(s,x){return s+x[1];},0)||1;var b='<div class="stockbar">'+segs.map(function(x){return '<span class="'+x[0]+'" style="width:'+(x[1]/tot*100).toFixed(1)+'%"></span>';}).join("")+'</div>';return b+'<div class="sblegend">'+legend+'</div>';}
function decorate(){
 document.querySelectorAll("details.route").forEach(function(d){
  var key=routeKey(d);
  if(!d.dataset.dec){
   if(!d.querySelector(".stockbar")){
    if(key==="EU"){var pr=euPairs(d);if(pr.length){var segs=pr.map(function(p,i){return["sb-w"+(i%3),p[1]];});var leg=pr.map(function(p,i){return '<span class="lg lg'+(i%3)+'"></span>'+p[0]+' '+p[1];}).join(" &nbsp; ")+" pcs";var host=d.querySelector(".rdgrid,.whprice");if(host)host.insertAdjacentHTML("afterend",bar(segs,leg));}}
    if(key==="Floating"){var n=flNums(d);if(n[0]&&n[1]!=null&&n[2]!=null){var host2=d.querySelector(".qbreak");if(host2)host2.insertAdjacentHTML("afterend",bar([["sb-res",n[1]],["sb-free",n[2]]],'<span class="lg lgr"></span>Reserved '+n[1]+' &nbsp; <span class="lg lgf"></span>Free to order '+n[2]+' pcs'));}}
   }
   if(key==="EU"&&!d.querySelector(".cutoffline")&&euPairs(d).length)d.insertAdjacentHTML("beforeend",'<div class="cutoffline">'+cutoffHTML()+'</div>');
   if(HOLD[key]&&!d.querySelector(".holdline"))d.insertAdjacentHTML("beforeend",'<div class="holdline">'+HOLD[key]+'</div>');
   d.dataset.dec="1";
  }
  if(key==="EU"&&!d.dataset.op){d.open=true;d.dataset.op="1";}
 });
}
var host=document.getElementById("cards")||document.body;
new MutationObserver(decorate).observe(host,{childList:true,subtree:true});
decorate();
setInterval(function(){document.querySelectorAll(".cutoffline").forEach(function(e){e.innerHTML=cutoffHTML();});decorate();},30000);
})();

  }
}
</script>
