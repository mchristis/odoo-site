  heading="Parking that produces its own charging energy."
  intro="Vehicle and bicycle structures that combine shelter, PV generation and EV charging, from a single private carport to modular rows for commercial car parks."
  body="A car park is one of the largest unused surfaces on most sites. A carport turns that surface into generation directly above the place where vehicles charge. PARX carports are designed as structures, not as racks: drainage is collected and discharged through the columns, cables run inside the profiles, and electrical positions for inverters and chargers are planned from the start. Residential and commercial systems share the same method at different scales."

  products-heading="Five parking structures."

  guidance-heading="Car or bicycle, rational or architectural?"

  engineering="{{ engineering }}"
