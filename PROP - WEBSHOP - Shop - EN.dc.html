class Component extends DCLogic {
  componentDidMount(){
    if(this._booted) return; this._booted = true;

const BRAND="PROP";
const RAW=[["Small Wind Turbines", "HVT TULIP", "Vertical-Axis Wind Turbine (Ornamental – Tulip)", "Goods", "—", "—", "(TBD – code structure not yet defined)", "Pending code structure", "PROP HVT TULIP — Ornamental Vertical-Axis Wind Turbine"], ["Small Wind Turbines", "HVT ROSE", "Vertical-Axis Wind Turbine (Ornamental – Rose)", "Goods", "—", "—", "(TBD – code structure not yet defined)", "Pending code structure", "PROP HVT ROSE — Ornamental Vertical-Axis Wind Turbine"], ["Small Wind Turbines", "IRIS", "Vertical-Axis Wind Turbine (Darrieus)", "Goods", "—", "—", "(TBD – code structure not yet defined)", "Pending code structure", "PROP IRIS — Darrieus Vertical-Axis Wind Turbine"], ["Small Wind Turbines", "REED/GIROMILL", "Vertical-Axis Wind Turbine (H-Rotor / Giromill)", "Goods", "—", "—", "(TBD – code structure not yet defined)", "Pending code structure; slash to be resolved when coded", "PROP REED/GIROMILL — H-Rotor / Giromill Vertical-Axis Wind Turbine"], ["Small Wind Turbines", "CALLA", "Vertical-Axis Wind Turbine (Savonius)", "Goods", "—", "—", "(TBD – code structure not yet defined)", "Pending code structure", "PROP CALLA — Savonius Vertical-Axis Wind Turbine"]];
function clean(s){return String(s||"").replace(/–/g,"-").replace(/×/g,"x").trim()}
function num(re,s){const m=clean(s).match(re);return m?+String(m[1]).replace(",","."):0}
function productStage(art,note){return /TBD|code structure not yet defined|Pending code/i.test(art+" "+note)?"Taxonomy / config stage":"Orderable demo SKU"}
function propType(series,cat){if(/TULIP|ROSE/i.test(series))return"Ornamental VAWT";if(/IRIS/i.test(series))return"Darrieus VAWT";if(/REED|GIROMILL/i.test(series))return"H-rotor / Giromill VAWT";if(/CALLA/i.test(series))return"Savonius VAWT";return cat}
function propUse(series){if(/TULIP|ROSE/i.test(series))return"Landscape / decorative energy";if(/CALLA/i.test(series))return"Low-speed urban wind";return"Small wind generation"}
function chillUse(cat){if(/Bench|Table|Lounge/i.test(cat))return"Seating / public realm";if(/Totem/i.test(cat))return"Charging / wayfinding";if(/Modular/i.test(cat))return"Configurable city furniture";return"Public-space furniture"}
function wurkSystem(series){if(["CRIMP","PREP"].includes(series))return"Cable prep / MC4 tools";if(series==="GAUGE")return"Measuring / layout tools";if(series==="PROBE")return"Electrical test instruments";if(["HOLD","RAIL","RISE"].includes(series))return"Work-at-height safety";if(series==="HAUL")return"Battery handling equipment";return"Installation equipment"}
function wurkType(cat){if(/Tool Kit|Installer Case/i.test(cat))return"MC4 tool kit";if(/Cutter|Stripper|Torque/i.test(cat))return"Cable preparation tool";if(/Tape|Laser|Level/i.test(cat))return"Measurement tool";if(/Multimeter|Clamp|Insulation|Phase|Socket/i.test(cat))return"Electrical test instrument";if(/Harness|Lifeline|Anchor|Edge Protection/i.test(cat))return"Safety / fall protection";if(/Scaffold/i.test(cat))return"Access tower";if(/Trolley/i.test(cat))return"Battery lifting trolley";return cat}
function level(v,note){const s=clean(v+" "+note);if(/Basic/i.test(s)&&!/Pro/i.test(s))return"Basic";if(/Premium/i.test(s))return"Premium";if(/Pro\s*\/\s*Site|Pro and Site/i.test(s))return"Pro / Site";if(/Site/i.test(s))return"Site";if(/Pro/i.test(s))return"Pro";if(/All levels/i.test(s))return"All levels";return"Project / configurable"}
function format(v,note){const s=clean(v+" "+note);if(/Complete set only/i.test(s))return"Complete set only";if(/Set \/ system|Kit \+|Kit$/i.test(s))return"Kit / set";if(/Individual/i.test(s))return"Individual item";return"Configuration item"}
function compliance(note){if(/LIFE-SAFETY|fall protection|EN 13374|EN 361|EN 1004/i.test(note))return"Life-safety / certified equipment";if(/IEC 61010|CAT III|CAT IV|calibration/i.test(note))return"Electrical test / calibration";if(/CE|RoHS|REACH/i.test(note))return"CE / compliance pack";return"Compliance TBD"}
function capacity(cat,desc,note){const s=clean(cat+" "+desc+" "+note);let m=s.match(/(\d+)\s*m\b/i);if(/Scaffold|Tower/i.test(s)&&m)return `${m[1]} m platform`;m=s.match(/(\d+)\s*kg/i);if(/Trolley|load|Battery/i.test(s)&&m)return `${m[1]} kg max load`;m=s.match(/(\d+)\s*m\s*\/|Range\s*(\d+)\//i);if(m)return `${m[1]||m[2]} m range`;return"n.a."}
function classify(r,i){const p={i,domain:r[0],series:r[1],category:r[2],goods:r[3],levelRaw:r[4],formatRaw:r[5],art:r[6],note:r[7],desc:r[8]};p.stage=productStage(p.art,p.note);if(BRAND==="PROP"){p.system="Small wind turbine";p.type=propType(p.series,p.category);p.use=propUse(p.series);p.level="Project / configurable";p.format="Concept / configuration";p.compliance="Certification TBD";p.capacity="n.a."}else if(BRAND==="CHILL"){p.system="Solar street furniture";p.type=p.category;p.use=chillUse(p.category);p.level="Project / configurable";p.format="Concept / configuration";p.compliance="Public-space certification TBD";p.capacity="n.a."}else{p.system=wurkSystem(p.series);p.type=wurkType(p.category);p.use=p.category;p.level=level(p.levelRaw,p.note);p.format=format(p.formatRaw,p.note);p.compliance=compliance(p.note);p.capacity=capacity(p.category,p.desc,p.note)}p.install=installRoute(p);p.rt=mkRoutes(p);return p}
function installRoute(p){if(BRAND==="PROP")return"Site wind, mast/foundation and permitting confirmation required";if(BRAND==="CHILL")return"Public-space foundation, vandalism and service-access confirmation required";if(/Life-safety|Scaffold|Safety|fall protection/i.test(p.compliance+" "+p.type))return"No sale without certification pack and competent-user confirmation";if(/Electrical test/i.test(p.compliance))return"Calibration/certification option before dispatch";return"Installer confirmation required"}
function basePrice(p){let v=BRAND==="WURK"?80:650;if(BRAND==="PROP")v=2400+p.i*450;if(BRAND==="CHILL")v=1800+p.i*360;if(BRAND==="WURK"){if(p.system.includes("Cable"))v=120+p.i*12;if(p.system.includes("Measuring"))v=90+p.i*22;if(p.system.includes("Electrical"))v=220+p.i*30;if(p.system.includes("Work-at-height"))v=680+p.i*110;if(p.system.includes("Battery"))v=850+p.i*120;if(p.type.includes("Access tower"))v=1200+p.i*170}if(p.stage.includes("Taxonomy"))v=Math.max(650,Math.round(v*.45));return Math.round(v/10)*10}
function warrantyOptions(p){const base=basePrice(p),standard=BRAND==="WURK"&&/Life-safety/i.test(p.compliance)?"12 months, inspection rules apply":"24 months standard";return [{label:"Standard warranty",price:0,note:standard},{label:"+2 years paid extension",price:Math.round(base*.08/10)*10,note:"Paid option, registered at order"},{label:"+5 years paid extension",price:Math.round(base*.16/10)*10,note:"Paid option, annual check may apply"}]}
function mkRoutes(p){const base=basePrice(p),project=BRAND!=="WURK"||p.stage.includes("Taxonomy"),moq=project?1:(p.system.includes("Cable")||p.system.includes("Measuring")?5:1),euq=project?2:(p.system.includes("Cable")||p.system.includes("Measuring")?35:8);return{EU:{q:euq,r:0,eta:"1 to 2 working days",w:"EU warehouse",moq:`${moq} pc${moq>1?"s":""}`,moqs:`${moq} pc${moq>1?"s":""}`,pr:base,locs:[{w:"Rotterdam NL",q:Math.ceil(euq*.45)},{w:"Hamburg DE",q:Math.ceil(euq*.30)},{w:"Poznan PL",q:Math.max(1,Math.floor(euq*.25))}]},Floating:{q:Math.max(moq*2,Math.round(euq*.6)),r:moq,eta:"under 6 weeks",w:"In transit",moq:`${moq} pc${moq>1?"s":""}`,moqs:`${moq} pc${moq>1?"s":""}`,pr:Math.round(base*.97),sh:BRAND+" 2026 "+String((p.i%8)+1).padStart(2,"0"),date:"08 Sep 2026"},Factory:{q:project?6:24,r:moq*2,eta:"under 8 weeks",w:"Factory stock",moq:`${project?1:10} pcs`,moqs:`${project?1:10} pcs`,pr:Math.round(base*.94)},MTO:{q:null,r:0,eta:"under 10 weeks",w:"Made to order",moq:`${project?1:20} pcs`,moqs:`${project?1:20} pcs`,pr:Math.round(base*.91)}}}
const PRODUCTS=RAW.map(classify);
const RDEF={EU:{label:"EU stock",order:0,mark:"ok"},Floating:{label:"Floating stock",order:1,mark:"info"},Factory:{label:"Factory stock",order:2,mark:"warn"},MTO:{label:"Manufacturing order",order:3,mark:"idle"}},ORDER=["EU","Floating","Factory","MTO"];
const PAY={EU:"100%",Floating:"100%",Factory:"30 / 70 %",MTO:"30 / 70 %"},LOGIC={EU:"Ships from EU warehouse. 30 minute payment reservation; first completed payment wins.",Floating:"In transit under a named shipment. Reserved by others reduces free-to-order count.",Factory:"Ex-factory warehouse. Useful for installer and project stock.",MTO:"Made to order. Deposit confirms production slot; balance before dispatch."};
const FLOOR={EU:BRAND==="WURK"?250:750,Floating:BRAND==="WURK"?900:2000,Factory:BRAND==="WURK"?1800:4500,MTO:BRAND==="WURK"?2800:7000},FIXED=BRAND==="WURK"?120:280,STAT={allowed:{lab:"Allowed",btn:"Order now",cls:"go",mark:"ok"},minval:{lab:"Minimum order value required",btn:"Minimum order value {floor}",cls:"minval",mark:"warn"},consol:{lab:"Eligible for consolidation",btn:"Add to consolidation",cls:"consol",mark:"info"},approval:{lab:"Management approval required",btn:"Request approval",cls:"approval",mark:"warn"},blocked:{lab:"Blocked, order too small",btn:"Blocked",cls:"block",mark:"err"}};
const eur=n=>"EUR "+Math.round(n).toLocaleString("en-GB"),hasStock=(p,r)=>r==="MTO"?true:p.rt[r].q>0,WCO={"Rotterdam NL":0,"Hamburg DE":.03,"Poznan PL":.06},whPrice=(base,w)=>Math.round(base*(1+(WCO[w]||0))),euLinePrice=p=>Math.min(...p.rt.EU.locs.map(x=>whPrice(p.rt.EU.pr,x.w))),minPrice=p=>Math.min(...ORDER.map(r=>r==="EU"?euLinePrice(p):p.rt[r].pr)),bestRoute=p=>{for(const r of ORDER)if(hasStock(p,r))return RDEF[r].order;return 3};
const COMMON=[{key:"system",label:BRAND==="WURK"?"Equipment system":"Product system",kick:"Technical",get:p=>[p.system]},{key:"type",label:BRAND==="WURK"?"Tool / equipment type":"Product type",kick:"Technical",get:p=>[p.type]},{key:"level",label:BRAND==="WURK"?"Installer level":"Project level",kick:"Technical",get:p=>[p.level]},{key:"format",label:"Supply format",kick:"Technical",get:p=>[p.format]},{key:"compliance",label:"Compliance / release status",kick:"Technical",get:p=>[p.compliance]},{key:"capacity",label:"Capacity / size",kick:"Technical",get:p=>p.capacity==="n.a."?[]:[p.capacity]},{key:"stage",label:"Product stage",kick:"Technical",get:p=>[p.stage],order:["Orderable demo SKU","Taxonomy / config stage"]},{key:"av",label:"Availability",kick:"Commercial",get:p=>ORDER.filter(r=>hasStock(p,r)).map(r=>RDEF[r].label),order:ORDER.map(r=>RDEF[r].label),mark:true,authOnly:true}];
const CHECKS=COMMON.filter(c=>{const vals=new Set(PRODUCTS.flatMap(p=>c.get(p)).filter(Boolean));return c.authOnly||vals.size>1});
const MARKBY={};ORDER.forEach(r=>MARKBY[RDEF[r].label]=RDEF[r].mark);
const state={checks:{},auth:false};CHECKS.forEach(c=>state.checks[c.key]=new Set());
function matchChecks(p,except){for(const c of CHECKS){if(c.key===except)continue;const set=state.checks[c.key];if(!set.size)continue;if(!c.get(p).some(v=>set.has(v)))return false}return true}const passAll=p=>matchChecks(p,"__none__");
function countFor(key,val){const c=CHECKS.find(x=>x.key===key);return PRODUCTS.filter(p=>matchChecks(p,key)&&c.get(p).includes(val)).length}
function shell(label,kick){return `<div class="sec"><button><span class="lbl">${label}<span class="kick">${kick}</span></span><span class="pm"></span></button><div class="body">`}
function optHTML(key,v,n,mk=""){return `<label class="opt" data-key="${key}" data-val="${v}" ${n===0?'style="display:none"':''}><input type="checkbox" ${state.checks[key].has(v)?"checked":""} style="accent-color:var(--color-brand-prop, #4F4F4E);width:20px;height:20px;"><span class="box"></span><span class="nm">${mk}${v}</span><span class="cnt">${n}</span></label>`}
function checkHTML(c){let vals=[...new Set(PRODUCTS.flatMap(p=>c.get(p)))].filter(Boolean);if(c.order)vals.sort((a,b)=>c.order.indexOf(a)-c.order.indexOf(b));else vals.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));let html=shell(c.label,c.kick);vals.forEach(v=>{const n=countFor(c.key,v),mk=c.mark?`<span class="mark ${MARKBY[v]}"></span>`:"";html+=optHTML(c.key,v,n,mk)});return html+"</div></div>"}
function buildFilters(){const root=document.getElementById("filters");root.innerHTML=CHECKS.filter(c=>!c.authOnly||state.auth).map(checkHTML).join("");root.querySelectorAll(".sec>button").forEach(b=>b.onclick=()=>b.parentElement.classList.toggle("collapsed"))}
function renderChips(){let html="";CHECKS.forEach(c=>state.checks[c.key].forEach(v=>html+=`<span class="chip" data-key="${c.key}" data-val="${v}"><b>${c.label}</b> ${v}<button>x</button></span>`));const box=document.getElementById("chips");box.innerHTML=html;box.querySelectorAll("button").forEach(btn=>btn.onclick=()=>{const ch=btn.closest(".chip");state.checks[ch.dataset.key].delete(ch.dataset.val);refresh()});document.getElementById("clearAll").disabled=!html}
function renderSort(){const so=document.getElementById("sort"),cur=so.value;let opts=[["system","System"],["type","Product type"],["stage","Stage"]];if(state.auth)opts.push(["speed","Availability, fastest first"],["price","Price, low to high"]);so.innerHTML=opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join("");so.value=opts.some(o=>o[0]===cur)?cur:"system"}
function moqNum(d){const m=String(d.moq).match(/(\d+)/);return m?+m[1]:1}function calcStatus(q,base,fixed,floor,isEU){const unit=base+(fixed?fixed/q:0),total=q*unit,burden=fixed?fixed/total:0;let key;if(isEU)key=total<floor?"minval":"allowed";else key=total<floor?"consol":burden>.15?"blocked":burden>.10?"approval":"allowed";return{unit,total,burden,key}}
function orderBlock(p,r){const d=p.rt[r],moq=moqNum(d),isEU=r==="EU",unitMOQ=isEU?euLinePrice(p):d.pr,fixed=isEU?0:FIXED,base=unitMOQ-(fixed?fixed/moq:0),floor=FLOOR[r],c=calcStatus(moq,base,fixed,floor,isEU),S=STAT[c.key],dis=(c.key==="blocked"||c.key==="minval")?"disabled":"",bt=fixed?` &middot; burden ${(c.burden*100).toFixed(0)}%`:"";return `<div class="orderblock"><div class="qctl"><div class="qlbl">Quantity <span class="qnow">${moq} pcs</span></div><input type="range" class="qslider" min="1" max="${moq}" value="${moq}" step="1" data-base="${base}" data-fixed="${fixed}" data-floor="${floor}" data-eu="${isEU?1:0}"></div><div class="oread">${moq} pcs &middot; ${eur(c.unit)}/pc &middot; total ${eur(c.total)}${bt} &middot; <b class="s-${S.mark}">${S.lab}</b></div><button class="obtn ${S.cls}" ${dis}>${S.btn.replace("{floor}",eur(floor))}</button></div>`}
function warrantyBox(p){const opts=warrantyOptions(p);return `<div class="warrantybox"><div class="wtitle">Paid warranty extension</div><div class="wopts">${opts.map(o=>`<div class="wopt"><b>${o.label}</b><span>${o.price?eur(o.price):"Included"} · ${o.note}</span></div>`).join("")}</div></div>`}
function routePanel(p,r){const d=p.rt[r],def=RDEF[r],empty=!hasStock(p,r)&&r!=="MTO",lineP=r==="EU"?euLinePrice(p):d.pr,qty=r==="MTO"?"Made to order":(d.q>0?`<b>${d.q} pcs</b> available`:"No stock");let detail="";if(r==="EU"){detail=`<div class="rdgrid">${d.locs.map(l=>`<div class="rd"><div class="k">${l.w}</div><div class="v">${l.q} pcs, ${eur(whPrice(d.pr,l.w))}</div></div>`).join("")}</div>`}else if(r==="Floating"){const free=Math.max(0,(d.q||0)-(d.r||0));detail=`<div class="qbreak"><div class="qcell"><div class="k">Available</div><div class="v">${d.q} pcs</div></div><div class="qcell r"><div class="k">Reserved</div><div class="v">${d.r} pcs</div></div><div class="qcell f"><div class="k">Free to order</div><div class="v">${free} pcs</div></div></div><div class="rd"><div class="k">Named shipment</div><div class="v">${d.sh}, ETA ${d.date}</div></div>`}else{detail=`<div class="rdgrid"><div class="rd"><div class="k">Where</div><div class="v">${d.w}</div></div>${r!=="MTO"?`<div class="rd"><div class="k">Available</div><div class="v">${d.q} pcs</div></div>`:""}<div class="rd"><div class="k">Minimum order</div><div class="v">${d.moq}</div></div></div>`}return `<details class="route ${empty?"empty":""}"><summary><span class="mark ${def.mark}"></span><span class="rname">${def.label}</span><span class="reta">${d.eta}</span><span class="rmoq">MOQ ${d.moqs}</span><span class="rqty">${qty}</span><span class="rprice">${eur(lineP)}</span><span class="caret"></span></summary><div class="rdetail">${detail}<div class="pay">Payment terms: <b>${PAY[r]}</b></div><div class="rlogic">${LOGIC[r]}</div>${orderBlock(p,r)}</div></details>`}

function specTable(p){const rows=[["Brand",BRAND],["System",p.system],["Series",p.series],["Product type",p.type],["Use / category",p.use],["Level",p.level],["Supply format",p.format],["Compliance / release",p.compliance],["Capacity / size",p.capacity],["Product stage",p.stage],["Warranty extension","Paid add-on available"],["Installation route",p.install],["Certification pack",PEND]];return `<div class="spectable">${rows.map(r=>`<div class="specr"><span class="sk">${r[0]}</span><span class="sv">${r[1]}</span></div>`).join("")}</div>`}
function productInfo(p){const d=["Datasheet","Certification pack","Installation / use guide","Warranty extension terms"];return `<details class="pinfo-acc"><summary>Product information<span class="caret"></span></summary><div class="pi-inner"><div class="pitabs"><button class="pitab active" data-pt="desc">Description</button><button class="pitab" data-pt="spec">Specifications</button><button class="pitab" data-pt="dl">Downloads</button></div><div class="pipanel" data-pt="desc"><p class="desc">${p.desc||p.category}. Commercial note: paid warranty extension can be added at order release.</p></div><div class="pipanel hide" data-pt="spec">${specTable(p)}</div><div class="pipanel hide" data-pt="dl"><div class="dllist">${d.map(x=>`<a class="dlx" href="#download">${x} &middot; ${BRAND} ${p.series}<span>></span></a>`).join("")}</div></div></div></details>`}

function renderCards(){let list=PRODUCTS.filter(passAll),s=document.getElementById("sort").value;list.sort((a,b)=>s==="type"?a.type.localeCompare(b.type):s==="stage"?a.stage.localeCompare(b.stage):s==="speed"?bestRoute(a)-bestRoute(b)||a.system.localeCompare(b.system):s==="price"?minPrice(a)-minPrice(b):a.system.localeCompare(b.system)||a.series.localeCompare(b.series));document.getElementById("rcount").textContent=list.length;const root=document.getElementById("cards");if(!list.length){root.innerHTML=`<div class="empty-res"><b>No ${BRAND} products match.</b> Loosen a filter.</div>`;return}root.innerHTML=list.map(p=>{const commercial=state.auth?`<div class="pricenote">Prices, stock, warranty extension, warehouse split and MOQ are provisional demo data</div>${warrantyBox(p)}<div class="routes">${ORDER.map(r=>routePanel(p,r)).join("")}</div>`:`<button class="gatebar">Log in to see availability, price and paid warranty extension</button>`;return `<article class="card">${gallery(p)}<div class="c-body"><div class="c-head"><h3>${BRAND} ${p.series}<span class="artcode">${p.art}</span></h3><div class="dls"><a class="dl" href="#datasheet">Datasheet</a><a class="dl" href="#catalogue">Catalogue</a></div></div><div class="c-sub">${p.type} &middot; ${p.level}<span class="installtag">${p.install}</span></div><div class="specrow"><div class="spec"><div class="k">System</div><div class="v">${p.system}</div></div><div class="spec"><div class="k">Use</div><div class="v">${p.use}</div></div><div class="spec"><div class="k">Format</div><div class="v">${p.format}</div></div><div class="spec"><div class="k">Release</div><div class="v">${p.stage}</div></div></div><div class="eprline">${BRAND} requires final product data, compliance documents and order-release confirmation before quotable sale. Paid warranty extension is optional and must be selected commercially.</div>${commercial}${productInfo(p)}</div></article>`}).join("")}
