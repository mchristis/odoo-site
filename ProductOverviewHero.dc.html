<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="font-family:var(--font-web);margin-bottom:{{ gapAfter }};">
  <sc-if value="{{ hasEyebrow }}" hint-placeholder-val="{{ false }}"><div style="font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);letter-spacing:var(--web-eyebrow-ls);line-height:1.3;text-transform:uppercase;color:#666666;margin-bottom:28px;">{{ eyebrow }}</div></sc-if>
  <h1 style="margin:0 0 24px;max-width:1100px;font-size:{{ h1Size }};font-weight:200;line-height:{{ h1Lh }};letter-spacing:0.02em;text-transform:uppercase;color:#4F4F4E;text-align:left;text-wrap:balance;">{{ headline }}</h1>
  <p style="margin:0;max-width:820px;font-size:{{ pSize }};font-weight:400;line-height:1.5;color:#666666;text-wrap:pretty;">{{ description }}</p>
  <sc-for list="{{ extraLines }}" as="x" hint-placeholder-count="0">
    <p style="margin:12px 0 0;max-width:820px;font-size:{{ xSize }};font-weight:400;line-height:1.5;color:#666666;text-wrap:pretty;">{{ x.text }}</p>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:420},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ANDO · SOLAR MODULES&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;headline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;A solar panel is a long-life electrical product.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;description&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Claims about output, durability and warranty need verifiable records.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;extra&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
// Shared hero for every product Overview page: eyebrow, one H1, description, optional extra lines.
// Tokens: DS update 16 Oct 2026. Hero 56/60 desktop, 48/48 tablet, 32/32 mobile, Ultra Light CAPS.
class Component extends DCLogic {
  state = { w: typeof window !== "undefined" ? window.innerWidth : 1440 };
  componentDidMount() { this._r = () => this.setState({ w: window.innerWidth }); window.addEventListener("resize", this._r); }
  componentWillUnmount() { window.removeEventListener("resize", this._r); }
  renderVals() {
    const w = this.state.w, p = this.props;
    const h1 = w >= 1280 ? "56px" : w >= 768 ? "48px" : "32px"; const h1Lh = w >= 1280 ? "60px" : w >= 768 ? "48px" : "32px"; /* DS 16 Oct 2026 */
    const lines = String(p.extra || "").split("||").map((t) => t.trim()).filter(Boolean).map((text) => ({ text }));
    return {
      eyebrow: p.eyebrow || "", hasEyebrow: !!p.eyebrow, headline: p.headline || "", description: p.description || "",
      h1Size: h1, h1Lh, pSize: w >= 768 ? "22px" : "18px", xSize: w >= 768 ? "18px" : "16px",
      extraLines: lines, gapAfter: w >= 768 ? "64px" : "40px",
    };
  }
}
</script>
</body>
</html>
