<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/emon-strohm-energy-design-system-19842d9c-a171-4ea8-9e9e-bb2ea0c78d1d/colors_and_type.css">
<link rel="stylesheet" href="strohm-type.css">
<script src="./nav-data.js"></script>
<style>
  .pp-item .pp-name { transition: color 140ms ease-out, transform 140ms ease-out; transform-origin: left center; }
  .pp-item:hover .pp-name, .pp-item:focus-visible .pp-name { color: var(--c) !important; transform: scale(1.12); }
  @media (prefers-reduced-motion: reduce) { .pp-item .pp-name { transition: none; } .pp-item:hover .pp-name, .pp-item:focus-visible .pp-name { transform: none !important; } }
  .pp-logo { position: relative; display: inline-block; line-height: 0; }
  .pp-logo img { display: block; height: 26px; width: auto; opacity: 0; transition: opacity 140ms ease-out; }
  .pp-logo .pp-mono { position: absolute; inset: 0; background: #4F4F4E; -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: left center; mask-position: left center; transition: opacity 140ms ease-out; }
  .pp-item:hover .pp-logo img, .pp-item:focus-visible .pp-logo img { opacity: 1; }
  .pp-item:hover .pp-logo .pp-mono, .pp-item:focus-visible .pp-logo .pp-mono { opacity: 0; }
  .pp-mark { display: inline-flex; align-items: center; gap: 10px; height: 26px; }
  .pp-ic { position: relative; display: inline-block; width: 20px; height: 20px; flex: none; }
  .pp-ic img { display: block; width: 100%; height: 100%; opacity: 0; transition: opacity 140ms ease-out; }
  .pp-ic .pp-mono { position: absolute; inset: 0; background: #4F4F4E; -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; transition: opacity 140ms ease-out; }
  .pp-mark-t { font-size: 20px; font-weight: 300; line-height: 26px; letter-spacing: 0.02em; color: #4F4F4E; transition: color 140ms ease-out; white-space: nowrap; }
  .pp-item:hover .pp-ic img, .pp-item:focus-visible .pp-ic img { opacity: 1; }
  .pp-item:hover .pp-ic .pp-mono, .pp-item:focus-visible .pp-ic .pp-mono { opacity: 0; }
  .pp-item:hover .pp-mark-t, .pp-item:focus-visible .pp-mark-t { color: #282A29; }
  .pp-pop { position:absolute; top:calc(100% + 6px); left:0; z-index:5; width:280px; max-width:calc(100vw - 32px); box-sizing:border-box; padding:12px 14px; background:#FFFFFF; border:1px solid #DDDDDD; border-radius:8px; font-size:14px; font-weight:400; line-height:1.45; color:#6E6E6E; text-wrap:pretty; opacity:0; visibility:hidden; pointer-events:none; transition:opacity .12s ease 0s, visibility 0s linear .12s; }
  .pp-item:hover .pp-pop, .pp-item:focus-visible .pp-pop { opacity:1; visibility:visible; transition:opacity .12s ease .15s, visibility 0s linear .15s; }
  .pp-cols > div:nth-last-child(-n+2) .pp-pop { left:auto; right:0; }
  @media (hover: none) { .pp-pop { position:static; width:auto; padding:0; border:none; opacity:1; visibility:visible; font-size:13px; } }
</style>
</helmet>
<div style="font-family:var(--font-web);">

  <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
    <div style="max-width:calc(1312px + 2 * var(--web-side));margin:0 auto;padding:28px clamp(16px,3vw,40px) 20px;box-sizing:border-box;overflow-x:clip;overflow-y:visible;">
      <sc-if value="{{ hasLanding }}" hint-placeholder-val="{{ false }}"><a href="{{ landingHref }}" style="display:inline-block;text-decoration:none;font-size:var(--web-link-size);font-weight:var(--web-link-weight);color:#6E6E6E;margin-bottom:22px;" style-hover="color:#222222;">{{ landingLabel }}<svg width="0.5em" height="0.9em" viewBox="0 0 8 14" aria-hidden="true" style="display:inline-block;vertical-align:-0.12em;margin-left:0.4em;flex:none;"><polyline points="1,1 7,7 1,13" fill="none" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"></polyline></svg></a></sc-if>
      <div class="pp-cols" style="display:grid;grid-template-columns:repeat({{ cols }},minmax(0,1fr));gap:0 32px;width:{{ gridWidth }};">
        <sc-for list="{{ dcols }}" as="c" hint-placeholder-count="5">
          <div style="grid-column:span {{ c.span }};min-width:0;display:flex;flex-direction:column;gap:26px;padding:0 0 22px;">
            <sc-for list="{{ c.groups }}" as="g" hint-placeholder-count="1">
              <div>
                <sc-if value="{{ g.showHeading }}" hint-placeholder-val="{{ true }}">
                  <sc-if value="{{ g.headText }}" hint-placeholder-val="{{ true }}"><div style="font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);letter-spacing:var(--web-eyebrow-ls);text-transform:uppercase;color:#6E6E6E;margin-bottom:14px;">{{ g.title }}</div></sc-if><sc-if value="{{ g.headLink }}" hint-placeholder-val="{{ false }}"><a href="{{ g.headHref }}" style="display:inline-block;text-decoration:none;font-size:var(--web-link-size);font-weight:var(--web-link-weight);color:#6E6E6E;margin-bottom:14px;" style-hover="color:#222222;">{{ g.title }}<svg width="0.5em" height="0.9em" viewBox="0 0 8 14" aria-hidden="true" style="display:inline-block;vertical-align:-0.12em;margin-left:0.4em;flex:none;"><polyline points="1,1 7,7 1,13" fill="none" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"></polyline></svg></a></sc-if>
                </sc-if>
                <div style="display:grid;grid-template-columns:repeat({{ g.n }},minmax(0,1fr));gap:0 32px;">
                  <sc-for list="{{ g.inner }}" as="col" hint-placeholder-count="1">
                    <div style="display:flex;flex-direction:column;gap:{{ itemGap }};min-width:0;">
                      <sc-for list="{{ col.items }}" as="b" hint-placeholder-count="2">
                        <a class="pp-item" href="{{ b.href }}" style="--c:{{ b.colour }};text-decoration:none;display:flex;flex-direction:column;gap:3px;align-self:flex-start;max-width:280px;position:relative;">
                          <span class="pp-name" style="font-size:19px;font-weight:500;line-height:1.2;letter-spacing:0.01em;color:#4F4F4E;display:inline-flex;align-items:flex-start;gap:6px;min-height:{{ nameMin }};"><sc-if value="{{ b.plainName }}" hint-placeholder-val="{{ true }}"><span class="pp-mark"><span class="pp-mark-t" style="white-space:normal;">{{ b.name }}</span></span></sc-if><sc-if value="{{ b.hasIcon }}" hint-placeholder-val="{{ false }}"><span class="pp-mark"><span class="pp-ic"><img src="{{ b.iconSrc }}" alt=""><span class="pp-mono" style="-webkit-mask-image:url('{{ b.iconSrc }}');mask-image:url('{{ b.iconSrc }}');"></span></span><span class="pp-mark-t">{{ b.name }}</span></span></sc-if><sc-if value="{{ b.hasLogo }}" hint-placeholder-val="{{ false }}"><span class="pp-logo"><img src="{{ b.logoSrc }}" alt="{{ b.name }}"><span class="pp-mono" style="-webkit-mask-image:url('{{ b.logoSrc }}');mask-image:url('{{ b.logoSrc }}');"></span></span></sc-if><sc-if value="{{ b.isCurrent }}" hint-placeholder-val="{{ false }}"><svg aria-label="current brand" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#3A3A3A" stroke-width="1.5"><polyline points="2,6.5 5,9 10,3"></polyline></svg></sc-if></span>
                          <span style="font-size:var(--web-nav-size);font-weight:var(--web-nav-weight);line-height:1.45;color:#3A3A3A;">{{ b.subtitle }}</span>
                          <sc-if value="{{ notCompact }}" hint-placeholder-val="{{ false }}"><span style="font-size:var(--web-nav-size);font-weight:var(--web-nav-weight);line-height:1.45;color:#6E6E6E;text-wrap:pretty;">{{ b.text }}</span></sc-if><sc-if value="{{ compact }}" hint-placeholder-val="{{ true }}"><span class="pp-pop">{{ b.text }}</span></sc-if>
                        </a>
                      </sc-for>
                    </div>
                  </sc-for>
                </div>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{ hasViewAll }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;justify-content:flex-end;border-top:1px solid #DDDDDD;padding-top:14px;">
          <a href="{{ viewAllHref }}" style="text-decoration:none;font-size:var(--web-link-size);font-weight:var(--web-link-weight);color:#3A3A3A;">{{ viewAllLabel }}<svg width="0.5em" height="0.9em" viewBox="0 0 8 14" aria-hidden="true" style="display:inline-block;vertical-align:-0.12em;margin-left:0.4em;flex:none;"><polyline points="1,1 7,7 1,13" fill="none" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"></polyline></svg></a>
        </div>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
    <div>
      <sc-if value="{{ hasLanding }}" hint-placeholder-val="{{ false }}"><div style="border-top:1px solid #EEEEEE;"><a href="{{ landingHref }}" style="display:flex;align-items:center;min-height:48px;padding:0 4px;text-decoration:none;font-size:15px;font-weight:500;color:#4F4F4E;">{{ landingLabel }}</a></div></sc-if>
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
        <div>
          <sc-if value="{{ g.showHeading }}" hint-placeholder-val="{{ true }}">
            <div style="border-top:1px solid #EEEEEE;">
              <button type="button" id="{{ g.btnId }}" aria-expanded="{{ g.expanded }}" aria-controls="{{ g.listId }}" onClick="{{ g.onToggle }}" style="cursor:pointer;width:100%;min-height:48px;background:none;border:none;padding:0 4px;display:flex;align-items:center;justify-content:space-between;font-family:inherit;font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);letter-spacing:var(--web-eyebrow-ls);text-transform:uppercase;color:#6E6E6E;text-align:left;">
                <span>{{ g.title }}</span>
                <svg width="12" height="12" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2" style="flex:none;transition:transform .2s ease;transform:rotate({{ g.chevRot }});"><polyline points="2,3.5 5,6.5 8,3.5"></polyline></svg>
              </button>
            </div>
          </sc-if>
          <div id="{{ g.listId }}" role="{{ g.role }}" style="display:{{ g.listDisplay }};padding:4px 4px 12px;">
            <div style="display:flex;flex-direction:column;gap:12px;">
              <sc-for list="{{ g.items }}" as="b" hint-placeholder-count="2">
                <a class="pp-item" href="{{ b.href }}" style="--c:{{ b.colour }};text-decoration:none;display:flex;flex-direction:column;gap:1px;min-height:40px;justify-content:center;">
                  <span class="pp-name" style="font-size:var(--web-nav-size);font-weight:var(--web-nav-weight);letter-spacing:0.02em;color:#3A3A3A;display:inline-flex;align-items:center;gap:6px;">{{ b.name }}<sc-if value="{{ b.isCurrent }}" hint-placeholder-val="{{ false }}"><svg aria-label="current brand" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#3A3A3A" stroke-width="1.5"><polyline points="2,6.5 5,9 10,3"></polyline></svg></sc-if></span>
                  <span style="font-size:var(--web-nav-size);font-weight:var(--web-nav-weight);color:#3A3A3A;">{{ b.subtitle }}</span>
                  <span style="font-size:12px;font-weight:400;line-height:1.45;color:#6E6E6E;text-wrap:pretty;">{{ b.text }}</span>
                </a>
              </sc-for>
            </div>
          </div>
        </div>
      </sc-for>
      <sc-if value="{{ hasViewAll }}" hint-placeholder-val="{{ false }}">
        <div style="border-top:1px solid #EEEEEE;padding:14px 4px 4px;">
          <a href="{{ viewAllHref }}" style="text-decoration:none;font-size:var(--web-link-size);font-weight:var(--web-link-weight);color:#3A3A3A;">{{ viewAllLabel }}<svg width="0.5em" height="0.9em" viewBox="0 0 8 14" aria-hidden="true" style="display:inline-block;vertical-align:-0.12em;margin-left:0.4em;flex:none;"><polyline points="1,1 7,7 1,13" fill="none" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke"></polyline></svg></a>
        </div>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:520},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;products&quot;,&quot;systems&quot;,&quot;projects&quot;,&quot;finance&quot;],&quot;default&quot;:&quot;products&quot;,&quot;tsType&quot;:&quot;'products' | 'systems' | 'projects' | 'finance'&quot;},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
// One pattern for all four NavBar menus. Data: nav-data.js (window.STROHM_NAV.MENUS).
// Group heading shows when a group has 2+ items, or when the menu sets keepHeadings (Products: keep the 9 groups).
const BASE_COLS = 5, GAP = 32;
const DSC = { ANDO:"#CDD62B", FLUXX:"#FDC706", MOEBIUS:"#F1931B", MOX:"#D8392C", SYNQ:"#598F94", NENDO:"#1B8B9A", OZZY:"#8BCF3F", FEU:"#ED704C", GLOW:"#FCDE15", PROP:"#527A83", TOGU:"#C48723", OGO:"#00A0E3", XOOM:"#8EB15F", CHILL:"#6BC0B0", DODO:"#E5B73B", AIRO:"#0083BB", SHELTR:"#5B6592", MUKI:"#DF550C", WURK:"#9E3D2E", EMON:"#21AE8F" };
const brandColour = (name, fallback) => { const k = String(name || "").toUpperCase(); return DSC[k] ? "var(--color-brand-" + k.toLowerCase() + ", " + DSC[k] + ")" : fallback; };

const PP_ICONS = { "STRØHM LAB": "assets/icons/strohm-lab-symbol.svg", "STRØHM ENGINEERING": "assets/icons/strohm-engineering-symbol.svg" }; /* DEPTH-375 */
const PP_LOGOS = { AGRIX: "assets/logos/AGRIX-logo-symbol-wordmark-sm.png", TERRIX: "assets/logos/TERRIX-logo-symbol-wordmark-sm.png", PARX: "assets/logos/PARX-logo-symbol-wordmark-sm.png", PONTIX: "assets/logos/PONTIX-logo-symbol-wordmark-sm.png", TECTIX: "assets/logos/TECTIX-logo-symbol-wordmark-sm.png", LINA: "assets/logos/LINA-logo-symbol-wordmark.png", AIRO: "assets/logos/AIRO-logo-symbol-wordmark.svg", ANDO: "assets/logos/ANDO-logo-symbol-wordmark.svg", CHILL: "assets/logos/CHILL-logo-symbol-wordmark.svg", DEPOT: "assets/logos/DEPOT-logo-symbol-wordmark.svg", DODO: "assets/logos/DODO-logo-symbol-wordmark.svg", EMON: "assets/logos/EMON-logo-symbol-wordmark-2026.svg", FEU: "assets/logos/FEU-logo-symbol-wordmark.svg", FLUXX: "assets/logos/FLUXX-logo-symbol-wordmark.svg", GLOW: "assets/logos/GLOW-logo-symbol-wordmark.svg", KALK: "assets/logos/KALK-logo-symbol-wordmark.svg", KERN: "assets/logos/KERN-logo-symbol-wordmark.svg", MOEBIUS: "assets/logos/MOEBIUS-logo-symbol-wordmark.svg", MOX: "assets/logos/MOX-logo-symbol-wordmark-2026.svg", MUKI: "assets/logos/MUKI-logo-symbol-wordmark.svg", NENDO: "assets/logos/NENDO-logo-symbol-wordmark-2026.svg", OGO: "assets/logos/OGO-logo-symbol-wordmark.svg", OZZY: "assets/logos/OZZY-logo-symbol-wordmark.svg", PACT: "assets/logos/PACT-logo-symbol-wordmark.svg", PROP: "assets/logos/PROP-logo-symbol-wordmark.svg", PUSH: "assets/logos/PUSH-logo-symbol-wordmark.svg", SHELTR: "assets/logos/SHELTR-logo-symbol-wordmark.svg", SYNQ: "assets/logos/SYNQ-logo-symbol-wordmark.svg", TOGU: "assets/logos/TOGU-logo-symbol-wordmark.svg", TRIBE: "assets/logos/TRIBE-logo-symbol-wordmark.svg", WURK: "assets/logos/WURK-logo-symbol-wordmark.svg", XOOM: "assets/logos/XOOM-logo-symbol-wordmark.svg" }; /* DEPTH-371: symbol + name, no tagline */
class Component extends DCLogic {
  state = { openGroups: {} };

  componentDidMount() {
    if (!window.STROHM_NAV) {
      this._t = setInterval(() => { if (window.STROHM_NAV) { clearInterval(this._t); this.forceUpdate(); } }, 50);
    }
  }
  componentWillUnmount() { if (this._t) clearInterval(this._t); }

  renderVals() {
    const key = this.props.kind || "products";
    const menu = window.STROHM_NAV ? window.STROHM_NAV.menu(key) : null;
    const mobile = this.props.mobile === true;
    const og = this.state.openGroups;
    const cols = menu ? menu.columns : BASE_COLS;
    const groups = (menu ? menu.groups : []).map((g, gi) => {
      const showHeading = !!g.title && (g.items.length >= 2 || !!menu.keepHeadings);
      const id = key + "-" + gi;
      const open = !showHeading || !!og[id];
      const cur = this.props.current || "";
      return {
        title: g.title || "", showHeading, headHref: g.href || "",
        items: g.items.map((it) => ({ ...it, hasIcon: !mobile && !!PP_ICONS[it.name], iconSrc: PP_ICONS[it.name] || "", plainName: (mobile || !PP_LOGOS[it.name]) && !(!mobile && PP_ICONS[it.name]), hasLogo: !mobile && !!PP_LOGOS[it.name], noLogo: mobile || !PP_LOGOS[it.name], logoSrc: PP_LOGOS[it.name] || "", colour: brandColour(it.name, it.colour), isCurrent: !!cur && it.name === cur, ariaCurrent: (!!cur && it.name === cur) ? "true" : "false" })),
        btnId: "pp-btn-" + id, listId: "pp-list-" + id,
        role: showHeading ? "region" : "group",
        expanded: og[id] ? "true" : "false",
        chevRot: og[id] ? "180deg" : "0deg",
        listDisplay: open ? "block" : "none",
        onToggle: () => this.setState(s => ({ openGroups: { ...s.openGroups, [id]: !s.openGroups[id] } })),
      };
    });
    // Headless groups flow item by item across the columns.
    const blocks = [];
    groups.forEach((g) => { if (g.showHeading) blocks.push(g); else g.items.forEach((it) => blocks.push({ showHeading: false, title: "", items: [it] })); });
    const dcols = ((menu && menu.layout) || []).map((c) => ({ span: c.span, groups: c.groups.map((gi) => {
      const g = groups[gi], sp = (menu.groups[gi].split) || [g.items.length];
      let k = 0; const inner = menu.groups[gi].rowsFirst ? sp.map((n, c) => ({ items: g.items.filter((x, xi) => xi % sp.length === c) })) : sp.map((n) => { const items = g.items.slice(k, k + n); k += n; return { items }; });
      return { title: g.title, showHeading: g.showHeading, headLink: !!g.headHref, headText: !g.headHref, headHref: g.headHref || "#", n: inner.length, inner };
    }) }));
    const va = menu && menu.viewAll;
    return {
      compact: !!(menu && menu.compact), notCompact: !(menu && menu.compact), itemGap: (menu && menu.compact) ? "14px" : "22px",
      isDesktop: !mobile, isMobile: mobile,
      hasLanding: !!(menu && menu.landing), landingHref: menu && menu.landing ? menu.landing.href : "#", landingLabel: menu && menu.landing ? menu.landing.label : "",
      nameMin: menu && menu.alignTitles ? "2.4em" : "0",
      cols,
      gridWidth: cols >= BASE_COLS ? "100%" : cols === 3 ? "100%" : `calc(${(cols / BASE_COLS) * 100}% - ${((BASE_COLS - cols) * GAP) / BASE_COLS}px)`,
      blocks, groups, dcols,
      hasViewAll: !!va, viewAllLabel: va ? va.label : "", viewAllHref: va ? va.href : "",
    };
  }
}

</script>
</body>
</html>
