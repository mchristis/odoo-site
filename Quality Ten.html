var T=[["The Exploded System","Engineering illustration · FLUXX battery, opened","Understand the purpose of every component and how each relates to the others.","Look at an opened home battery and every part has a place: cells, busbars, management electronics, sensors, enclosure. Understanding a product means knowing why each part is there and what it depends on. A component that cannot explain its purpose does not belong. Beauty here is not decoration. It is the clarity of an assembly in which nothing is accidental, and everything can be traced back to a function.","Battery modules, management board and connections are laid out so they can be understood, tested and serviced, not only assembled."],["Mechanical Intelligence","Mechanical detail · MOEBIUS housing and cooling","Look beyond appearance into the internal logic of the machine.","A machine reveals its quality in the parts nobody sees: how a shaft is supported, how heat leaves a housing, how two surfaces meet. Looking beyond the outside means asking what each mechanical decision is for. Good mechanical design makes the logic readable. Gears, bearings and housings cooperate quietly, and the result is a product that behaves the same on the hundredth day as on the first.","Housing, heat path and fixing points are designed together, so cooling and construction are part of one decision."],["The Intelligence Inside","Electronics macro · EMON, BMS and control electronics","Technical sophistication shows in careful, thoughtful electronic design.","Under the cover, a circuit board is an organised landscape: power paths kept apart from signals, components placed for heat and service, traces following clear logic. Sophistication is rarely visible from outside, yet reliability starts here. A well-designed board is calm. Nothing crowds, nothing improvises, and every connection has a reason. The intelligence of a product is the discipline of its electronics.","Control and measurement electronics are laid out for reliability and diagnosis, so the product can report on itself."],["Order from Complexity","Swiss grid construction · integrated system architecture","Quality comes from structure, logic and controlled complexity.","A complex system becomes understandable when its relationships are made explicit. Lines, circles and a grid do not simplify the world. They show how parts relate. In energy technology the same principle applies: many devices, protocols and requirements can be organised so that each has a defined place and a defined interface. Order is not the absence of complexity. It is complexity that has been understood and given a structure.","Interfaces between products are defined once and documented, so a system is configured rather than improvised."],["Engineering as Architecture","Structural composition · battery and inverter as one installation","Beauty is the result of proportion, structure and functional necessity.","Good architecture shows how it stands up. Beams carry loads, columns have proportions that follow forces, and nothing is added for effect. The same standard applies to an installation: a battery, an inverter and their mounting form one built object. When construction is expressed honestly, the result looks right because it is right. Proportion is what technical correctness looks like from a distance.","Products are designed as part of the installation they enter, with mounting, access and service space considered from the start."],["The Beauty of Tolerance","Material and precision · aluminium interfaces","Craftsmanship lives in tolerances, detail and manufacturing quality.","Where two parts meet, quality becomes visible: the gap, the edge, the surface left by the tool. A precision interface is not luxury. It decides whether a connection seals, a housing aligns and an assembly goes together without force. Tolerance is the discipline of saying exactly how close is close enough, and then manufacturing to it. The beauty is in a fit that simply works, every time it is made.","Critical interfaces are specified with defined fits and finishes, then checked as part of production quality control."],["Harmony in Electricity","Scientific visualisation · coordinated waveforms","Balance between components, control and system behaviour.","Electricity is a set of curves: voltage and current, generation and consumption, each with its own rhythm. A stable system is one in which these curves are coordinated rather than competing. Control is the art of keeping them in step. Harmony here is not metaphor. It is phase, balance and timing, made visible, and it is what allows many devices to behave as a single installation.","Generation, storage and loads are coordinated through energy management, so devices work with each other instead of against each other."],["The Art of Monitoring","Monitoring · FLUXX with an EMON display","Care is part of understanding: quality does not end at production.","In Robert M. Pirsig’s Zen and the Art of Motorcycle Maintenance, quality comes from care, rational understanding and the relationship between a person and a machine. The book is not a repair manual, and it is not only about Zen. It asks how attention shapes work. Applied to energy, care becomes monitoring: following performance, temperature, battery condition, charge cycles and deviations, so the system stays understood throughout its life.","State of charge, state of health, temperature and deviations are made visible through EMON, so a system can be understood while it operates."],["The Beauty of the Whole","System architecture · generation, conversion, storage, measurement, switching, EMON and connected applications","A good product performs its function. A good system makes every product work better together.","ANDO and PROP generate energy. MOEBIUS converts it. FLUXX stores it. SYNQ measures it. OZZY provides intelligent switching. EMON brings these functions together through monitoring, coordination and control. Connected applications, from NENDO heat pumps and OGO water heating to XOOM EV charging, AIRO ventilation, FEU, GLOW and CHILL, become part of a wider energy system. Each product has a purpose. Each connection has a consequence. Each design decision influences the performance of the whole.","This is why STROHM.ENERGY develops and manufactures many different products: so that the way they work together can be designed and improved."],["Quality Through Understanding","Engineering, installation, operation and the person using the system","Quality is the relationship between a decision, an installation and the person who lives with it.","Pirsig’s inquiry concerns Quality, care, and the relationship between analytical and experiential understanding. We borrow that thought for our own work. An engineering decision shows its quality in the installation, in how the system runs, and in how easily a person can use it. What is learned in operation returns to the next engineering decision. Quality needs both analytical precision and human understanding.","We design products that engineers can trust, installers can work with and people can use without unnecessary complexity."]];
