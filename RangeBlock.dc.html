<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<script src="./range-data.js"></script>
<style> a { text-decoration:none; } </style>
</helmet>
<section id="range" data-screen-label="The range" style="scroll-margin-top:156px;max-width:calc(1312px + 2 * var(--web-side));margin:0 auto;padding:56px var(--web-side) 0;box-sizing:border-box;font-family:var(--font-web);">
  <div style="margin-bottom:12px;font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);letter-spacing:var(--web-eyebrow-ls);text-transform:uppercase;color:#898989;">The range</div>
  <h2 style="margin:0 0 28px;font-size:clamp(36px,3.6vw,52px);font-weight:200;line-height:1.08;letter-spacing:-1px;color:#252525;text-wrap:balance;">{{ headA }} <span style="color:#8E8E8E;">{{ headB }}</span></h2>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:16px;">
    <sc-for list="{{ cards }}" as="r" hint-placeholder-count="4">
      <a href="{{ r.href }}" style="background:{{ cardBg }};border-radius:12px;padding:12px 12px 22px;display:flex;flex-direction:column;gap:6px;color:#252525;" style-hover="background:#E3E3E3;">
        <div style="position:relative;aspect-ratio:4/3;margin-bottom:10px;border-radius:8px;overflow:hidden;"><image-slot id="{{ r.slot }}" shape="rounded" radius="8" placeholder="{{ r.ph }}"></image-slot></div>
        <span style="font-size:20px;font-weight:300;line-height:1.25;padding:0 10px;">{{ r.name }}</span>
        <sc-if value="{{ r.hasValue }}" hint-placeholder-val="{{ false }}"><span style="font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);letter-spacing:var(--web-eyebrow-ls);text-transform:uppercase;color:{{ valueColor }};padding:0 10px;">{{ r.value }}</span></sc-if>
        <span style="font-size:var(--web-small-size);font-weight:300;line-height:var(--web-small-lh);color:#252525;padding:0 10px;">{{ r.use }}</span>
      </a>
    </sc-for>
    <sc-if value="{{ hasTool }}" hint-placeholder-val="{{ true }}">
      <div style="background:{{ cardBg }};border-radius:12px;padding:22px;display:flex;align-items:flex-end;min-height:100%;box-sizing:border-box;">
        <a href="{{ toolHref }}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;min-height:var(--cta-height);padding:12px var(--cta-pad-x);box-sizing:border-box;background:#4F4F4E;color:#F4F4F4;border-radius:var(--cta-radius);text-align:center;" style-hover="background:#5F5E5E;">
          <span style="display:flex;align-items:center;gap:8px;font-size:16px;font-weight:400;">{{ brand }} by<img src="assets/logos/KALK-logo-symbol-wordmark.svg" alt="KALK" style="height:18px;width:auto;display:block;filter:brightness(0) invert(1);"></span>
          <span style="font-size:var(--web-min-size);font-weight:300;color:#F4F4F4;">{{ toolLabel }}</span>
        </a>
      </div>
    </sc-if>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1480,&quot;height&quot;:900},&quot;brand&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;SYNQ&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
/* DEPTH-1261: one range block for every brand Overview (ANDO layout). Data: range-data.js (window.STROHM_RANGE). Button: "BRAND by KALK" + tool name. */
const DARK = {AGRIX:"#3A5228",AIRO:"#004A6B",CHILL:"#2D6B60",DODO:"#7A5E14",FEU:"#8A3418",FLUXX:"#5F5E5E",GLOW:"#7A6A0A",LINA:"#4F5C12",MOEBIUS:"#5F5E5E",MOX:"#7A1C14",MUKI:"#5F5E5E",NENDO:"#0F4D55",OGO:"#005A80",OZZY:"#46701A",SHELTR:"#323A5E",SYNQ:"#2E5054",TOGU:"#6E4A12",WURK:"#5E2219",XOOM:"#4A6526",ANDO:"#5F5E5E",PROP:"#2E4A50",PARX:"#556627",PONTIX:"#04434F",TECTIX:"#2A3547",TERRIX:"#3E4536"};
class Component extends DCLogic {
  componentDidMount() { if (!window.STROHM_RANGE) this._t = setInterval(() => { if (window.STROHM_RANGE) { clearInterval(this._t); this.forceUpdate(); } }, 60); }
  componentWillUnmount() { clearInterval(this._t); }
  renderVals() {
    const b = String(this.props.brand || "").toUpperCase(), d = (window.STROHM_RANGE || {})[b] || { cards: [] };
    let a = d.headA || "", h = d.headB || "";
    if (!h) { const m = a.match(/^([^.]+\.)\s+(.+)$/); if (m) { a = m[1]; h = m[2]; } }
    return {
      brand: b, headA: a, headB: h,
      cardBg: "var(--color-card-" + b.toLowerCase() + ", #F4F4F4)", valueColor: DARK[b] || "#5F5E5E",
      cards: (d.cards || []).map((c, i) => ({ name: c.name, value: c.value || "", hasValue: !!c.value, use: c.use || "", href: c.href || "#", slot: c.slot || b.toLowerCase() + "-range-" + i, ph: b + " · " + c.name + " · product photo" })),
      hasTool: !!d.tool && !this.props.hideTool, toolHref: d.tool ? d.tool.href : "#", toolLabel: d.tool ? d.tool.label : "",
    };
  }
}
</script>
</body>
</html>
