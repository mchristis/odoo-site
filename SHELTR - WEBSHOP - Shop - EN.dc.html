function renderFoot(){document.getElementById("foot").innerHTML=`<b>SHELTR filter logic v1:</b> Product category is not shown as a filter because all items are Inverter RoofShelter. The real choice order is Mounting type, Inverter weight class, Width / dimensions, then Ballast. After login: Availability route only.<br><b>ANDO warehouse method:</b> sidebar shows Availability only. Warehouse split appears inside the EU stock route after login.<br><span class="am">Demo warehouse split inside EU stock: Rotterdam NL, Hamburg DE, Poznan PL. Provisional: price, stock, reserved quantity, MOQ, route dates, fixing/ballast calculation and roof compatibility status.</span>`}
function refresh(){buildFilters();renderChips();renderCards()}
document.getElementById("filters").addEventListener("change",e=>{const t=e.target;if(t.type==="checkbox"){const el=t.closest(".opt"),k=el.dataset.key,v=el.dataset.val;t.checked?state.checks[k].add(v):state.checks[k].delete(v);refresh()}});
document.getElementById("clearAll").onclick=()=>{CHECKS.forEach(c=>state.checks[c.key].clear());refresh()};document.getElementById("sort").onchange=renderCards;document.getElementById("btnAnon").onclick=()=>{state.auth=false;setAuth()};document.getElementById("btnAuth").onclick=()=>{state.auth=true;setAuth()};
function setAuth(){document.getElementById("btnAnon").classList.toggle("active",!state.auth);document.getElementById("btnAuth").classList.toggle("active",state.auth);if(!state.auth)state.checks.av.clear();renderSort();refresh()}
document.getElementById("cards").addEventListener("input",e=>{const s=e.target;if(!s.classList.contains("qslider"))return;const q=+s.value,c=calcStatus(q,+s.dataset.base,+s.dataset.fixed,+s.dataset.floor,s.dataset.eu==="1"),S=STAT[c.key],w=s.closest(".orderblock"),bt=+s.dataset.fixed?" &middot; burden "+(c.burden*100).toFixed(0)+"%":"";w.querySelector(".qnow").textContent=q+" pcs";w.querySelector(".oread").innerHTML=`${q} pcs &middot; ${eur(c.unit)}/pc &middot; total ${eur(c.total)}${bt} &middot; <b class="s-${S.mark}">${S.lab}</b>`;const b=w.querySelector(".obtn");b.className="obtn "+S.cls;b.textContent=S.btn.replace("{floor}",eur(+s.dataset.floor));b.disabled=(c.key==="blocked"||c.key==="minval")});
document.getElementById("cards").addEventListener("click",e=>{const pt=e.target.closest&&e.target.closest(".pitab");if(pt){const w=pt.closest(".pi-inner"),to=pt.dataset.pt;w.querySelectorAll(".pitab").forEach(b=>b.classList.toggle("active",b===pt));w.querySelectorAll(".pipanel").forEach(pl=>pl.classList.toggle("hide",pl.dataset.pt!==to))}});
renderSort();buildFilters();renderChips();renderCards();renderFoot();

/* ROLLOUT_DECOR v2 positional */
(function(){
var KEYS=["EU","Floating","Factory","MTO"];
var HOLD={EU:"Reservation hold, payment within 24 h or the hold lapses.",Floating:"Reservation hold, payment within 12 h or the hold lapses.",Factory:"Reservation hold, payment within 48 h or the hold lapses."};
function cetNow(){var t=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Amsterdam",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date());var a=t.split(":");return(+a[0])*60+(+a[1]);}
function cutoffHTML(){var n=cetNow(),c=14*60;if(n<c){var r=c-n;var soon=r<60?" soon":"";return '<span class="ck-k">Order before 14:00 CET</span><span class="ck-t'+soon+'">'+Math.floor(r/60)+' h '+String(r%60).padStart(2,"0")+' min left</span><span class="ck-s ok">Ships today</span>';}return '<span class="ck-k">Cutoff 14:00 CET passed</span><span class="ck-s warn">Ships next business day</span>';}
function routeKey(d){var p=d.parentElement;if(!p)return"MTO";var all=Array.prototype.filter.call(p.children,function(x){return x.matches&&x.matches("details.route");});return KEYS[all.indexOf(d)]||"MTO";}
function pcs(t){var m=(t||"").match(/(\d[\d\s.,]*)\s*pcs/);return m?parseInt(m[1].replace(/[^\d]/g,""),10):null;}
function euPairs(d){var out=[];d.querySelectorAll(".rdgrid .rd").forEach(function(r){var k=r.querySelector(".k"),v=r.querySelector(".v");var q=pcs(v&&v.textContent);if(k&&q!=null)out.push([k.textContent.trim(),q]);});if(out.length)return out;d.querySelectorAll(".whprice .whrow .wn").forEach(function(w){var q=pcs(w.textContent);var name=w.textContent.split("\u00b7")[0].trim();if(q!=null)out.push([name,q]);});return out;}
function flNums(d){var a=null,r=null,f=null;d.querySelectorAll(".qbreak .qcell").forEach(function(c){var k=(c.querySelector(".k")||{}).textContent||"";var q=pcs((c.querySelector(".v")||{}).textContent);if(/available/i.test(k))a=q;else if(/reserved/i.test(k))r=q;else if(/free/i.test(k))f=q;});return[a,r,f];}
function bar(segs,legend){var tot=segs.reduce(function(s,x){return s+x[1];},0)||1;var b='<div class="stockbar">'+segs.map(function(x){return '<span class="'+x[0]+'" style="width:'+(x[1]/tot*100).toFixed(1)+'%"></span>';}).join("")+'</div>';return b+'<div class="sblegend">'+legend+'</div>';}
function decorate(){
 document.querySelectorAll("details.route").forEach(function(d){
  var key=routeKey(d);
  if(!d.dataset.dec){
   if(!d.querySelector(".stockbar")){
    if(key==="EU"){var pr=euPairs(d);if(pr.length){var segs=pr.map(function(p,i){return["sb-w"+(i%3),p[1]];});var leg=pr.map(function(p,i){return '<span class="lg lg'+(i%3)+'"></span>'+p[0]+' '+p[1];}).join(" &nbsp; ")+" pcs";var host=d.querySelector(".rdgrid,.whprice");if(host)host.insertAdjacentHTML("afterend",bar(segs,leg));}}
    if(key==="Floating"){var n=flNums(d);if(n[0]&&n[1]!=null&&n[2]!=null){var host2=d.querySelector(".qbreak");if(host2)host2.insertAdjacentHTML("afterend",bar([["sb-res",n[1]],["sb-free",n[2]]],'<span class="lg lgr"></span>Reserved '+n[1]+' &nbsp; <span class="lg lgf"></span>Free to order '+n[2]+' pcs'));}}
   }
   if(key==="EU"&&!d.querySelector(".cutoffline")&&euPairs(d).length)d.insertAdjacentHTML("beforeend",'<div class="cutoffline">'+cutoffHTML()+'</div>');
   if(HOLD[key]&&!d.querySelector(".holdline"))d.insertAdjacentHTML("beforeend",'<div class="holdline">'+HOLD[key]+'</div>');
   d.dataset.dec="1";
  }
  if(key==="EU"&&!d.dataset.op){d.open=true;d.dataset.op="1";}
 });
}
var host=document.getElementById("cards")||document.body;
new MutationObserver(decorate).observe(host,{childList:true,subtree:true});
decorate();
setInterval(function(){document.querySelectorAll(".cutoffline").forEach(function(e){e.innerHTML=cutoffHTML();});decorate();},30000);
})();

  }
}
</script>
