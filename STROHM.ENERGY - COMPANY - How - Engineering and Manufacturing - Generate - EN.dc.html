<script type="text/x-dc" data-dc-script>
const HERO_ITEMS = [{"label":"Engineering","heading":"From cell to site.","sentence":"Choose a stage to see the machine, what is done there and how it is tested.","href":"em-generate-machines","media":{"type":"slot","slot":"strohm-energy-how-engineering-and-manufacturing-generate-hero","alt":"GENERATE engineering and manufacturing hero picture 1"}},{"label":"Manufacturing","heading":"Production sequence.","sentence":"Every production step, grouped by phase.","href":"em-generate-sequence","media":{"type":"slot","slot":"strohm-energy-how-engineering-and-manufacturing-generate-hero-2","alt":"GENERATE engineering and manufacturing hero picture 2"}},{"label":"Quality","heading":"Records kept for every module.","sentence":"They trace a delivered panel to its materials, process conditions and measured performance.","href":"em-generate-records","media":{"type":"slot","slot":"strohm-energy-how-engineering-and-manufacturing-generate-hero-3","alt":"GENERATE engineering and manufacturing hero picture 3"}}];

class _EmBase extends DCLogic {
  state = { ready: !!(window.EM_GENERATE_A && window.EM_GENERATE_B) };
  componentDidMount() { if (!this.state.ready) { this._i = setInterval(() => { if (window.EM_GENERATE_A && window.EM_GENERATE_B) { clearInterval(this._i); this.setState({ ready: true }); } }, 100); } }
  componentWillUnmount() { clearInterval(this._i); }
  machineVals() {
    const S = [
      ['Cell inspection', 'Incoming inspection station with camera, electrical tester and electroluminescence (EL) imaging.', 'ANDO uses monocrystalline N-type TOPCon cells in 182 mm (M10) format. Every cell batch is scanned and checked for chips, cracks, contamination and dimensions before it enters production.', 'Electrical verification and EL imaging to the inspection plan. Rejected cells are held separately.', '', ''],
      ['Cell sorting', 'Automatic cell sorting machine.', 'Cells are sorted automatically by their measured grade, so that cells of the same grade are strung together.', 'Sorted cells are checked against the grade list.', '', ''],
      ['Laser cutting', 'Laser cutting and separation station with vision inspection.', 'Full M10 cells are laser-cut into half cells in the factory and separated with low-stress handling.', 'Cut edges and cell condition are inspected by camera; damaged cells are removed automatically.', '', ''],
      ['Stringing', 'Automatic tabber stringer.', 'Multi-busbar (MBB) round copper wires are cut, aligned and soldered to the half cells, which are connected into strings of the correct length and polarity.', 'Automated optical inspection of alignment and soldering, inline imaging for cell damage and scheduled bond-strength checks.', '', ''],
      ['String EL', 'EL tester for strings.', 'Each string is imaged after stringing, so cell damage from soldering is found before the strings are laid up.', 'EL images are evaluated against defect criteria; faulty strings are removed.', 'EL image of each string.', ''],
      ['Glass preparation', 'Glass loading robot, washer and dryer.', 'Front glass is picked up sheet by sheet, washed, dried and covered with the first encapsulant layer.', 'Cleanliness and coated-side orientation are checked by camera.', '', ''],
      ['Encapsulant cutting', 'Automatic encapsulant film cutter.', 'Encapsulant film is cut from the roll to the size of the module layers.', 'Cut size and film condition are checked.', '', ''],
      ['Robotic layup', 'Layup robot with camera alignment and automatic bussing.', 'Strings are placed on the encapsulant, connected with cross ribbons and the module receives its serial number.', 'Vision checks of string spacing, orientation and polarity.', 'The module serial number is created and becomes the key for every later result.', ''],
      ['Pre-lamination EL', 'EL tester before lamination.', 'Upper encapsulant and rear layer are added, then the full stack is imaged while it can still be repaired.', 'EL images are evaluated against defect criteria; eligible defects are repaired and re-inspected.', 'Pre-lamination EL image and inspection result.', ''],
      ['Taping', 'Automatic taping machine.', 'The strings are fixed in position with tape before the module goes into the laminator.', 'Camera check that the strings have not moved.', '', ''],
      ['Lamination', 'Vacuum laminator.', 'The layers are bonded under a controlled vacuum, temperature and pressure cycle, then cooled and trimmed.', 'Temperature, pressure, vacuum and cycle time are recorded; laminates are inspected for bubbles and delamination.', '', ''],
      ['Buffer', 'Conveyor buffer.', 'Laminates are held in a buffer between lamination and the next station so the line keeps moving.', 'Module identity is read when a laminate enters and leaves the buffer.', '', ''],
      ['Visual inspection', 'Inspection station that turns the module to 90 degrees.', 'The laminate is inspected by eye at 90 degrees for bubbles, misplaced cells and surface defects.', 'Visual criteria for appearance; failed laminates are separated.', '', ''],
      ['Framing', 'Sealant dispenser and automatic framing press.', 'ANDO: anodised aluminium frame profiles are fitted around the laminate with silicone sealant and the corner keys are pressed. NOUVEL is frameless; its edges are sealed with edge tape or encapsulant overlap.', 'Squareness, corner closure and frame attachment are checked.', '', ''],
      ['Junction box soldering', 'Adhesive dispensing robot with soldering station.', 'The junction box is bonded and the conductors are joined to its terminals.', 'Joint inspection, bypass diode check, cable length and connector identity.', '', ''],
      ['Junction box potting', 'Potting station.', 'The box is potted and closed.', 'Fill and closure are inspected.', '', ''],
      ['Curing', 'Curing line with conveyors.', 'Modules travel along the curing line while the adhesive and potting compound cure.', 'Curing time and conditions are recorded.', '', ''],
      ['Flash test', 'Solar simulator (flash tester).', 'Each finished module is measured under defined conditions to determine its electrical performance and power class.', 'Complete current–voltage (I–V) curve with corrections to reference conditions.', 'I–V curve, Pmax, Vmp, Imp, Voc, Isc and power class.', ''],
      ['Final EL and safety', 'EL camera, dielectric and insulation tester, continuity tester.', 'Every module is imaged once more and tested for electrical safety.', 'Final EL against defect criteria, dielectric withstand, insulation and bonding continuity.', 'Final EL image and electrical safety results.', ''],
      ['Labelling', 'Label printer and camera verification.', 'The rating label and the serial and QR label are applied and checked against the measured power class.', 'Camera check that label, QR code and production record match.', 'Link between serial number, QR code and production record.', ''],
      ['Sorting by power class', 'Automatic sorting by measured power class.', 'Tested modules are sorted by their measured power class before packing.', 'Power class is checked against the flash test record.', 'Power class sorting result per serial number.', ''],
      ['Robotic packing', 'Packing robot with validated vacuum tooling or frame support.', 'Modules are lifted without flexing, fitted with corner protection and packed on pallets in the approved pattern.', 'Position check of every module; quantity and power class verified per pallet.', 'Which module serials are on which pallet.', ''],
      ['From factory to site', 'Phone or tablet with the EMON app.', 'On site, the installer scans the QR code on each module. EMON finds the module with its factory results and links it to its string and position.', 'No serials are typed. The installed layout and the warranty registration are created from the scans.', 'Installed position, string assignment and warranty registration, added to the same record.', '']
    ];
    const pad = (x) => (x < 10 ? '0' + x : '' + x);
    const cur = this.state.mStage || 0;
    const mStages = S.map((s, i) => ({ no: pad(i + 1), name: s[0], emon: !!s[4], on: i === cur ? 'true' : 'false', line: i === cur ? '#CDD62B' : '#E3E3E3', pick: () => { if (this.state.mStage !== i) this.setState({ mStage: i }); } }));
    const a = S[cur];
    const ms = { no: pad(cur + 1), name: a[0], machine: a[1], proc: a[2], test: a[3], dataLabel: a[4] ? 'Saved to EMON' : 'Kept in the factory record', dot: a[4] ? '#CDD62B' : '#BBBBBB', data: a[4] || 'Process data stays in the production record for this module and can be retrieved for quality investigation.', hasTbc: !!a[5], tbc: a[5] };
    return { mStages, ms };
  }
  renderVals() {
    const A = window.EM_GENERATE_A, B = window.EM_GENERATE_B;
    const d = A && B ? { phases: A.phases.concat(B.phases), records: B.records } : null;
    const mv = this.machineVals();
    if (!d) return { ...mv, phases: [], records: [], total: '', phaseCount: '' };
    let n = 0;
    const pad = (x) => (x < 10 ? '0' + x : '' + x);
    const phases = d.phases.map(([title, intro, steps, flag], i) => { if (flag === 'nonum') return { no: pad(i + 1), title, intro, steps: steps.map(([op, ctl]) => ({ no: '', op, ctl })), range: title.indexOf('test') >= 0 ? 'Sample tests' : 'Differences' }; const first = n + 1; const st = steps.map(([op, ctl]) => ({ no: pad(++n), op, ctl })); return { no: pad(i + 1), title, intro, steps: st, range: 'Steps ' + pad(first) + '–' + pad(n) }; });
    return { ...mv, phases, records: d.records.map(([k, v]) => ({ k, v })), total: n, phaseCount: d.phases.length };
  }
}

class Component extends _EmBase { renderVals() { const b = super.renderVals ? super.renderVals() : {}; return Object.assign({}, b, { heroItems: HERO_ITEMS }); } }
</script>
