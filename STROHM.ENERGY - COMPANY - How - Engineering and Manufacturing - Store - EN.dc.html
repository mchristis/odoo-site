<script type="text/x-dc" data-dc-script>
const HERO_ITEMS = [{"label":"Engineering","heading":"From cell to site.","sentence":"Choose a stage to see the machine, what is done there and how it is tested.","href":"em-store-machines","media":{"type":"slot","slot":"strohm-energy-how-engineering-and-manufacturing-store-hero","alt":"STORE engineering and manufacturing hero picture 1"}},{"label":"Manufacturing","heading":"Production sequence.","sentence":"Every production step, grouped by phase.","href":"em-store-sequence","media":{"type":"slot","slot":"strohm-energy-how-engineering-and-manufacturing-store-hero-2","alt":"STORE engineering and manufacturing hero picture 2"}},{"label":"Quality","heading":"Records kept for every battery.","sentence":"They make each battery auditable and let a field fault be traced back to its origin.","href":"em-store-records","media":{"type":"slot","slot":"strohm-energy-how-engineering-and-manufacturing-store-hero-3","alt":"STORE engineering and manufacturing hero picture 3"}}];

class _EmBase extends DCLogic {
  state = { ready: !!window.EM_STORE };
  componentDidMount() { if (!this.state.ready) { this._i = setInterval(() => { if (window.EM_STORE) { clearInterval(this._i); this.setState({ ready: true }); } }, 100); } }
  componentWillUnmount() { clearInterval(this._i); }
  machineVals() {
    const P = (window.EM_STAGES || {})['store'];
    if (!P) return { mStages: [], ms: { no: '', name: '', machine: '', proc: '', test: '', dataLabel: '', dot: '#BBBBBB', data: '', hasTbc: false, tbc: '' } };
    const S = P.stages;
    const pad = (x) => (x < 10 ? '0' + x : '' + x);
    const cur = Math.min(this.state.mStage || 0, S.length - 1);
    const mStages = S.map((s, i) => ({ no: pad(i + 1), name: s[0], emon: !!s[4], on: i === cur ? 'true' : 'false', line: i === cur ? '#F76801' : '#E3E3E3', pick: () => { if (this.state.mStage !== i) this.setState({ mStage: i }); } }));
    const a = S[cur];
    return { mStages, ms: { no: pad(cur + 1), name: a[0], machine: a[1], proc: a[2], test: a[3], dataLabel: a[4] ? 'Saved to EMON' : 'Kept in the factory record', dot: a[4] ? '#F76801' : '#BBBBBB', data: a[4] || 'Process data stays in the production record for this ' + P.unit + ' and can be retrieved for quality investigation.', hasTbc: !!a[5], tbc: a[5] } };
  }
  renderVals() { return { ...this.baseVals(), ...this.machineVals() }; }
  baseVals() {
    const d = window.EM_STORE;
    if (!d) return { phases: [], records: [], total: '', phaseCount: '' };
    let n = 0;
    const pad = (x) => (x < 10 ? '0' + x : '' + x);
    const phases = d.phases.map(([title, intro, steps], i) => { const first = n + 1; const st = steps.map(([op, ctl]) => ({ no: pad(++n), op, ctl })); return { no: pad(i + 1), title, intro, steps: st, range: 'Steps ' + pad(first) + '–' + pad(n) }; });
    return { phases, records: d.records.map(([k, v]) => ({ k, v })), total: n, phaseCount: d.phases.length };
  }
}

class Component extends _EmBase { renderVals() { const b = super.renderVals ? super.renderVals() : {}; return Object.assign({}, b, { heroItems: HERO_ITEMS }); } }
</script>
