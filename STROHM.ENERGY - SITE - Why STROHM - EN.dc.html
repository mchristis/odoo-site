        <span style="font-size:var(--web-eyebrow-size);font-weight:var(--web-eyebrow-weight);letter-spacing:var(--web-eyebrow-ls);text-transform:uppercase;color:#5F5E5E;">Why STRØHM.ENERGY</span>

          <sc-if value="{{ p.hasLink }}" hint-placeholder-val="{{ false }}"><a href="{{ p.href }}" style="font-size:var(--web-small-size);color:#4F4F4E;text-decoration:none;border-bottom:1px solid #1E1E1E;padding-bottom:2px;align-self:flex-start;line-height:var(--web-small-lh);">{{ p.linkLabel }} &#8250;</a></sc-if>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:900},&quot;scope&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;fluxx&quot;]}}">
const ALL = [
  { key: "plan", t: "One system, one plan", b: "EMON controls the battery, heat pump, inverter and EV charger with one schedule. They no longer compete for the same cheap hour or push the same peak.", href: "FLUXX - PRODUCT - FLUXX with EMON - EN.dc.html", linkLabel: "How EMON plans" },
  { key: "brands", t: "Our own brands across the home", b: "Batteries, heat pumps, inverters, solar panels, mounting and meters: FLUXX, NENDO, MOEBIUS, ANDO, MOX and SYNQ, engineered and manufactured by STRØHM.ENERGY.", href: "FLUXX - PRODUCT - Products - EN.dc.html", linkLabel: "FLUXX range", fluxxOnlyLink: true },
  { key: "europe", t: "European by design", b: "Designed for European grids and rules, in European hands.", href: "MOEBIUS - PRODUCT - Responsibility - EN.dc.html", linkLabel: "Responsibility" },
  { key: "commission", t: "One scan, one record", b: "Every product identifies itself by QR and NFC. Commissioning maps the system and writes the technical file, diagrams and forms automatically.", href: "MOEBIUS - SUPPORT - Commissioning - EN.dc.html", linkLabel: "Fast commissioning" },
  { key: "rules", t: "Rules you set, decisions you can see", b: "You set the reserve, price and power limits. EMON plans inside them and shows why it acted." },
  { key: "furniture", t: "Batteries as furniture", b: "POUF, DIVAN and BENCH are batteries built into a seat or bench, for the living room instead of the garage.", href: "FLUXX - PRODUCT - Products - EN.dc.html#monobloc", linkLabel: "FLUXX furniture batteries" },
];
class Component extends DCLogic {
  renderVals() {
    const scope = this.props.scope ?? "home";
    const list = ALL.filter((p) => scope === "fluxx" || p.key !== "furniture");
    return { points: list.map((p, i) => ({ ...p, n: String(i + 1).padStart(2, "0"), hasLink: !!p.href && !(p.fluxxOnlyLink && scope !== "fluxx"), href: p.href || "", linkLabel: p.linkLabel || "" })) };
  }
}
</script>
