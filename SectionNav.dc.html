<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="strohm-type.css">
<script src="./nav-overflow.js"></script>
<script src="./section-nav-data.js"></script>
<style>
  [data-sn] a:focus, [data-sn] button:focus { outline: none; }
  [data-sn] a:focus-visible, [data-sn] button:focus-visible { outline: 2px solid #3A3A3A; outline-offset: 4px; }
  .sn-switch .sn-code { transition: color 140ms ease-out; }
  .sn-switch:hover .sn-code, .sn-switch:focus-visible .sn-code { color: var(--c); }
  .sn-tabs { scrollbar-width: none; }
  .sn-tabs::-webkit-scrollbar { display: none; }
</style>
</helmet>
<div data-sn="" ref="{{ rootRef }}" style="height:49px;font-family:var(--font-web);">
<div ref="{{ barRef }}" style="position:{{ barPosition }};top:{{ barTop }};left:0;right:0;z-index:900;background:#FFFFFF;border-bottom:1px solid #DDDDDD;">
  <div style="max-width:calc(1312px + 2 * var(--web-side));margin:0 auto;height:48px;box-sizing:border-box;display:flex;align-items:center;gap:24px;padding:0 clamp(16px,3vw,40px);">

    <!-- SWITCHER -->
    <button type="button" class="sn-switch" aria-expanded="{{ switchExpanded }}" aria-controls="sn-switch-panel" onClick="{{ toggleSwitch }}" style="--c:{{ accent }};flex:none;cursor:pointer;background:none;border:none;padding:0;display:flex;align-items:baseline;gap:8px;font-family:inherit;white-space:nowrap;">
      <span class="sn-code" style="font-size:15px;font-weight:700;letter-spacing:0.02em;color:#4F4F4E;">{{ code }}</span>
      <svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="#6E6E6E" stroke-width="1.3" style="flex:none;align-self:center;transition:transform .2s ease;transform:rotate({{ switchRot }});"><polyline points="2,3.5 5,6.5 8,3.5"></polyline></svg>
      <span style="font-size:var(--web-min-size);font-weight:300;color:#6E6E6E;line-height:var(--web-min-lh);">· {{ category }}</span>
    </button>

    <!-- TABS + EXTRA -->
    <nav aria-label="{{ navLabel }}" class="sn-tabs" style="flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:24px;overflow-x:auto;height:48px;">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
        <div ref="{{ t.ref }}" style="flex:none;display:flex;align-items:center;gap:4px;height:48px;border-bottom:2px solid {{ t.underline }};box-sizing:border-box;">
          <a href="{{ t.href }}" aria-current="{{ t.ariaCurrent }}" style="text-decoration:none;font-size:var(--web-nav-size);font-weight:{{ t.weight }};color:{{ t.color }};white-space:nowrap;" style-hover="color:#4F4F4E;">{{ t.label }}</a>
          <sc-if value="{{ t.hasItems }}" hint-placeholder-val="{{ false }}">
            <button type="button" aria-label="{{ t.menuLabel }}" aria-expanded="{{ t.expanded }}" aria-controls="sn-dd" onClick="{{ t.onToggle }}" style="cursor:pointer;background:none;border:none;padding:0;width:20px;height:28px;display:flex;align-items:center;justify-content:center;color:#6E6E6E;" style-hover="color:#4F4F4E;">
              <svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3" style="transition:transform .2s ease;transform:rotate({{ t.rot }});"><polyline points="2,3.5 5,6.5 8,3.5"></polyline></svg>
            </button>
          </sc-if>
        </div>
      </sc-for>
      <sc-if value="{{ hasExtra }}" hint-placeholder-val="{{ false }}">
        <div style="flex:none;display:flex;align-items:center;gap:16px;padding-left:8px;border-left:1px solid #DDDDDD;height:20px;">
          <sc-for list="{{ extra }}" as="x" hint-placeholder-count="1">
            <a href="{{ x.href }}" aria-current="{{ x.ariaCurrent }}" style="text-decoration:none;font-size:12px;font-weight:{{ x.weight }};color:{{ x.color }};white-space:nowrap;" style-hover="color:#4F4F4E;">{{ x.label }}</a>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
        <div style="flex:none;display:flex;align-items:center;gap:16px;padding-right:4px;">
          <sc-if value="{{ hasTool }}" hint-placeholder-val="{{ false }}">
            <a href="{{ toolHref }}" style="text-decoration:none;font-size:12px;font-weight:400;color:#3A3A3A;white-space:nowrap;">{{ toolLabel }}</a>
          </sc-if>
          <a style-hover="background:#5F5E5E;color:#F4F4F4;" href="{{ actionHref }}" style="text-decoration:none;display:inline-flex;align-items:center;height:32px;padding:0 14px;background:#4F4F4E;color:#F4F4F4;font-size:var(--web-nav-size);font-weight:var(--web-nav-weight);border-radius:2px;white-space:nowrap;">{{ actionLabel }}</a>
        </div>
      </sc-if>
    </nav>

    <!-- RIGHT (desktop) -->
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <div style="flex:none;display:flex;align-items:center;gap:20px;">
        <sc-if value="{{ hasTool }}" hint-placeholder-val="{{ false }}">
          <a href="{{ toolHref }}" style="text-decoration:none;font-size:var(--web-nav-size);font-weight:var(--web-nav-weight);color:#3A3A3A;white-space:nowrap;" style-hover="color:#4F4F4E;">{{ toolLabel }}</a>
        </sc-if>
        <a href="{{ actionHref }}" style="text-decoration:none;display:inline-flex;align-items:center;height:32px;padding:0 16px;background:#4F4F4E;color:#F4F4F4;font-size:var(--web-nav-size);font-weight:var(--web-nav-weight);border-radius:2px;white-space:nowrap;" style-hover="background:#5F5E5E;color:#F4F4F4;">{{ actionLabel }}</a>
      </div>
    </sc-if>
  </div>

  <!-- SWITCHER PANEL: same ProductsPanel as the NavBar Products menu -->
  <sc-if value="{{ switchOpen }}" hint-placeholder-val="{{ false }}">
    <div id="sn-switch-panel" style="position:absolute;top:100%;left:0;right:0;background:#FFFFFF;border-bottom:1px solid #DDDDDD;max-height:calc(100vh - 140px);overflow-y:auto;">
      <dc-import name="ProductsPanel" kind="products" current="{{ code }}" mobile="{{ isMobile }}" hint-size="100%,380px"></dc-import>
    </div>
  </sc-if>

  <!-- TAB DROPDOWN -->
  <sc-if value="{{ ddOpen }}" hint-placeholder-val="{{ false }}">
    <div id="sn-dd" role="region" aria-label="{{ ddLabel }}" style="position:absolute;top:100%;left:{{ ddLeft }};min-width:220px;max-width:calc(100vw - 32px);background:#FFFFFF;border:1px solid #DDDDDD;border-top:none;padding:8px 0;box-sizing:border-box;">
      <sc-for list="{{ ddItems }}" as="d" hint-placeholder-count="2">
        <a href="{{ d.href }}" style="text-decoration:none;display:flex;align-items:center;min-height:40px;padding:0 20px;font-size:var(--web-nav-size);font-weight:var(--web-nav-weight);color:#3A3A3A;white-space:nowrap;" style-hover="color:#4F4F4E;background:#F4F4F4;">{{ d.label }}</a>
      </sc-for>
    </div>
  </sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:120},&quot;brand&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ANDO&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;overview&quot;,&quot;products&quot;,&quot;installation&quot;,&quot;support&quot;],&quot;default&quot;:&quot;overview&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
// SectionNav: one bar for every brand. Data: section-nav-data.js. Active tab is derived from the current page file name,
// falling back to the `active` prop. Desktop: pins under the fixed 64px NavBar once scrolled to it. Mobile (≤1023px): not sticky.
const MOBILE_MAX = 1023, NAV_H = 64;

class Component extends DCLogic {
  state = { switchOpen: false, dd: null, ddLeft: 0, pinned: false,
    mobile: typeof window !== "undefined" && window.innerWidth <= MOBILE_MAX };
  _tabEls = {};

  componentDidMount() {
    if (!window.STROHM_SECTIONNAV) this._t = setInterval(() => { if (window.STROHM_SECTIONNAV) { clearInterval(this._t); this.forceUpdate(); } }, 50);
    this._onScroll = () => {
      if (this.state.mobile || !this._root) { if (this.state.pinned) this.setState({ pinned: false }); return; }
      // Pages without the global NavBar pin at 0 instead of 64px.
      this._navH = document.querySelector("[data-nb]") ? NAV_H : 0;
      const p = this._root.getBoundingClientRect().top <= this._navH;
      if (p !== this.state.pinned) this.setState({ pinned: p });
    };
    this._onResize = () => { const m = window.innerWidth <= MOBILE_MAX; if (m !== this.state.mobile) this.setState({ mobile: m, switchOpen: false, dd: null }); this._onScroll(); };
    this._onKey = (e) => { if (e.key === "Escape" && (this.state.switchOpen || this.state.dd)) this.setState({ switchOpen: false, dd: null }); };
    this._onDown = (e) => { if ((this.state.switchOpen || this.state.dd) && this._bar && !this._bar.contains(e.target)) this.setState({ switchOpen: false, dd: null }); };
    window.addEventListener("scroll", this._onScroll, { passive: true });
    window.addEventListener("resize", this._onResize);
    document.addEventListener("keydown", this._onKey);
    document.addEventListener("mousedown", this._onDown);
    this._onResize();
  }
  componentWillUnmount() {
    if (this._t) clearInterval(this._t);
    window.removeEventListener("scroll", this._onScroll);
    window.removeEventListener("resize", this._onResize);
    document.removeEventListener("keydown", this._onKey);
    document.removeEventListener("mousedown", this._onDown);
  }

  toggleDd(key) {
    if (this.state.dd === key) { this.setState({ dd: null }); return; }
    const el = this._tabEls[key], bar = this._bar;
    let left = 0;
    if (el && bar) left = Math.max(8, el.getBoundingClientRect().left - bar.getBoundingClientRect().left - 12);
    this.setState({ dd: key, ddLeft: left, switchOpen: false });
  }

  renderVals() {
    const st = this.state;
    const data = window.STROHM_SECTIONNAV && window.STROHM_SECTIONNAV.BRANDS[this.props.brand || "ANDO"];
    const page = (() => { try { return decodeURIComponent(location.pathname.split("/").pop() || ""); } catch (e) { return ""; } })();
    const tabsSrc = data ? data.tabs : [];
    const onPage = (href) => !!href && href.split("#")[0] === page;
    let activeKey = null;
    tabsSrc.forEach((t) => { if (onPage(t.href) || (t.items || []).some((i) => onPage(i.href))) activeKey = activeKey || t.key; });
    const extraSrc = data ? data.extra || [] : [];
    const extraActive = extraSrc.find((x) => onPage(x.href));
    if (!activeKey && !extraActive && this.props.active) activeKey = this.props.active;
    const dd = tabsSrc.find((t) => t.key === st.dd);
    const on = "#4F4F4E", off = "#6E6E6E";
    return {
      rootRef: (el) => { this._root = el; },
      barRef: (el) => { this._bar = el; },
      barPosition: (!st.mobile && st.pinned) ? "fixed" : "relative",
      barTop: (!st.mobile && st.pinned) ? (this._navH ?? NAV_H) + "px" : "0px",
      isMobile: st.mobile, isDesktop: !st.mobile,
      code: data ? data.code : "", category: data ? data.category : "", accent: data ? data.accent : "#4F4F4E",
      navLabel: (data ? data.code : "") + " sections",
      switchOpen: st.switchOpen, switchExpanded: st.switchOpen ? "true" : "false", switchRot: st.switchOpen ? "180deg" : "0deg",
      toggleSwitch: () => this.setState((s) => ({ switchOpen: !s.switchOpen, dd: null })),
      tabs: tabsSrc.map((t) => {
        const act = activeKey === t.key, open = st.dd === t.key;
        return {
          label: t.label, href: t.href,
          ref: (el) => { if (el) this._tabEls[t.key] = el; },
          weight: act ? 700 : 400, color: act ? on : off, underline: act ? "#1E1E1E" : "transparent",
          ariaCurrent: act ? "page" : "false",
          hasItems: (t.items || []).length > 0,
          expanded: open ? "true" : "false", rot: open ? "180deg" : "0deg",
          menuLabel: "More in " + t.label,
          onToggle: () => this.toggleDd(t.key),
        };
      }),
      hasExtra: extraSrc.length > 0,
      extra: extraSrc.map((x) => { const act = extraActive === x; return { label: x.label, href: x.href, weight: act ? 700 : 400, color: act ? on : off, ariaCurrent: act ? "page" : "false" }; }),
      actionLabel: data && data.action ? data.action.label : "", actionHref: data && data.action ? data.action.href : "#",
      hasTool: !!(data && data.tool), toolLabel: data && data.tool ? data.tool.label : "", toolHref: data && data.tool ? data.tool.href : "#",
      ddOpen: !!dd, ddItems: dd ? dd.items : [], ddLabel: dd ? dd.label + " pages" : "",
      ddLeft: st.mobile ? "0px" : st.ddLeft + "px",
    };
  }
}

</script>
</body>
</html>
