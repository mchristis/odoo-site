<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const TC = (w) => `[TO CONFIRM: ${w}]`;
    return {
      intro: "Tested cables and connectors, declared fire classes, restricted substances and a documented route for offcuts and end-of-life material. Every claim on this page is linked to a document.",
      durability: [
        { test: "Solar cable for PV systems", standard: "EN 50618 (applicable)", result: TC("result per cable type") },
        { test: "Reaction-to-fire class of cables", standard: "EN 50575 under the CPR, class per EN 13501-6 (applicable)", result: TC("Eca / Dca / Cca class per cable") },
        { test: "Connectors for DC in PV systems", standard: "EN IEC 62852 (applicable)", result: TC("result per connector type") },
        { test: "Installation of PV power supply systems", standard: "IEC 60364-7-712 (installation rule, applicable)", result: "Applied by the installer" },
      ],
      materials: [
        { label: "Insulation", headline: "Halogen-free where it matters.", value: TC("halogen-free and low-smoke insulation per cable type"), dir: "TOGU_RESPONSIBILITY_MATERIALS_CABLE_01 · cable cross-section detail · 16:10 · placeholder (P2)" },
        { label: "Declarations", headline: "Substances declared, not assumed.", value: "RoHS and REACH declarations per product; declaration of performance (DoP) per CPR cable. " + TC("which declarations exist"), dir: "TOGU_RESPONSIBILITY_MATERIALS_DOP_01 · declaration of performance preview · 16:10 · placeholder (P2)" },
      ],
      certs: [
        { code: "CE", label: "CE marking under the applicable directives and the CPR " + TC("per product") },
        { code: "ISO 9001", label: "Quality management " + TC("held for TOGU production") },
        { code: "ISO 14001", label: "Environmental management " + TC("held for TOGU production") },
      ],
      packaging: TC("drum and reel return, packaging materials and pallet take-back"),
      eol: ["Component in use", "Offcuts collected on site", "Copper and aluminium recovered", "Electrical parts collected under the WEEE Directive 2012/19/EU where applicable", "Recycling record", "Closed ownership record"],
    };
  }
}
</script>
