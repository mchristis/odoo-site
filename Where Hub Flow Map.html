      gg.append('circle').attr('cx', p[0]).attr('cy', p[1]).attr('r', r).attr('fill', col).attr('stroke', '#FFFFFF').attr('stroke-width', 1.5);
      gg.append('circle').attr('cx', p[0]).attr('cy', p[1]).attr('r', 14).attr('fill', 'transparent');
      bindHub(gg.node(), id, p, i);
    }
    function point(name, p, note, delay) {
      var gg = gp.append('g').attr('class', 'pt fade').style('transition-delay', (reduced ? 0 : delay) + 'ms');
      gg.append('circle').attr('cx', p[0]).attr('cy', p[1]).attr('r', 4).attr('fill', '#FFFFFF').attr('stroke', '#4F4F4E').attr('stroke-width', 1.2);
      gg.append('circle').attr('cx', p[0]).attr('cy', p[1]).attr('r', 12).attr('fill', 'transparent');
      bindInfo(gg.node(), p, '<div class="c">' + esc(name) + '</div><div class="m">' + esc(note) + '</div>');
    }
    var P = {}; Object.keys(GEO).forEach(function (id) { P[id] = pj(GEO[id], id); });
    if (sc.id === 'europe') {
      var M = P.maastricht;
      RAM.forEach(function (r, k) { var p = proj(r[2]); flow(M, p, 0.22); point(RAMN[r[0]] || r[1], p, 'Served from the Maastricht warehouse', 300 + k * 140); label(p, RAMN[r[0]] || r[1], null, r[3], 900 + k * 220); });
      stock([].concat.apply([], RAM.map(function (r, k) { return spread(r[2], 2.4, 2, 40 + k); })), 5);
      dot('maastricht', M, true, false); label(M, 'Maastricht', null, [-11, 16, 'l'], 200);
    } else if (sc.id === 'uk') {
      var Lo = P.london;
      UKP.forEach(function (u, k) { var p = proj(u[1]); flow(Lo, p, 0.25); point(u[0], p, 'Served from the London warehouse', 300 + k * 160); label(p, u[0], null, u[2], 900 + k * 260); });
      stock([].concat.apply([], UKP.map(function (u, k) { return spread(u[1], 0.9, 2, 70 + k); })), 5);
      dot('london', Lo, true, false); label(Lo, 'London', null, [11, 14, 'r'], 200);
    } else if (sc.hubs) {
      var nP = 0;
      sc.hubs.forEach(function (id, hk) {
        var Hp = P[id];
        (KEYM[id] || []).filter(keep).forEach(function (m) { var p = proj(m[1]); flow(Hp, p, 0.22); point(m[0], p, 'Served from ' + hub(id).city, 300 + nP * 120, 0); label(p, m[0], null, m[2], 900 + (nP++) * 200); });
        stock([].concat(spread(GEO[id], 3, 3, 150 + hk), [].concat.apply([], (KEYM[id] || []).map(function (m, k) { return spread(m[1], 2.5, 1, 160 + hk * 10 + k); }))), 5);
      });
      sc.hubs.forEach(function (id) { dot(id, P[id], true, false); label(P[id], hub(id).city, null, HLBL[id], 200); });
    } else if (sc.id === 'india') {
      var De = P.delhi;
      INDP.filter(keep).forEach(function (u, k) { var p = proj(u[1]); if (u[0] !== 'India') flow(De, p, 0.22); point(u[0], p, 'Served from Delhi', 300 + k * 160); label(p, u[0], null, u[2], 900 + k * 260); });
      flow(De, proj(INDP[0][1]), 0.2);
      stock([].concat(spread([78.5, 21], 7, 7, 120), spread([77.2, 28.6], 2, 2, 121), spread([90.3, 23.7], 1, 1, 122), spread([80.7, 7.9], 0.8, 1, 123)), 5);
      dot('delhi', De, true, false); label(De, 'Delhi', null, [-11, -14, 'l'], 200);
    } else {
      var HK = P.hongkong;
      gl.append('path').attr('class', 'sup fade').attr('d', arc(P.taichung, P.shenzhen, 0.3)); gl.append('path').attr('class', 'sup fade').attr('d', arc(P.shenzhen, P.hongkong, 0.3));
      REGIONAL.forEach(function (id) { flow(HK, P[id], 0.16); });
      stock([].concat.apply([], SALES.map(function (id, k) { return spread(GEO[id], id === 'maastricht' ? 5 : id === 'london' ? 2.2 : 5, id === 'maastricht' ? 5 : 3, 90 + k); })), 3.5);
      ORDER.forEach(function (id, k) { dot(id, P[id], id === 'hongkong', false); if (id !== 'shenzhen' && id !== 'taichung') label(P[id], hub(id).city, null, LBLW[id], 500 + k * 200); });
    }
    return { g: g, labs: labs, sc: sc, P: P, gact: gact, world: !sc.box };
  }

  function bindHub(n, id, p, li) {
    n.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') hubInfo(id, p, li); });
    n.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') release(li); });
    n.addEventListener('focus', function () { hubInfo(id, p, li); });
    n.addEventListener('blur', function () { release(li); });
    n.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); post({ hubPick: id }); } });
    n.addEventListener('click', function (e) { if (e.pointerType === 'touch' || e.pointerType === 'pen') { if (tapId === id) post({ hubPick: id }); else { tapId = id; hubInfo(id, p, li); } return; } post({ hubPick: id }); });
  }
  function bindInfo(n, p, html) {
    n.addEventListener('pointerenter', function () { hold(); showCard(p, html); });
    n.addEventListener('pointerleave', function () { release(); });
    n.addEventListener('click', function () { hold(); showCard(p, html); });
  }
  function hubInfo(id, p, li) {
    hold();
    var h = hub(id), L = layers[li];
    var html = '<div class="c">' + esc(h.city) + '</div><div class="m">' + esc(h.country) + '</div><div class="g">' + esc(h.group) + '</div><div class="m">' + esc(h.short) + '</div>' + (h.teams && h.teams.length ? '<ul>' + h.teams.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' : '');
    showCard(p, html);
    if (L && L.world) {
      L.gact.selectAll('*').remove();
      var col = ACOL[ACT[id] || 'sales'];
      (LINKS[id] || []).forEach(function (to) { var el = L.gact.append('path').attr('class', 'al').attr('stroke', col).attr('d', arc(L.P[id], L.P[to], 0.18)).node(), len = el.getTotalLength(); el.style.strokeDasharray = len; el.style.strokeDashoffset = reduced ? 0 : len; requestAnimationFrame(function () { requestAnimationFrame(function () { el.style.strokeDashoffset = 0; }); }); });
    }
  }
  function showCard(p, html) {
    card.innerHTML = html;
    var cw = card.offsetWidth, ch = card.offsetHeight, x = p[0] + 16, y = p[1] - ch / 2;
    if (x + cw > W - 6) x = p[0] - 16 - cw; x = Math.max(6, x); y = Math.max(6, Math.min(H - ch - 6, y));
    card.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px)'; card.style.opacity = 1;
  }
  function hold() { held = true; clearTimeout(resumeT); stopTimer(); }
  function release(li) {
    card.style.opacity = 0; tapId = null;
    layers.forEach(function (L) { L.gact.selectAll('*').remove(); });
    clearTimeout(resumeT); resumeT = setTimeout(function () { held = false; startTimer(); }, 2000);
  }

  function renderTabs() {
    tabsEl.innerHTML = '';
    SCN.forEach(function (sc, i) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = sc.tab; b.innerHTML += '<i></i>'; if (i === cur) b.className = 'cur';
      b.addEventListener('click', function () { go(i); clearTimeout(resumeT); held = false; startTimer(); });
      tabsEl.appendChild(b);
    });
    var bar = tabsEl.children[cur] && tabsEl.children[cur].querySelector('i');
    if (bar && !reduced && !held) { bar.style.transition = 'none'; bar.style.width = '0'; requestAnimationFrame(function () { requestAnimationFrame(function () { bar.style.transition = 'width ' + DUR + 'ms linear'; bar.style.width = '100%'; }); }); }
    else if (bar) bar.style.width = '100%';
  }
  function go(i) {
    var prev = layers[cur], next = layers[i]; if (!next) return;
    var zoomIn = !!next.sc.box && (!prev || !prev.sc.box || i > cur);
    layers.forEach(function (L, k) { if (L === next || L === prev) return; L.g.style.opacity = 0; L.g.classList.remove('on'); L.labs.style.opacity = 0; L.labs.classList.remove('on'); });
    if (prev && prev !== next) { prev.g.style.transform = reduced ? 'none' : (zoomIn ? 'scale(1.12)' : 'scale(0.94)'); prev.g.style.opacity = 0; prev.labs.style.opacity = 0; prev.g.classList.remove('on'); prev.labs.classList.remove('on'); }
    next.g.style.transition = 'none'; next.g.style.transform = reduced ? 'none' : (zoomIn ? 'scale(0.9)' : 'scale(1.06)');
    next.g.getBoundingClientRect();
    next.g.style.transition = '';
    setTimeout(function () { next.g.style.opacity = 1; next.g.style.transform = 'none'; next.labs.style.opacity = 1; setTimeout(function () { next.g.classList.add('on'); next.labs.classList.add('on'); }, reduced ? 0 : 500); }, 30);
    if (prev && prev !== next) setTimeout(function () { if (layers[cur] !== prev) { prev.g.classList.remove('on'); prev.labs.classList.remove('on'); } }, 900);
    cur = i; renderTabs(); post({ hubScene: SCN[i].id });
  }
  function startTimer() { stopTimer(); if (reduced || held) return; renderTabs(); timer = setTimeout(function () { go((cur + 1) % SCN.length); startTimer(); }, DUR); }
  function stopTimer() { clearTimeout(timer); timer = null; var bar = tabsEl.children[cur] && tabsEl.children[cur].querySelector('i'); if (bar) { var w = getComputedStyle(bar).width; bar.style.transition = 'none'; bar.style.width = w; } }

  function build() {
    W = Math.round(wrap.clientWidth); if (!W || !feats) return;
    H = Math.round(Math.max(280, Math.min(W * 0.44, 600)));
    svg.selectAll('*').remove(); layers.forEach(function (L) { L.labs.remove(); });
    svg.attr('viewBox', '0 0 ' + W + ' ' + H).attr('height', H);
    layers = SCN.map(makeLayer);
    post({ hubMapH: H + tabsEl.offsetHeight + 14 });
    var c = cur; cur = c; layers[c].g.style.opacity = 1; layers[c].labs.style.opacity = 1; layers[c].g.classList.add('on'); layers[c].labs.classList.add('on');
    renderTabs(); startTimer(); post({ hubScene: SCN[cur].id });
  }

  window.addEventListener('message', function (e) { var d = e.data || {}; if (d.hubData) { HUBS = d.hubData; if (feats) build(); } });

  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(function (r) { return r.json(); }).then(function (topo) {
    feats = topojson.feature(topo, topo.objects.countries).features.filter(function (f) { return f.id !== '010' && f.properties.name !== 'Antarctica'; });
    land = { type: 'FeatureCollection', features: feats };
    var l = document.getElementById('load'); if (l) l.remove();
    var lw = 0, rt = null;
    function check(delay) { clearTimeout(rt); rt = setTimeout(function () { var w = Math.round(wrap.clientWidth); if (w && Math.abs(w - lw) > 16) { lw = w; build(); } }, delay); }
    new ResizeObserver(function () { check(lw ? 260 : 0); }).observe(wrap);
    window.addEventListener('resize', function () { check(lw ? 260 : 0); });
    setInterval(function () { var w = Math.round(wrap.clientWidth); if (w && Math.abs(w - lw) > 16) check(0); }, 500);
    post({ hubMapReady: true });
  }).catch(function () { var l = document.getElementById('load'); if (l) l.textContent = 'Map could not load'; post({ hubMapH: 120 }); });
  post({ hubMapReady: true }); post({ hubMapH: 420 });
})();
</script>
