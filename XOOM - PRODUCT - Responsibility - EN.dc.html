class Component extends DCLogic {
  renderVals() {

    return {
      intro: "Electrical safety, outdoor durability, declared materials and a documented end-of-life route. Every claim on this page is linked to a document.",
      durability: [
        { test: "Conductive charging safety", standard: "IEC 61851-1 (applicable)", result: TC("result per family") },

        { test: "Ingress protection", standard: "IEC 60529 (applicable)", result: TC("IP rating per family") },
        { test: "Impact protection", standard: "IEC 62262 (applicable)", result: TC("IK rating per family") },
        { test: "Electromagnetic compatibility", standard: "IEC 61851-21-2 (applicable)", result: TC("result per family") },
      ],
      materials: [
        { label: "Housing", headline: "Housing materials, declared per family.", value: TC("housing and cable materials per family") + " The material record is held at serial level.", dir: "XOOM_RESPONSIBILITY_MATERIALS_HOUSING_01 · housing and cable material detail · 16:10 · placeholder (P2)" },

        { code: "ISO 14001", label: "Environmental management " + TC("held for XOOM facilities") },
        { code: "ISO 45001", label: "Occupational health and safety " + TC("held for XOOM facilities") },

      packaging: TC("packaging materials and pallet take-back"),
      eol: [
        "Charger in use",
        "Removal by a qualified electrician",
        "Separate collection under the WEEE Directive 2012/19/EU",
        "Approved treatment and material recovery",
        "Recycling record",
        "Closed ownership record",

  }
